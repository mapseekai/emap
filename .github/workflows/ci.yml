name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.15.1'

jobs:
  core:
    name: Core quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run browser:install
      - run: sudo apt-get install -y mesa-vulkan-drivers libgl1-mesa-dri xvfb
      - name: Verify browser GPU adapters and pixel readback
        run: xvfb-run -a node scripts/check-browser-gpu.mjs
        timeout-minutes: 2
      # One build, one checkout, and exactly the same gate as npm publication.
      - run: pnpm run release:verify
        shell: xvfb-run -a bash -e {0}

  node-compatibility:
    name: Minimum Node compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run api:check-surface
