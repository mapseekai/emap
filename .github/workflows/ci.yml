name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.15.1'

jobs:
  core:
    name: Core quality and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm run format:check
      - name: Typecheck
        run: pnpm run typecheck
      - name: Check root public API surface
        run: pnpm run api:check-surface
      - name: Unit tests
        run: pnpm run test:run
      - name: Build
        run: pnpm run build
      - name: Browser bundle smoke test
        run: pnpm run bundle:smoke

  node-compatibility:
    name: Minimum Node compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run api:check-surface

  duckdb:
    name: DuckDB-Wasm integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:duckdb

  browser:
    name: Real browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Firefox and WebKit runtimes
        run: pnpm run browser:install
      - name: Run real-browser example smoke tests
        run: pnpm run test:browser
      - name: Verify polygon fill pixels in all browsers
        env:
          EMAP_AUDIT_BROWSERS: chrome,firefox,webkit
        run: pnpm run test:rendering

  docs:
    name: Documentation and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build API reference
        run: pnpm run api:build
      - name: Check translations
        run: pnpm run docs:check-i18n
      - name: Check public API catalog
        run: pnpm run docs:check-api
      - name: Check examples manifest
        run: pnpm run examples:check

  package-security:
    name: Package and production security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build publishable files
        run: pnpm run build
      - name: Verify package contents
        run: pnpm pack --dry-run
      - name: Audit production dependency graph
        run: pnpm run audit:prod
