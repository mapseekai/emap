name: GPU adapter probe
on:
  push:
    branches: [codex/linux-gpu-adapter-probe]
permissions:
  contents: read
jobs:
  gpu:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run browser:install
      - run: caffeinate -di node scripts/check-browser-gpu.mjs
      - run: pnpm run build && pnpm run examples:build
      - run: caffeinate -di pnpm exec playwright test gpu-loading-probe.spec.mjs --workers=1 --retries=0 --reporter=line
      - run: caffeinate -di pnpm exec playwright test geotiff.spec.mjs luma-25d.spec.mjs luma-icons.spec.mjs --grep 'fractional|perspective|icons retain' --workers=1 --retries=0 --max-failures=3
