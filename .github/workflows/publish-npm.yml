name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 100
    environment:
      name: npm
      url: https://www.npmjs.com/package/@mapseekai/emap

    steps:
      - name: Resolve release tag
        id: release-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$RELEASE_TAG"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          fi
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release-tag.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v7
        with:
          node-version: '22.18'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Use npm trusted publishing
        run: npm install --global npm@^11.15.0

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$VERSION"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run browser:install
      - name: Verify browser GPU adapters and pixel readback
        run: caffeinate -di node scripts/check-browser-gpu.mjs
        timeout-minutes: 2
      - name: Verify this release checkout and its publishable artifacts
        run: pnpm run release:verify
        shell: caffeinate -di bash -e {0}

      - name: Publish package
        run: npm publish --access public --ignore-scripts
