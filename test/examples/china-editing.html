<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap - China GeoJSON/TopoJSON Editing</title>
  <style>
    * {
      margin: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: -apple-system, "Microsoft YaHei", sans-serif;
      background: #1a1a2e;
      color: #eee;
    }

    #header {
      padding: 10px 16px;
      background: #16213e;
      display: flex;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #0f3460;
      flex-wrap: wrap;
    }

    #header strong {
      color: #e94560;
    }

    #map {
      flex: 1;
      background: #ffffff;
      position: relative;
    }

    .source-list {
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .source-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .source-item .url {
      color: #6db3f2;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
    }

    .load-btn {
      padding: 3px 10px;
      border: 1px solid #0f3460;
      border-radius: 4px;
      background: #16213e;
      color: #eee;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .load-btn:hover {
      background: #0f3460;
    }

    .load-btn.active {
      background: #e94560;
      border-color: #e94560;
    }

    .load-btn:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    #event-log {
      position: absolute;
      bottom: 50px;
      right: 10px;
      width: 360px;
      max-height: 200px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      font-family: monospace;
      color: #7cfc00;
      z-index: 100;
      pointer-events: auto;
    }

    #event-log .log-entry {
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
    }

    .info {
      margin-left: auto;
      font-size: 0.85em;
      color: #aaa;
    }

    #loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(26, 26, 46, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      z-index: 200;
      transition: opacity 0.3s;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #0f3460;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="header">
    <strong>Emap</strong>
    <div class="source-list">
      <div class="source-item">
        <button class="load-btn" id="btn-topojson">加载</button>
        <span class="url">https://geojson.cn/api/china/1.6.3/china.topo.json</span>
      </div>
      <div class="source-item">
        <button class="load-btn" id="btn-geojson">加载</button>
        <span class="url">https://geojson.cn/api/china/1.6.3/china.json</span>
      </div>
    </div>
    <div class="info" id="status">点击「加载」按钮加载数据</div>
  </div>
  <div id="map">
    <div id="loading-overlay" class="hidden">
      <div class="spinner"></div>
      <span id="loading-text">Loading...</span>
    </div>
    <div id="event-log">
      <div style="color:#aaa; margin-bottom:6px;">vertex_moved events:</div>
    </div>
  </div>

  <link rel="stylesheet" href="../../src/ui/controls.css" />
  <script src="../../dist/emap-dev.js"></script>
  <script>
    const { Emap, TopologySource, EditToolbar } = emap;

    const map = new Emap({ container: "map" });

    map.addControl(new emap.NavigationControl(), "top-left");
    map.addControl(new EditToolbar(), "top-left");
    map.addControl(new emap.BasemapControl(), "top-right");
    map.addControl(
      new emap.StatusControl({ alignment: "right", showEPSG: true }),
      "bottom-right"
    );

    // vertex_moved event log
    const logEl = document.getElementById("event-log");
    map.on("vertex_moved", (e) => {
      const entry = document.createElement("div");
      entry.className = "log-entry";
      const coords = e.coords
        ? `[${e.coords[0].toFixed(6)}, ${e.coords[1].toFixed(6)}]`
        : "?";
      const moved = Array.isArray(e.vertexIds) ? e.vertexIds.join(",") : "?";
      entry.textContent = `id=${e.id} vtx=[${moved}] → ${coords}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    });

    // ---- Data sources ----
    const SOURCES = {
      topojson: {
        url: "https://geojson.cn/api/china/1.6.3/china.topo.json",
        label: "TopoJSON",
        filename: "china.topo.json",
      },
      geojson: {
        url: "https://geojson.cn/api/china/1.6.3/china.json",
        label: "GeoJSON",
        filename: "china.json",
      },
    };

    const status = document.getElementById("status");
    const overlay = document.getElementById("loading-overlay");
    const loadingText = document.getElementById("loading-text");
    const btnTopo = document.getElementById("btn-topojson");
    const btnGeo = document.getElementById("btn-geojson");
    let currentSourceId = null;

    function showLoading(msg) {
      loadingText.textContent = msg;
      overlay.classList.remove("hidden");
    }
    function hideLoading() {
      overlay.classList.add("hidden");
    }
    function setActiveButton(id) {
      btnTopo.classList.toggle("active", id === "topojson");
      btnGeo.classList.toggle("active", id === "geojson");
    }
    function setButtonsDisabled(disabled) {
      btnTopo.disabled = disabled;
      btnGeo.disabled = disabled;
    }

    async function loadFromUrl(sourceId) {
      if (currentSourceId === sourceId) return;
      const info = SOURCES[sourceId];

      setButtonsDisabled(true);
      setActiveButton(sourceId);
      showLoading(`正在获取 ${info.label}...`);

      try {
        if (currentSourceId) {
          try { map.removeSource(currentSourceId); } catch (_) { }
        }

        const resp = await fetch(info.url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const buf = await resp.arrayBuffer();
        const content = new Uint8Array(buf);

        showLoading(`正在处理 ${info.label}...`);

        const source = new TopologySource(sourceId);
        await source.load({ filename: info.filename, content });
        map.addSource(sourceId, source);
        map.setExtent(source.getExtent());

        currentSourceId = sourceId;
        status.textContent = `${info.label} 已加载 — 点击 ✏ 编辑顶点`;
      } catch (err) {
        console.error(err);
        status.textContent = `错误: ${err.message}`;
        setActiveButton(null);
      } finally {
        hideLoading();
        setButtonsDisabled(false);
      }
    }

    btnTopo.addEventListener("click", () => loadFromUrl("topojson"));
    btnGeo.addEventListener("click", () => loadFromUrl("geojson"));

    window.addEventListener("resize", () => map.resize());
  </script>
</body>

</html>
