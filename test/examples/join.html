<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 属性表连接 (Join)</title>
  <style>
    body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; }
    #left { width: 360px; padding: 10px; background: #2c3e50; color: white; display: flex; flex-direction: column; gap: 8px; font-size: 13px; overflow-y: auto; }
    #left label { display: flex; flex-direction: column; gap: 2px; }
    #left input[type="text"], #left textarea { padding: 4px 6px; font-size: 13px; border: 1px solid #4a5d70; border-radius: 3px; background: white; color: black; font-family: monospace; }
    #left textarea { resize: vertical; min-height: 100px; }
    #left button { padding: 6px 12px; background: #16a085; color: white; border: 0; border-radius: 3px; cursor: pointer; font-size: 13px; }
    #left button:disabled { background: #7f8c8d; cursor: not-allowed; }
    #right { flex: 1; display: flex; flex-direction: column; }
    #map { flex: 1; background: #ffffff; position: relative; outline: none; }
    #attrs { max-height: 200px; overflow: auto; background: #f4f4f4; padding: 8px; font-family: monospace; font-size: 12px; border-top: 1px solid #ccc; }
    .hint { opacity: 0.85; font-size: 12px; }
  </style>
</head>

<body>
  <div id="left">
    <label>1. 加载几何数据
      <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
    </label>
    <label>2. 目标图层
      <select id="target" disabled></select>
    </label>
    <label>3. 在下方粘贴 CSV
      <textarea id="csv" placeholder="fips,pop&#10;AL,4900000&#10;AK,730000"></textarea>
    </label>
    <label>4. 目标键(target_key)
      <input id="target-key" type="text" placeholder="例如 fips" />
    </label>
    <label>5. 源键(source_key,即 CSV 列名)
      <input id="source-key" type="text" placeholder="例如 fips" />
    </label>
    <label>保留字段 (可选,逗号分隔)
      <input id="fields" type="text" placeholder="例如 pop,gdp" />
    </label>
    <label>字段前缀 (可选)
      <input id="prefix" type="text" placeholder="例如 p_" />
    </label>
    <label><input id="unjoined" type="checkbox" /> unjoined (保留未匹配的目标记录)</label>
    <button id="btn" disabled>执行 Join</button>
    <div id="status" class="hint">先加载几何数据并选择目标图层</div>
    <div class="hint">Ctrl+Z 撤销。</div>
  </div>
  <div id="right">
    <div id="map" tabindex="0"></div>
    <div id="attrs">attrs preview</div>
  </div>

  <link rel="stylesheet" href="../../src/ui/controls.css" />
  <script src="../../dist/mapshaper-vendor.js"></script>
  <script src="../../dist/emap-dev.js"></script>
  <script>
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    const SOURCE_ID = 'join-source';
    const targetSel = document.getElementById('target');
    const csvInput = document.getElementById('csv');
    const targetKeyInput = document.getElementById('target-key');
    const sourceKeyInput = document.getElementById('source-key');
    const fieldsInput = document.getElementById('fields');
    const prefixInput = document.getElementById('prefix');
    const unjoinedInput = document.getElementById('unjoined');
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');
    const attrs = document.getElementById('attrs');

    function refreshAttrs() {
      const src = map.getSource(SOURCE_ID);
      const ds = src?.getDataset();
      if (!ds) { attrs.textContent = ''; return; }
      const layer = ds.layers.find((l) => l.name === targetSel.value) || ds.layers[0];
      const records = layer?.data?.getRecords?.() ?? [];
      const fields = layer?.data?.getFields?.() ?? Object.keys(records[0] ?? {});
      const head = records.slice(0, 6);
      attrs.textContent = head.length === 0
        ? '(no records)'
        : [fields.join('\t'), ...head.map((r) => fields.map((f) => r[f]).join('\t'))].join('\n');
    }

    function populate(source) {
      targetSel.innerHTML = '';
      source.getLayers().forEach((lyr, i) => {
        const name = lyr?.name || lyr?.id || `layer-${i}`;
        targetSel.appendChild(new Option(`${name} (${lyr?.geometry_type ?? '?'})`, name));
      });
      targetSel.disabled = source.getLayers().length === 0;
      btn.disabled = false;
      refreshAttrs();
    }

    targetSel.addEventListener('change', refreshAttrs);

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        source.on('data', ({ reason }) => {
          if (reason === 'load') map.setExtent(source.getExtent());
          populate(source);
          status.textContent = `已加载 ${file.name}。粘贴 CSV、配置键,然后 Join。`;
        });
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        source.setData({ filename: file.name, content });
        map.addSource(SOURCE_ID, source);
      };
      reader.readAsArrayBuffer(file);
    });

    btn.addEventListener('click', async () => {
      const target = targetSel.value;
      const csv = csvInput.value;
      const tk = targetKeyInput.value.trim();
      const sk = sourceKeyInput.value.trim();
      if (!target || !csv || !tk || !sk) {
        status.textContent = '请填写目标图层、CSV、两个键。';
        return;
      }
      const opts = {
        source: SOURCE_ID, target,
        data: { csv },
        keys: [tk, sk],
      };
      const fl = fieldsInput.value.trim();
      if (fl) opts.fields = fl.split(',').map((s) => s.trim()).filter(Boolean);
      const pf = prefixInput.value.trim();
      if (pf) opts.prefix = pf;
      if (unjoinedInput.checked) opts.unjoined = true;

      status.textContent = '正在 Join...';
      btn.disabled = true;
      try {
        const ok = await map.ops.joinTable(opts);
        status.textContent = ok ? `已 Join 到 "${target}"。Ctrl+Z 撤销。` : 'Join 失败。';
        const src = map.getSource(SOURCE_ID);
        if (src) populate(src);
      } catch (err) {
        status.textContent = `错误: ${err?.message ?? err}`;
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    });

    map.on('error', (e) => {
      status.textContent = `错误: ${e?.error?.message ?? e}`;
    });
  </script>
</body>

</html>
