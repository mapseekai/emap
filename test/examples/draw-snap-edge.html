<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 绘制时吸附顶点 + 边</title>
  <style>
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
    #header { padding: 10px; background: #2c3e50; color: white; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
    #header input[type="number"], #header input[type="text"] { padding: 4px 6px; font-size: 13px; border: 1px solid #4a5d70; border-radius: 3px; }
    #header input[type="number"] { width: 70px; }
    #header button { padding: 5px 12px; background: #16a085; color: white; border: 0; border-radius: 3px; cursor: pointer; font-size: 13px; }
    #header button:disabled { background: #7f8c8d; cursor: not-allowed; }
    #map { flex: 1; background: #ffffff; position: relative; outline: none; }
    .hint { opacity: 0.85; font-size: 12px; flex-basis: 100%; }
    .group { display: flex; gap: 6px; align-items: center; }
  </style>
</head>

<body>
  <div id="header">
    <span class="group">
      <label>文件: <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" /></label>
    </span>
    <span class="group">
      <label>吸附阈值 (px): <input id="snap-threshold" type="number" value="12" /></label>
      <label><input id="snap-vertex" type="checkbox" checked /> 吸附顶点</label>
      <label><input id="snap-edge" type="checkbox" checked /> 吸附边</label>
      <button id="apply-snap">应用吸附设置</button>
    </span>
    <span id="status">加载数据后,工具栏选择"绘制折线 / 多边形",拖动鼠标观察吸附</span>
    <span class="hint">
      <span style="color:#ff4444">红色圆环</span> = 顶点吸附 ·
      <span style="color:#ff4444">红色方框</span> = 边吸附(线段上的最近点)。
      关闭"吸附边"会回到只吸附顶点的旧行为。
    </span>
  </div>
  <div id="map" tabindex="0"></div>

  <link rel="stylesheet" href="../../src/ui/controls.css" />
  <script src="../../dist/emap-dev.js"></script>
  <script>
    const { Emap, TopologySource, NavigationControl, HistoryControl, EditToolbar, DrawFeatureControl } = emap;

    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    const SOURCE_ID = 'draw-snap-source';

    // Toolbar with both polyline and polygon draw — both consume the same
    // snap settings via re-creation when "应用吸附设置" is clicked.
    let drawPoly, drawLine;
    function buildDrawTools() {
      const threshold = Number(document.getElementById('snap-threshold').value) || 12;
      const snapToVertex = document.getElementById('snap-vertex').checked;
      const snapToEdge = document.getElementById('snap-edge').checked;

      // Tear down previous instances if any.
      if (drawPoly) drawPoly.onRemove?.();
      if (drawLine) drawLine.onRemove?.();

      drawPoly = new DrawFeatureControl({
        source: SOURCE_ID, type: 'polygon',
        snapThreshold: threshold, snapToVertex, snapToEdge,
      });
      drawLine = new DrawFeatureControl({
        source: SOURCE_ID, type: 'polyline',
        snapThreshold: threshold, snapToVertex, snapToEdge,
      });
      const toolbar = new EditToolbar({ controls: [drawPoly, drawLine] });
      // Re-add toolbar (a bit hacky but example-grade)
      try { map.removeControl?.(toolbar); } catch (_) {}
      map.addControl(toolbar, 'top-right');
    }
    buildDrawTools();

    document.getElementById('apply-snap').addEventListener('click', buildDrawTools);

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const status = document.getElementById('status');
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        source.on('data', () => {
          map.setExtent(source.getExtent());
          status.textContent = `已加载 ${file.name}。选工具开始绘制,光标靠近已有顶点 / 边时会吸附。`;
        });
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        source.setData({ filename: file.name, content });
        map.addSource(SOURCE_ID, source);

        const lyrs = source.getLayers?.() ?? [];
        lyrs.forEach((lyr, i) => {
          const id = `${lyr?.name || `layer-${i}`}-default`;
          if (map.getLayer(id)) return;
          if (lyr?.geometry_type === 'polygon' || lyr?.geometry_type === 'polyline') {
            map.addLayer({ id, type: 'line', source: SOURCE_ID, sourceLayer: lyr.name, paint: { 'line-color': '#888', 'line-width': 1 } });
          } else if (lyr?.geometry_type === 'point') {
            map.addLayer({ id, type: 'circle', source: SOURCE_ID, sourceLayer: lyr.name, paint: { 'circle-color': '#888', 'circle-radius': 3 } });
          }
        });
      };
      reader.readAsArrayBuffer(file);
    });
  </script>
</body>

</html>
