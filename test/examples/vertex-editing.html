<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 顶点编辑</title>
  <style>
    * {
      margin: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: -apple-system, sans-serif;
      background: #1a1a2e;
      color: #eee;
    }

    #header {
      padding: 10px 16px;
      background: #16213e;
      display: flex;
      gap: 15px;
      align-items: center;
      border-bottom: 1px solid #0f3460;
    }

    #header select {
      padding: 4px 8px;
      border: 1px solid #0f3460;
      border-radius: 3px;
      background: #fff;
      color: #16213e;
      font-size: 13px;
    }

    #header strong {
      color: #e94560;
    }

    #map {
      flex: 1;
      background: #ffffff;
      position: relative;
    }

    #event-log {
      position: absolute;
      bottom: 50px;
      right: 10px;
      width: 340px;
      max-height: 200px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      font-family: monospace;
      color: #7cfc00;
      /* 高于 emap 控件容器的 z-index (10) */
      z-index: 100;
      pointer-events: auto;
    }

    #event-log .log-entry {
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
    }

    .info {
      margin-left: auto;
      font-size: 0.85em;
      color: #aaa;
    }
  </style>
</head>

<body>
  <div id="header">
    <strong>Emap</strong> 顶点编辑演示
    <label>渲染器:
      <select id="renderer-select">
        <option value="webgl" selected>WebGL</option>
        <option value="canvas">Canvas 2D</option>
      </select>
    </label>
    <input type="file" id="file-input" accept=".json,.geojson,.zip" />
    <div class="info" id="status">上传 GeoJSON 文件开始</div>
  </div>
  <div id="map">
    <div id="event-log">
      <div style="color:#aaa; margin-bottom:6px;">vertex_moved 事件日志:</div>
    </div>
  </div>

  <link rel="stylesheet" href="../../src/ui/controls.css" />
  <script src="../../dist/mapshaper-vendor.js"></script>
  <script src="../../dist/emap-dev.js"></script>
  <script>
    const { Emap, TopologySource, EditToolbar } = emap;

    const SOURCE_ID = "test-source";
    const rendererSelect = document.getElementById("renderer-select");
    const fileInput = document.getElementById("file-input");
    const status = document.getElementById("status");
    const logEl = document.getElementById("event-log");

    let map = null;
    let currentFile = null;
    let renderLayerIds = [];

    function createMap(renderer) {
      if (map) map.remove();
      renderLayerIds = [];
      map = new Emap({
        container: "map",
        renderer,
        webglGeometryWorker: renderer === "webgl" ? "auto" : false,
        webglGeometryWorkerUrl: "../../dist/emap-geometry-worker.js",
      });
      map.addControl(new emap.NavigationControl(), "top-left");
      map.addControl(new EditToolbar(), "top-left");
      map.addControl(new emap.BasemapControl(), "top-right");
      map.addControl(
        new emap.StatusControl({ alignment: "right", showEPSG: true }),
        "bottom-right"
      );

      map.on("vertex_moved", (e) => {
        const entry = document.createElement("div");
        entry.className = "log-entry";
        const coords = e.coords
          ? `[${e.coords[0].toFixed(6)}, ${e.coords[1].toFixed(6)}]`
          : "?";
        const moved = Array.isArray(e.vertexIds) ? e.vertexIds.join(",") : "?";
        entry.textContent = `id=${e.id} vtx=[${moved}] → ${coords}`;
        logEl.appendChild(entry);
        logEl.scrollTop = logEl.scrollHeight;
      });
    }

    function addLayer(spec) {
      map.addLayer(spec);
      renderLayerIds.push(spec.id);
    }

    function clearRenderLayers() {
      while (renderLayerIds.length > 0) {
        const id = renderLayerIds.pop();
        if (map.getLayer(id)) map.removeLayer(id);
      }
    }

    function addStyledLayers(source) {
      clearRenderLayers();
      source.getLayers().forEach((lyr, i) => {
        const name = lyr?.name || lyr?.id || `layer-${i}`;
        const baseId = `${SOURCE_ID}-${name}`.replace(/[^a-zA-Z0-9_-]/g, "-");
        if (lyr?.geometry_type === "polygon") {
          addLayer({
            id: `${baseId}-fill`,
            type: "fill",
            source: SOURCE_ID,
            "source-layer": name,
            paint: {
              "fill-color": i % 2 ? "#ffb74d" : "#4db6ac",
              "fill-opacity": 0.42,
              "line-color": "#263238",
              "line-width": 1,
            },
          });
          addLayer({
            id: `${baseId}-line`,
            type: "line",
            source: SOURCE_ID,
            "source-layer": name,
            paint: { "line-color": "#263238", "line-width": 1.2 },
          });
        } else if (lyr?.geometry_type === "polyline") {
          addLayer({
            id: `${baseId}-line`,
            type: "line",
            source: SOURCE_ID,
            "source-layer": name,
            paint: { "line-color": "#5e35b1", "line-width": 2.4 },
          });
        } else if (lyr?.geometry_type === "point") {
          addLayer({
            id: `${baseId}-circle`,
            type: "circle",
            source: SOURCE_ID,
            "source-layer": name,
            paint: { "circle-color": "#d81b60", "circle-radius": 5 },
          });
        }
      });
    }

    async function loadCurrentFile() {
      if (!currentFile) return;
      status.textContent = `处理 ${currentFile.filename} 中...`;
      clearRenderLayers();
      if (map.getSource(SOURCE_ID)) {
        map.removeSource(SOURCE_ID);
      }

      const source = new TopologySource(SOURCE_ID);
      try {
        await source.setData(currentFile);
        map.addSource(SOURCE_ID, source);
        map.setExtent(source.getExtent());
        addStyledLayers(source);
        const painterName = map.getPainter?.().constructor?.name || rendererSelect.value;
        status.textContent = `当前: ${currentFile.filename} · ${painterName} —— 点击 ✏ 进入编辑模式`;
      } catch (e) {
        console.error(e);
        status.textContent = "处理文件出错";
      }
    }

    createMap(rendererSelect.value);

    rendererSelect.addEventListener("change", async () => {
      createMap(rendererSelect.value);
      await loadCurrentFile();
      if (!currentFile) {
        status.textContent = `已切换到 ${rendererSelect.value}`;
      }
    });

    fileInput.addEventListener("change", async (ev) => {
      const file = ev.target.files[0];
      if (!file) return;
      status.textContent = `处理 ${file.name} 中...`;
      try {
        const reader = new FileReader();
        reader.onload = async (event) => {
          const content = new Uint8Array(event.target.result);
          currentFile = { filename: file.name, content };
          await loadCurrentFile();
        };
        reader.readAsArrayBuffer(file);
      } catch (err) {
        console.error(err);
        status.textContent = "处理文件出错";
      }
    });

    window.addEventListener("resize", () => map.resize());
  </script>
</body>

</html>
