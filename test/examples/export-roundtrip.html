<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 导出往返</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: sans-serif;
    }

    #header {
      padding: 10px;
      background: #2c3e50;
      color: white;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    #header label {
      font-size: 13px;
    }

    #header button {
      padding: 4px 12px;
      background: #16a085;
      color: white;
      border: 0;
      border-radius: 3px;
      cursor: pointer;
      font-size: 13px;
    }

    #header button:disabled {
      background: #7f8c8d;
      cursor: not-allowed;
    }

    #map {
      flex: 1;
      background: #ffffff;
      position: relative;
    }

    #status {
      font-size: 12px;
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <div id="header">
    <label>
      文件:
      <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
    </label>
    <label>
      导出格式:
      <select id="format">
        <option value="geojson">GeoJSON</option>
        <option value="topojson">TopoJSON</option>
        <option value="shapefile">Shapefile (.zip)</option>
      </select>
    </label>
    <button id="export-btn" disabled>导出并下载</button>
    <span id="status">加载文件以开始</span>
  </div>
  <div id="map">
  </div>

  <link rel="stylesheet" href="../../src/ui/controls.css" />
  <script src="../../dist/mapshaper-vendor.js"></script>
  <script src="../../dist/emap-dev.js"></script>
  <script>
    const { Emap, TopologySource, NavigationControl, EditToolbar, DrawFeatureControl } = emap;

    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');

    const fileInput = document.getElementById('file-input');
    const formatSelect = document.getElementById('format');
    const exportBtn = document.getElementById('export-btn');
    const status = document.getElementById('status');

    const SOURCE_ID = 'export-source';
    let activeSource = null;
    let drawToolbar = null;

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      status.textContent = `处理 ${file.name} 中...`;
      exportBtn.disabled = true;

      const reader = new FileReader();
      reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);

        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        activeSource = source;
        // Canonical 0.2.0 recipe: await setData (resolves once the dataset
        // is ready), then addSource (order-independent) + setExtent.
        try {
          await source.setData({ filename: file.name, content });
          map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          status.textContent = `已加载 ${file.name}。可绘制要素后再导出。`;
          exportBtn.disabled = false;

          if (drawToolbar) map.removeControl(drawToolbar);
          // 提供绘制控件,演示 "编辑后导出" 的流程
          drawToolbar = new EditToolbar({
            controls: [
              new DrawFeatureControl({ source: SOURCE_ID, type: 'polyline' }),
              new DrawFeatureControl({ source: SOURCE_ID, type: 'polygon' }),
            ],
          });
          map.addControl(drawToolbar, 'top-left');
        } catch (err) {
          console.error(err);
          status.textContent = '处理文件出错';
        }
      };
      reader.readAsArrayBuffer(file);
    });

    exportBtn.addEventListener('click', async () => {
      if (!activeSource) return;
      const format = formatSelect.value;
      status.textContent = `正在导出为 ${format}...`;
      exportBtn.disabled = true;

      try {
        const blob = await activeSource.export({ format });

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download =
          format === 'shapefile' ? 'export.zip'
            : format === 'topojson' ? 'export.topojson'
              : 'export.geojson';
        document.body.appendChild(a);
        a.click();
        a.remove();
        // 下载触发后释放 blob URL
        setTimeout(() => URL.revokeObjectURL(url), 1000);

        status.textContent = `已导出 ${blob.size} 字节,文件名: ${a.download}`;
      } catch (err) {
        console.error(err);
        status.textContent = `导出失败: ${err.message || err}`;
      } finally {
        exportBtn.disabled = false;
      }
    });
  </script>
</body>

</html>
