<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap Example - Attribute Editing</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: sans-serif;
    }

    #header {
      padding: 10px;
      background: #2c3e50;
      color: white;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 13px;
    }

    #header button {
      padding: 4px 10px;
      background: #16a085;
      color: white;
      border: 0;
      border-radius: 3px;
      cursor: pointer;
      font-size: 13px;
    }

    #map {
      flex: 1;
      background: #ffffff;
      position: relative;
      outline: none;
    }

    #panel {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 320px;
      max-height: 75vh;
      overflow: auto;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    #panel h3 {
      margin: 0 0 8px 0;
      font-size: 13px;
    }

    #panel .row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }

    #panel input {
      flex: 1;
      padding: 3px 6px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }

    #panel .key {
      width: 110px;
      color: #555;
      font-family: monospace;
    }

    .schema {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }

    .schema .row { gap: 4px; }
    .schema button {
      padding: 3px 8px;
      font-size: 12px;
      background: #34495e;
      color: white;
      border: 0;
      border-radius: 3px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="header">
    <label>
      File:
      <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
    </label>
    <span id="status">Load a dataset, then click a feature to edit</span>
  </div>
  <div id="map" tabindex="0">
    <div id="panel">
      <h3>Attributes</h3>
      <div id="props">(click a feature)</div>
      <div class="schema" id="schema-panel" hidden>
        <h3>Schema</h3>
        <div class="row">
          <input id="add-field" placeholder="new field" />
          <button id="add-field-btn">Add</button>
        </div>
        <div class="row">
          <input id="rename-from" placeholder="from" />
          <input id="rename-to" placeholder="to" />
          <button id="rename-btn">Rename</button>
        </div>
        <div class="row">
          <input id="remove-field" placeholder="field" />
          <button id="remove-btn">Remove</button>
        </div>
      </div>
    </div>
  </div>

  <link rel="stylesheet" href="../../src/ui/controls.css" />
  <script src="../../dist/emap-dev.js"></script>
  <script>
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;

    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    const SOURCE_ID = 'attr-source';
    const fileInput = document.getElementById('file-input');
    const status = document.getElementById('status');
    const propsDiv = document.getElementById('props');
    const schemaPanel = document.getElementById('schema-panel');
    const mapContainer = map.getCanvasContainer();

    let activeRef = null;
    let activeTarget = null; // layer name of the most recent feature

    function renderProps(feature) {
      activeRef = { source: feature.source, layer: feature.layer, id: feature.id };
      activeTarget = feature.layer;
      const props = feature.properties || {};
      propsDiv.innerHTML = '';
      Object.entries(props).forEach(([key, value]) => {
        const row = document.createElement('div');
        row.className = 'row';
        const k = document.createElement('span');
        k.className = 'key';
        k.textContent = key;
        const v = document.createElement('input');
        v.value = value == null ? '' : String(value);
        v.addEventListener('change', () => {
          // Try to keep numeric values numeric
          let next = v.value;
          if (/^-?\d+(\.\d+)?$/.test(next)) next = Number(next);
          map.setFeatureProperty(activeRef, key, next === '' ? undefined : next);
          status.textContent = `${key} → ${v.value}`;
        });
        row.appendChild(k);
        row.appendChild(v);
        propsDiv.appendChild(row);
      });
      schemaPanel.hidden = false;
    }

    function refreshActiveDisplay() {
      if (!activeRef) return;
      const hits = map.queryRenderedFeatures([0, 0], { layers: [activeRef.layer] });
      const fresh = hits.find((h) => h.id === activeRef.id);
      if (fresh) renderProps(fresh);
    }

    map.on('historychange', () => {
      // Re-render the panel against current values when undo / redo happens
      refreshActiveDisplay();
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `Loading ${file.name}...`;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        source.on('data', () => {
          map.setExtent(source.getExtent());
          status.textContent = `Loaded: ${file.name}. Click a feature.`;
        });
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        source.setData({ filename: file.name, content });
        map.addSource(SOURCE_ID, source);
      };
      reader.readAsArrayBuffer(file);
    });

    mapContainer.addEventListener('click', (e) => {
      const rect = mapContainer.getBoundingClientRect();
      const point = [e.clientX - rect.left, e.clientY - rect.top];
      const features = map.queryRenderedFeatures(point);
      if (!features.length) {
        propsDiv.textContent = '(no feature hit)';
        return;
      }
      renderProps(features[0]);
    });

    document.getElementById('add-field-btn').addEventListener('click', () => {
      const field = document.getElementById('add-field').value.trim();
      if (!field || !activeTarget) return;
      const ok = map.addField({ source: SOURCE_ID, target: activeTarget, field });
      status.textContent = ok ? `Added field: ${field}. Ctrl+Z to undo.` : 'Add failed.';
      refreshActiveDisplay();
    });

    document.getElementById('remove-btn').addEventListener('click', () => {
      const field = document.getElementById('remove-field').value.trim();
      if (!field || !activeTarget) return;
      const ok = map.removeField({ source: SOURCE_ID, target: activeTarget, field });
      status.textContent = ok ? `Removed field: ${field}. Ctrl+Z to undo.` : 'Remove failed.';
      refreshActiveDisplay();
    });

    document.getElementById('rename-btn').addEventListener('click', () => {
      const from = document.getElementById('rename-from').value.trim();
      const to = document.getElementById('rename-to').value.trim();
      if (!from || !to || !activeTarget) return;
      const ok = map.renameField({ source: SOURCE_ID, target: activeTarget, from, to });
      status.textContent = ok ? `Renamed ${from} → ${to}. Ctrl+Z to undo.` : 'Rename refused (collision).';
      refreshActiveDisplay();
    });
  </script>
</body>

</html>
