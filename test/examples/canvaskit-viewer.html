<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emap 示例 - CanvasKit 查看器</title>
  <script src="https://unpkg.com/canvaskit-wasm@0.40.0/bin/full/canvaskit.js"></script>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: sans-serif;
    }

    #header {
      padding: 10px;
      background: #2c3e50;
      color: white;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    #map {
      flex: 1;
      background: #ffffff;
      position: relative;
    }

    .info {
      margin-left: auto;
      font-size: 0.85em;
    }

    .renderer-badge {
      background: #e67e22;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8em;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="header">
    <strong>Emap CanvasKit</strong>
    <span class="renderer-badge">SKIA WASM</span>
    <input type="file" id="file-input" accept=".json,.geojson" />
    <div class="info" id="status">CanvasKit 初始化中...</div>
  </div>
  <div id="map"></div>

  <script src="../../dist/mapshaper-vendor.js"></script>
  <script src="../../dist/emap-dev.js"></script>
  <script>
    const { Emap, TopologySource } = emap;
    const fileInput = document.getElementById('file-input');
    const status = document.getElementById('status');

    let map = null;

    // 初始化 CanvasKit (Skia WASM)
    CanvasKitInit({
      locateFile: (file) => `https://unpkg.com/canvaskit-wasm@0.40.0/bin/full/${file}`
    }).then((ck) => {
      status.textContent = "CanvasKit 已就绪,请上传 GeoJSON。";

      map = new Emap({
        container: 'map',
        renderer: 'canvaskit',
        canvasKit: ck
      });

      setupFileInput();
    }).catch(err => {
      console.error(err);
      status.textContent = "CanvasKit 加载失败。";
    });

    function setupFileInput() {
      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file || !map) return;

        status.textContent = `处理 ${file.name} 中...`;

        try {
          const reader = new FileReader();
          reader.onload = async (event) => {
            const content = new Uint8Array(event.target.result);
            const source = new TopologySource('test-source');

            source.on('data', () => {
              map.setExtent(source.getExtent());
              status.textContent = `当前 (CanvasKit): ${file.name}`;
            });

            source.on('error', (e) => {
              console.error(e);
              status.textContent = '处理文件出错';
            });

            if (map.getSource("test-source")) {
              map.removeSource("test-source");
            }

            source.setData({
              filename: file.name,
              content: content
            });

            map.addSource('test-source', source);
          };
          reader.readAsArrayBuffer(file);
        } catch (err) {
          console.error(err);
          status.textContent = '处理文件出错';
        }
      });
    }

    window.addEventListener('resize', () => {
      if (map) map.resize();
    });
  </script>
</body>

</html>
