<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap Example - Buffer</title>
  <style>
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
    #header {
      padding: 10px;
      background: #2c3e50;
      color: white;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 13px;
    }
    #header input[type="text"] {
      width: 130px;
      padding: 4px 6px;
      border: 1px solid #4a5d70;
      border-radius: 3px;
      font-size: 13px;
    }
    #header select {
      padding: 4px 6px;
      font-size: 13px;
    }
    #header button {
      padding: 5px 12px;
      background: #16a085;
      color: white;
      border: 0;
      border-radius: 3px;
      cursor: pointer;
      font-size: 13px;
    }
    #header button:disabled { background: #7f8c8d; cursor: not-allowed; }
    #map { flex: 1; background: #ffffff; position: relative; outline: none; }
  </style>
</head>

<body>
  <div id="header">
    <label>File: <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" /></label>
    <label>Target: <select id="target"></select></label>
    <label>Radius: <input id="radius" type="text" value="0.01" placeholder="number or expr"/></label>
    <label>Cap: <select id="cap">
      <option value="">round (default)</option>
      <option value="round">round</option>
      <option value="flat">flat</option>
    </select></label>
    <button id="buffer-btn" disabled>Buffer</button>
    <span id="status">Load a dataset</span>
  </div>
  <div id="map" tabindex="0"></div>

  <link rel="stylesheet" href="../../src/ui/controls.css" />
  <script src="../../dist/emap-dev.js"></script>
  <script>
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;

    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    const SOURCE_ID = 'buf-source';
    const fileInput = document.getElementById('file-input');
    const targetSel = document.getElementById('target');
    const radiusInput = document.getElementById('radius');
    const capSel = document.getElementById('cap');
    const bufBtn = document.getElementById('buffer-btn');
    const status = document.getElementById('status');

    function populate(source) {
      targetSel.innerHTML = '';
      source.getLayers().forEach((lyr, i) => {
        const name = lyr?.name || lyr?.id || `layer-${i}`;
        targetSel.appendChild(new Option(`${name} (${lyr?.geometry_type ?? '?'})`, name));
      });
      bufBtn.disabled = source.getLayers().length === 0;
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `Loading ${file.name}...`;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        source.on('data', () => {
          map.setExtent(source.getExtent());
          populate(source);
          status.textContent = `Loaded ${file.name}. Pick target + radius, then Buffer.`;
        });
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        source.setData({ filename: file.name, content });
        map.addSource(SOURCE_ID, source);
      };
      reader.readAsArrayBuffer(file);
    });

    bufBtn.addEventListener('click', async () => {
      const target = targetSel.value;
      if (!target) return;
      const raw = radiusInput.value.trim();
      if (!raw) return;
      // Pass numeric strings as numbers, anything else as an expression.
      const radius = /^-?\d+(\.\d+)?$/.test(raw) ? Number(raw) : raw;
      const opts = { source: SOURCE_ID, target, radius };
      if (capSel.value) opts.capStyle = capSel.value;
      status.textContent = `Buffering ${target} by ${raw}...`;
      bufBtn.disabled = true;
      try {
        const ok = await map.bufferLayer(opts);
        status.textContent = ok ? `Buffered ${target}. Ctrl+Z to undo.` : 'Buffer failed.';
        const src = map.getSource(SOURCE_ID);
        if (src) populate(src);
      } catch (err) {
        status.textContent = `Error: ${err?.message ?? err}`;
        console.error(err);
      } finally {
        bufBtn.disabled = false;
      }
    });
  </script>
</body>

</html>
