<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 平移选中要素</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: sans-serif;
    }

    #header {
      padding: 10px;
      background: #2c3e50;
      color: white;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 13px;
    }

    #map {
      flex: 1;
      background: #ffffff;
      position: relative;
      outline: none;
    }

    .hint {
      opacity: 0.85;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div id="header">
    <label>
      文件:
      <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
    </label>
    <span class="hint">在要素上按住鼠标左键拖动 → 松开落位。空白处按下走平移地图。共享边界自动复制,相邻未选要素保持原位。右键或 Esc 取消拖动。方向键步进(不复制共享边)。Ctrl+Z 撤销。</span>
    <span id="status">加载数据</span>
  </div>
  <div id="map" tabindex="0"></div>

  <link rel="stylesheet" href="../../src/ui/controls.css" />
  <script src="../../dist/mapshaper-vendor.js"></script>
  <script src="../../dist/emap-dev.js"></script>
  <script>
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;

    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    const SOURCE_ID = 'translate-source';
    const fileInput = document.getElementById('file-input');
    const status = document.getElementById('status');
    const mapContainer = map.getCanvasContainer();

    map.on('selectionchange', (e) => {
      if (e.selected.length === 0) {
        map.clearHighlightedFeatures();
      } else {
        map.setHighlightedFeatures(e.selected, { color: '#1e88e5', width: 3 });
      }
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        source.on('data', ({ reason }) => {
          if (reason === 'load') map.setExtent(source.getExtent());
          status.textContent = `已加载 ${file.name}。点击要素选中,方向键平移。`;
          // 聚焦 map 容器,让方向键事件被它接收
          document.getElementById('map').focus();
        });
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        source.setData({ filename: file.name, content });
        map.addSource(SOURCE_ID, source);
      };
      reader.readAsArrayBuffer(file);
    });

    // Press-and-hold drag: mousedown on a feature opens a translate
    // session AND disables the built-in drag-to-pan handler so the map
    // doesn't pan along with the feature. mousemove streams (dx, dy)
    // into the session in source-data coords. mouseup commits one
    // cumulative undo entry and re-enables pan. Esc / right-click cancels.
    let session = null;
    let lastMapCoord = null;
    let dragging = false;

    function pixelToMap(e) {
      const rect = mapContainer.getBoundingClientRect();
      return map.unproject(e.clientX - rect.left, e.clientY - rect.top);
    }

    function endSession(commit) {
      if (!session) return;
      if (commit) {
        const [adx, ady] = session.getAccumulated();
        const pushed = session.commit();
        status.textContent = pushed
          ? `已落位 (${adx.toFixed(2)}, ${ady.toFixed(2)})。Ctrl+Z 撤销。`
          : '未移动,选择保留。';
      } else {
        session.cancel();
        status.textContent = '已取消本次拖动。';
      }
      session = null;
      lastMapCoord = null;
      dragging = false;
      // Always re-enable pan when the gesture ends, regardless of how.
      map.setDragPanEnabled(true);
    }

    // mousedown on the canvas container: hit-test, and if we hit a
    // feature start a drag (and lock pan); otherwise let pan proceed.
    mapContainer.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      const rect = mapContainer.getBoundingClientRect();
      const point = [e.clientX - rect.left, e.clientY - rect.top];
      const features = map.queryFeatures(point);
      if (!features.length) {
        // Empty space → let pan handler proceed.
        return;
      }

      const mode = e.shiftKey ? 'add' : (e.ctrlKey || e.metaKey) ? 'toggle' : 'replace';
      map.select(features, { mode });
      document.getElementById('map').focus();

      // Modifier-clicks are selection-only — no drag.
      if (e.shiftKey || e.ctrlKey || e.metaKey) return;

      // Lock pan for the duration of this gesture. The pan handler's
      // mousedown listener checks `isEnabled()` first, so disabling
      // before the pan handler runs (or even AFTER, since this event
      // bubbles up to it) prevents a pan from starting on this click.
      map.setDragPanEnabled(false);

      session = map.editSession.beginTranslateSession();
      if (session) {
        lastMapCoord = pixelToMap(e);
        dragging = true;
        status.textContent = '拖动中… 松开鼠标落位,Esc / 右键取消。';
      } else {
        // Couldn't open session (e.g. selection empty for some reason);
        // unlock pan so the next click works normally.
        map.setDragPanEnabled(true);
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragging || !session) return;
      const cur = pixelToMap(e);
      if (lastMapCoord) {
        session.move(cur[0] - lastMapCoord[0], cur[1] - lastMapCoord[1]);
      }
      lastMapCoord = cur;
    });

    window.addEventListener('mouseup', (e) => {
      if (!dragging || !session) return;
      if (e.button !== 0) return;
      endSession(true);
    });

    // Empty-space click clears the selection (mousedown fell through to
    // pan, but the click that follows still fires here).
    mapContainer.addEventListener('click', (e) => {
      if (dragging || session) return;
      const rect = mapContainer.getBoundingClientRect();
      const point = [e.clientX - rect.left, e.clientY - rect.top];
      const features = map.queryFeatures(point);
      if (!features.length && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
        map.clearSelection();
      }
    });

    mapContainer.addEventListener('contextmenu', (e) => {
      if (!session) return;
      e.preventDefault();
      endSession(false);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && session) {
        e.preventDefault();
        endSession(false);
        return;
      }
    });

    // Arrow-key step nudge still works when no session is active.
    document.getElementById('map').addEventListener('keydown', (e) => {
      if (session) return; // drag in progress — let mouse own the movement
      const stride = e.shiftKey ? 10 : 1;
      let dx = 0, dy = 0;
      if (e.key === 'ArrowLeft') dx = -stride;
      else if (e.key === 'ArrowRight') dx = stride;
      else if (e.key === 'ArrowUp') dy = stride; // 源数据坐标系向上为 +y
      else if (e.key === 'ArrowDown') dy = -stride;
      else return;
      e.preventDefault();
      const ok = map.editSession.translateSelected(dx, dy);
      if (ok) {
        status.textContent = `已步进 (${dx}, ${dy}),Ctrl+Z 撤销。`;
      }
    });
  </script>
</body>

</html>
