<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 顶点编辑</title>
  <style>
    #event-log {
      position: absolute;
      bottom: 50px;
      right: 10px;
      width: 340px;
      max-height: 200px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.75);
      padding: 8px 10px;
      font-size: 12px;
      color: #7cfc00;
      /* 高于 emap 控件容器的 z-index (10) */
      z-index: 100;
      pointer-events: auto;
    }

    #event-log .log-entry {
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
    }

    #event-log .log-title {
      color: #aaa;
      margin-bottom: 6px;
    }
  </style>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>顶点编辑演示</strong>
  </div>
  <div id="map" tabindex="0">
    <div id="event-log">
      <div class="log-title">vertex_moved 事件日志:</div>
    </div>
  </div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>顶点编辑演示</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input type="file" id="file-input" accept=".json,.geojson,.zip" />
        </div>
        <p id="status" class="emap-example-status">上传 GeoJSON 文件开始</p>
      </section>
    </div>
  </details>

  <script type="module">

import { installExampleMapUi } from '/src/example-runtime.ts';
import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const { Emap, TopologySource, EditToolbar } = emap;
const map = await Emap.create({ container: "map" });
await map.addControl(new emap.NavigationControl(), "top-left");
await installExampleMapUi(map, emap);
await map.addControl(new EditToolbar(), "top-left");
map.bindHistoryShortcuts();
// 记录 vertex_moved 事件
const logEl = document.getElementById("event-log");
map.on("vertex_moved", (e) => {
    const entry = document.createElement("div");
    entry.className = "log-entry";
    const coords = e.coords
        ? `[${e.coords[0].toFixed(6)}, ${e.coords[1].toFixed(6)}]`
        : "?";
    const moved = Array.isArray(e.vertexIds) ? e.vertexIds.join(",") : "?";
    entry.textContent = `id=${e.id} vtx=[${moved}] → ${coords}`;
    logEl.appendChild(entry);
    logEl.scrollTop = logEl.scrollHeight;
});
const fileInput = document.getElementById("file-input");
const status = document.getElementById("status");
fileInput.addEventListener("change", async (ev) => {
    const file = ev.target.files[0];
    if (!file)
        return;
    status.textContent = `处理 ${file.name} 中...`;
    try {
        const reader = new FileReader();
        reader.onload = async (event) => {
            const content = new Uint8Array(event.target.result);
            const source = new TopologySource("test-source");
            if (map.getSource("test-source")) {
                map.removeSource("test-source");
            }
            // Load initial data before registration: await setData, then addSource and setExtent.
            try {
                await source.setData({ filename: file.name, content });
                await map.addSource("test-source", source);
                map.setExtent(source.getExtent());
                status.textContent = `当前: ${file.name} —— 点击 ✏ 进入编辑模式；右击共享节点可分离；Ctrl/Cmd+Z 撤销`;
            }
            catch (e) {
                console.error(e);
                status.textContent = "处理文件出错";
            }
        };
        reader.readAsArrayBuffer(file);
    }
    catch (err) {
        console.error(err);
        status.textContent = "处理文件出错";
    }
});
window.addEventListener("resize", () => map.resize());
await autoLoadExampleFixtures('vertex-editing');
</script>
</body>

</html>
