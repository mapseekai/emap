<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 顶点编辑</title>
  <style>
    * {
      margin: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: -apple-system, sans-serif;
      background: #1a1a2e;
      color: #eee;
    }

    #header {
      padding: 10px 16px;
      background: #16213e;
      display: flex;
      gap: 15px;
      align-items: center;
      border-bottom: 1px solid #0f3460;
    }

    #header strong {
      color: #e94560;
    }

    #map {
      flex: 1;
      background: #ffffff;
      position: relative;
    }

    #event-log {
      position: absolute;
      bottom: 50px;
      right: 10px;
      width: 340px;
      max-height: 200px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      font-family: monospace;
      color: #7cfc00;
      /* 高于 emap 控件容器的 z-index (10) */
      z-index: 100;
      pointer-events: auto;
    }

    #event-log .log-entry {
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
    }

    .info {
      margin-left: auto;
      font-size: 0.85em;
      color: #aaa;
    }
  </style>
</head>

<body>
  <div id="header">
    <a class="emap-example-banner-brand" href="/emap/examples/" aria-label="Open the emap examples catalog"><img src="/emap/examples/emap.svg" alt="" /><span>emap</span></a>
    <strong>顶点编辑演示</strong>
    <input type="file" id="file-input" accept=".json,.geojson,.zip" />
    <div class="info" id="status">上传 GeoJSON 文件开始</div>
  </div>
  <div id="map">
    <div id="event-log">
      <div style="color:#aaa; margin-bottom:6px;">vertex_moved 事件日志:</div>
    </div>
  </div>

  <script type="module">
    import { installExampleMapUi } from '/src/example-runtime.ts';
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, EditToolbar } = emap;

    const map = new Emap({ container: "map" });

    map.addControl(new emap.NavigationControl(), "top-left");
    installExampleMapUi(map, emap);
    map.addControl(new EditToolbar(), "top-left");
    map.bindHistoryShortcuts();

    // 记录 vertex_moved 事件
    const logEl = document.getElementById("event-log");
    map.on("vertex_moved", (e) => {
      const entry = document.createElement("div");
      entry.className = "log-entry";
      const coords = e.coords
        ? `[${e.coords[0].toFixed(6)}, ${e.coords[1].toFixed(6)}]`
        : "?";
      const moved = Array.isArray(e.vertexIds) ? e.vertexIds.join(",") : "?";
      entry.textContent = `id=${e.id} vtx=[${moved}] → ${coords}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    });

    const fileInput = document.getElementById("file-input");
    const status = document.getElementById("status");

    fileInput.addEventListener("change", async (ev) => {
      const file = ev.target.files[0];
      if (!file) return;
      status.textContent = `处理 ${file.name} 中...`;
      try {
        const reader = new FileReader();
        reader.onload = async (event) => {
          const content = new Uint8Array(event.target.result);
          const source = new TopologySource("test-source");

          if (map.getSource("test-source")) {
            map.removeSource("test-source");
          }

          // Canonical 0.2.0 recipe: await setData (resolves once the dataset
          // is ready), then addSource (order-independent) + setExtent.
          try {
            await source.setData({ filename: file.name, content });
            map.addSource("test-source", source);
            map.setExtent(source.getExtent());
            status.textContent = `当前: ${file.name} —— 点击 ✏ 进入编辑模式；右击共享节点可分离；Ctrl/Cmd+Z 撤销`;
          } catch (e) {
            console.error(e);
            status.textContent = "处理文件出错";
          }
        };
        reader.readAsArrayBuffer(file);
      } catch (err) {
        console.error(err);
        status.textContent = "处理文件出错";
      }
    });

    window.addEventListener("resize", () => map.resize());
    await autoLoadExampleFixtures('vertex-editing');
  </script>
</body>

</html>
