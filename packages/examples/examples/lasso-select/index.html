<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 区域选择</title>
  <style>
    .emap-example-row button.active { border-color: var(--emap-example-primary); background: var(--emap-example-selection); }
    #selected-list {
      margin: 0;
      padding: 4px 8px;
      border: 1px solid var(--emap-example-border);
      background: var(--emap-example-muted);
      font-size: 11px;
      max-height: 60px;
      overflow-y: auto;
    }
  </style>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>区域选择</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>区域选择</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <div class="emap-example-field">
          <span class="emap-example-label">选择工具:</span>
          <div class="emap-example-row">
            <button id="tool-box" class="active">矩形</button>
            <button id="tool-lasso">套索</button>
          </div>
        </div>
        <div class="emap-example-row">
          <button id="clear-btn" disabled>清空选择</button>
          <button id="delete-btn" disabled>删除选中</button>
        </div>
        <p id="status" class="emap-example-status">加载数据后,按住 Shift 拖拽空白处框选</p>
        <p id="selected-list">已选: 0</p>
        <p class="emap-example-hint">
          Shift+拖拽 → replace; Shift+Ctrl(Cmd)+拖拽 → add; Shift+Alt+拖拽 → toggle。
          <br />
          切换工具按钮控制本次拖拽走 BoxSelect 还是 LassoSelect — 实现上是 enable() / disable() 配对调用,
          DragPanHandler 已内置 shift-skip,与平移不冲突。
        </p>
      </section>
    </div>
  </details>

  <script type="module">
import { getExampleRenderer } from '/src/renderer-choice.ts';


import { installExampleMapUi } from '/src/example-runtime.ts';
import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
const map = await Emap.create({ renderer: getExampleRenderer(), container: 'map' });
await map.addControl(new NavigationControl(), 'top-left');
await installExampleMapUi(map, emap);
await map.addControl(new HistoryControl(), 'top-left');
map.bindHistoryShortcuts();
// Box + lasso are named handlers on the map (P2c). Switching is one
// disable-then-enable pair; the handlers are mutually exclusive
// (boxSelect.enable() throws if lassoSelect is enabled, and vice
// versa) — we always disable the other first.
// Alternative for toolbar-button surfaces:
//   map.addControl(new BoxSelectControl()) / new LassoSelectControl()
map.boxSelect.enable(); // Start with rect active.
const SOURCE_ID = 'lasso-demo-source';
const status = document.getElementById('status');
const selectedList = document.getElementById('selected-list');
const clearBtn = document.getElementById('clear-btn');
const deleteBtn = document.getElementById('delete-btn');
const toolBoxBtn = document.getElementById('tool-box');
const toolLassoBtn = document.getElementById('tool-lasso');
function refreshSelected() {
    const sel = map.getSelection();
    selectedList.textContent = `已选: ${sel.length}` + (sel.length > 0
        ? ' — ' + sel.slice(0, 8).map((r) => `${r.layer}#${r.id}`).join(', ') + (sel.length > 8 ? ' …' : '')
        : '');
    clearBtn.disabled = sel.length === 0;
    deleteBtn.disabled = sel.length === 0;
    if (sel.length === 0) {
        map.clearHighlightedFeatures();
    }
    else {
        map.setHighlightedFeatures(sel, { color: '#1e88e5', width: 3 });
    }
}
map.on('selectionchange', refreshSelected);
function pickTool(name) {
    try {
        if (name === 'box') {
            // Disable the OTHER first so boxSelect.enable() doesn't trip
            // the mutual-exclusivity throw.
            map.lassoSelect.disable();
            map.boxSelect.enable();
            toolBoxBtn.classList.add('active');
            toolLassoBtn.classList.remove('active');
            status.textContent = '矩形选择 — Shift+拖拽画矩形';
        }
        else {
            map.boxSelect.disable();
            map.lassoSelect.enable();
            toolBoxBtn.classList.remove('active');
            toolLassoBtn.classList.add('active');
            status.textContent = '套索选择 — Shift+拖拽画自由曲线';
        }
    }
    catch (err) {
        status.textContent = '切换失败: ' + (err && err.message ? err.message : String(err));
    }
}
toolBoxBtn.addEventListener('click', () => pickTool('box'));
toolLassoBtn.addEventListener('click', () => pickTool('lasso'));
document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file)
        return;
    status.textContent = `正在加载 ${file.name}...`;
    const reader = new FileReader();
    reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID))
            map.removeSource(SOURCE_ID);
        // Load initial data before registration: await setData, then addSource and setExtent.
        try {
            await source.setData({ filename: file.name, content });
            await map.addSource(SOURCE_ID, source);
            map.setExtent(source.getExtent());
            status.textContent = `已加载 ${file.name}。Shift+拖拽框选/套索。`;
        }
        catch (err) {
            console.error(err);
            status.textContent = "处理文件出错";
        }
    };
    reader.readAsArrayBuffer(file);
});
clearBtn.addEventListener('click', () => map.clearSelection());
deleteBtn.addEventListener('click', () => {
    const ok = map.deleteSelected();
    status.textContent = ok ? '已删除选中要素 (Ctrl+Z 撤销)。' : '删除失败。';
});
refreshSelected();
await autoLoadExampleFixtures('lasso-select');
</script>
</body>

</html>
