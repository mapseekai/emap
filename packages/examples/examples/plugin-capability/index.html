<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 调用 Capability</title>
  <link rel="stylesheet" href="/src/cordis-runtime-demo.css" />
</head>
<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>调用 Capability</strong>
  </div>
  <div id="map" tabindex="0"></div>
  <details class="emap-example-workbench runtime-panel panel" open>
    <summary><h1>调用 Capability</h1></summary>
    <div class="emap-example-workbench-body">
      <p class="emap-example-lede">搜索已注册的 Capability，并让 Agent 读取当前坐标系。</p>
      <p id="runtime-proof" class="emap-example-status" aria-live="polite">正在启动 Cordis Context…</p>
      <section class="emap-example-section runtime-grid">
        <div class="runtime-card">
          <h2>Capability 查询</h2>
          <label for="capability-search">按能力搜索</label>
          <input id="capability-search" type="search" value="buffer" />
          <div id="capability-list" class="runtime-list"></div>
        </div>
        <div class="runtime-card">
          <h2>真实调用</h2>
          <button id="invoke-read" type="button">Agent 读取当前 CRS</button>
          <button id="refresh" type="button">刷新</button>
          <pre id="capability-result">view.getCRS → ViewService</pre>
          <label for="file-input">替换地图示例数据</label>
          <input id="file-input" type="file" accept=".geojson,.json" />
          <p id="fixture-state" class="emap-example-hint"></p>
        </div>
      </section>
      <p id="action-state" class="emap-example-status" aria-live="polite">等待地图就绪</p>
    </div>
  </details>
  <script type="module">
    import { mountCordisRuntimeDemo } from '/src/cordis-runtime-demo.ts';
    await mountCordisRuntimeDemo('capability');
  </script>
</body>
</html>
