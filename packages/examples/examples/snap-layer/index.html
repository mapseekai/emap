<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 图层顶点批量吸附 (snapLayer)</title>
  <style>
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
    #header { padding: 10px; background: #2c3e50; color: white; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
    #header select, #header input[type="text"] {
      padding: 4px 6px; font-size: 13px; border: 1px solid #4a5d70; border-radius: 3px;
    }
    #header input[type="text"] { width: 110px; }
    #header button {
      padding: 5px 12px; background: #16a085; color: white; border: 0;
      border-radius: 3px; cursor: pointer; font-size: 13px;
    }
    #header button:disabled { background: #7f8c8d; cursor: not-allowed; }
    #map { flex: 1; background: #ffffff; position: relative; outline: none; }
  </style>
</head>

<body>
  <div id="header">
    <label>文件: <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" /></label>
    <label>目标图层: <select id="target"></select></label>
    <label>容差距离: <input id="interval" type="text" placeholder="默认" /></label>
    <label>坐标精度: <input id="precision" type="text" placeholder="可选" /></label>
    <label><input id="endpoints" type="checkbox" /> 仅吸附端点</label>
    <button id="btn" disabled>吸附</button>
    <label>导出格式:
      <select id="format">
        <option value="geojson">GeoJSON</option>
        <option value="topojson">TopoJSON</option>
        <option value="shapefile">Shapefile (zip)</option>
      </select>
    </label>
    <button id="export-btn" disabled>导出并下载</button>
    <span id="status">加载数据</span>
  </div>
  <div id="map" tabindex="0"></div>

  <script type="module">
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    const SOURCE_ID = 'snap-source';
    const targetSel = document.getElementById('target');
    const intervalInput = document.getElementById('interval');
    const precisionInput = document.getElementById('precision');
    const endpointsChk = document.getElementById('endpoints');
    const btn = document.getElementById('btn');
    const formatSel = document.getElementById('format');
    const exportBtn = document.getElementById('export-btn');
    const status = document.getElementById('status');
    let activeSource = null;

    function populate(source) {
      targetSel.innerHTML = '';
      source.getLayers().forEach((lyr, i) => {
        const name = lyr?.name || lyr?.id || `layer-${i}`;
        targetSel.appendChild(new Option(`${name} (${lyr?.geometry_type ?? '?'})`, name));
      });
      const empty = source.getLayers().length === 0;
      btn.disabled = empty;
      exportBtn.disabled = empty;
    }

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        activeSource = source;
        // Canonical 0.2.0 recipe: await setData (resolves once the dataset
        // is ready), then addSource (order-independent) + setExtent.
        try {
          await source.setData({ filename: file.name, content });
          map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          populate(source);
          status.textContent = `已加载 ${file.name}。`;
        } catch (err) {
          console.error(err);
          status.textContent = "处理文件出错";
        }
      };
      reader.readAsArrayBuffer(file);
    });

    btn.addEventListener('click', async () => {
      const target = targetSel.value;
      if (!target) return;
      const opts = { source: SOURCE_ID, target };
      const intervalVal = intervalInput.value.trim();
      if (intervalVal && !isNaN(Number(intervalVal))) opts.interval = Number(intervalVal);
      const precisionVal = precisionInput.value.trim();
      if (precisionVal && !isNaN(Number(precisionVal))) opts.precision = Number(precisionVal);
      if (endpointsChk.checked) opts.endpoints = true;
      // Snap 通常视觉上几乎无感(顶点合并是亚像素级),所以打印
      // 顶点数差作为"是否真的发生了变化"的信号。
      const before = map.getSource(SOURCE_ID)?.getArcs?.()?.getPointCount?.() ?? 0;
      status.textContent = `正在吸附 ${target}...(顶点 ${before})`;
      btn.disabled = true;
      try {
        const ok = await map.ops.snapLayer(opts);
        const after = map.getSource(SOURCE_ID)?.getArcs?.()?.getPointCount?.() ?? 0;
        const delta = before - after;
        status.textContent = ok
          ? `已吸附 ${target}: 顶点 ${before} → ${after}` +
            (delta === 0 ? ' (未变化,试更大的容差)' : ` 合并 ${delta} 个,Ctrl+Z 撤销。`)
          : '吸附失败。';
      } finally {
        btn.disabled = false;
      }
    });

    // 导出当前 source 的快照(包含 snap 后的几何),Ctrl+Z 撤销不影响已下载的文件。
    exportBtn.addEventListener('click', async () => {
      if (!activeSource) return;
      const format = formatSel.value;
      status.textContent = `正在导出为 ${format}...`;
      exportBtn.disabled = true;
      try {
        const blob = await activeSource.export({ format });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download =
          format === 'shapefile' ? 'snap-result.zip'
            : format === 'topojson' ? 'snap-result.topojson'
              : 'snap-result.geojson';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        status.textContent = `已导出 ${blob.size} 字节: ${a.download}`;
      } catch (err) {
        console.error(err);
        status.textContent = `导出失败: ${err.message || err}`;
      } finally {
        exportBtn.disabled = false;
      }
    });
    await autoLoadExampleFixtures('snap-layer');
  </script>
</body>

</html>
