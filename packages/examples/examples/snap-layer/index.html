<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 图层顶点批量吸附 (snapLayer)</title>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>图层顶点批量吸附 (snapLayer)</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>图层顶点批量吸附 (snapLayer)</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <div class="emap-example-field">
          <label for="target">目标图层</label>
          <select id="target"></select>
        </div>
        <div class="emap-example-field">
          <label for="interval">容差距离</label>
          <input id="interval" type="text" placeholder="默认" />
        </div>
        <div class="emap-example-field">
          <label for="precision">坐标精度</label>
          <input id="precision" type="text" placeholder="可选" />
        </div>
        <div class="emap-example-field">
          <label class="emap-example-check"><input id="endpoints" type="checkbox" /> 仅吸附端点</label>
        </div>
        <button id="btn" class="emap-example-primary-button" disabled>吸附</button>
      </section>
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="format">导出格式</label>
          <select id="format">
            <option value="geojson">GeoJSON</option>
            <option value="topojson">TopoJSON</option>
            <option value="shapefile">Shapefile (zip)</option>
          </select>
        </div>
        <button id="export-btn" class="emap-example-primary-button" disabled>导出并下载</button>
        <p id="status" class="emap-example-status">加载数据</p>
      </section>
    </div>
  </details>

  <script type="module">
import { getExampleRenderer } from '/src/renderer-choice.ts';


import { installExampleMapUi } from '/src/example-runtime.ts';
import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
const map = await Emap.create({ renderer: getExampleRenderer(), container: 'map' });
await map.addControl(new NavigationControl(), 'top-left');
await installExampleMapUi(map, emap);
await map.addControl(new HistoryControl(), 'top-left');
map.bindHistoryShortcuts();
const SOURCE_ID = 'snap-source';
const targetSel = document.getElementById('target');
const intervalInput = document.getElementById('interval');
const precisionInput = document.getElementById('precision');
const endpointsChk = document.getElementById('endpoints');
const btn = document.getElementById('btn');
const formatSel = document.getElementById('format');
const exportBtn = document.getElementById('export-btn');
const status = document.getElementById('status');
let activeSource = null;
function populate(source) {
    targetSel.innerHTML = '';
    source.getLayers().forEach((lyr, i) => {
        const name = lyr?.name || lyr?.id || `layer-${i}`;
        targetSel.appendChild(new Option(`${name} (${lyr?.geometry_type ?? '?'})`, name));
    });
    const empty = source.getLayers().length === 0;
    btn.disabled = empty;
    exportBtn.disabled = empty;
}
document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file)
        return;
    status.textContent = `正在加载 ${file.name}...`;
    const reader = new FileReader();
    reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID))
            map.removeSource(SOURCE_ID);
        activeSource = source;
        // Load initial data before registration: await setData, then addSource and setExtent.
        try {
            await source.setData({ filename: file.name, content });
            await map.addSource(SOURCE_ID, source);
            map.setExtent(source.getExtent());
            populate(source);
            status.textContent = `已加载 ${file.name}。`;
        }
        catch (err) {
            console.error(err);
            status.textContent = "处理文件出错";
        }
    };
    reader.readAsArrayBuffer(file);
});
btn.addEventListener('click', async () => {
    const target = targetSel.value;
    if (!target)
        return;
    const opts = { source: SOURCE_ID, target };
    const intervalVal = intervalInput.value.trim();
    if (intervalVal && !isNaN(Number(intervalVal)))
        opts.interval = Number(intervalVal);
    const precisionVal = precisionInput.value.trim();
    if (precisionVal && !isNaN(Number(precisionVal)))
        opts.precision = Number(precisionVal);
    if (endpointsChk.checked)
        opts.endpoints = true;
    // Snap 通常视觉上几乎无感(顶点合并是亚像素级),所以打印
    // 顶点数差作为"是否真的发生了变化"的信号。
    const before = map.getSource(SOURCE_ID)?.getArcs?.()?.getPointCount?.() ?? 0;
    status.textContent = `正在吸附 ${target}...(顶点 ${before})`;
    btn.disabled = true;
    try {
        const result = await map.ops.snapLayer(opts);
        if (result.ok) {
            const after = map.getSource(SOURCE_ID)?.getArcs?.()?.getPointCount?.() ?? 0;
            const delta = before - after;
            status.textContent =
                `已吸附 ${target}: 顶点 ${before} → ${after}` +
                    (delta === 0 ? ' (未变化,试更大的容差)' : ` 合并 ${delta} 个,Ctrl+Z 撤销。`);
        }
        else {
            status.textContent = '吸附失败。';
        }
    }
    finally {
        btn.disabled = false;
    }
});
// 导出当前 source 的快照(包含 snap 后的几何),Ctrl+Z 撤销不影响已下载的文件。
exportBtn.addEventListener('click', async () => {
    if (!activeSource)
        return;
    const format = formatSel.value;
    status.textContent = `正在导出为 ${format}...`;
    exportBtn.disabled = true;
    try {
        const blob = await activeSource.export({ format });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download =
            format === 'shapefile' ? 'snap-result.zip'
                : format === 'topojson' ? 'snap-result.topojson'
                    : 'snap-result.geojson';
        document.body.appendChild(a);
        a.click();
        await a.dispose();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        status.textContent = `已导出 ${blob.size} 字节: ${a.download}`;
    }
    catch (err) {
        console.error(err);
        status.textContent = `导出失败: ${err.message || err}`;
    }
    finally {
        exportBtn.disabled = false;
    }
});
await autoLoadExampleFixtures('snap-layer');
</script>
</body>

</html>
