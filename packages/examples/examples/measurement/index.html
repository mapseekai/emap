<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emap 示例 - 球面测量</title>
  </head>

  <body class="emap-example-with-floating-header">
    <div id="header">
      <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
      <strong>球面测量</strong>
    </div>
    <div id="map" tabindex="0"></div>

    <details class="emap-example-workbench panel" open>
      <summary><h1>球面测量</h1></summary>
      <div class="emap-example-workbench-body">
        <section class="emap-example-section">
          <div class="emap-example-field">
            <label for="file-input">文件</label>
            <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
          </div>
          <p id="status" class="emap-example-status">载入示例数据后，使用地图左上角的长度或面积测量控件。</p>
          <p class="emap-example-hint">
            单击长度尺或面积图标启用量测。左键添加顶点；双击完成；面积也可单击首点闭合；<kbd>Esc</kbd> 清除当前测量。
            测量结果按数据 CRS 转换到 WGS84 后计算球面长度和面积，结果直接标在画布上。
          </p>
        </section>
      </div>
    </details>

    <script type="module">

import { autoLoadExampleFixtures, installExampleMapUi, loadExampleRuntime } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const { Emap, MeasureControl, NavigationControl, TopologySource } = emap;
const map = await Emap.create({ container: 'map' });
await map.addControl(new NavigationControl(), 'top-left');
await map.addControl(new MeasureControl({ mode: 'length' }), 'top-left');
await map.addControl(new MeasureControl({ mode: 'area' }), 'top-left');
await installExampleMapUi(map, emap);
const SOURCE_ID = 'measurement-source';
const status = document.getElementById('status');
document.getElementById('file-input').addEventListener('change', (event) => {
    const file = event.target.files[0];
    if (!file)
        return;
    status.textContent = `正在加载 ${file.name}...`;
    const reader = new FileReader();
    reader.onload = async (loadEvent) => {
        const content = new Uint8Array(loadEvent.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID))
            map.removeSource(SOURCE_ID);
        try {
            await source.setData({ filename: file.name, content });
            await map.addSource(SOURCE_ID, source);
            map.setExtent(source.getExtent());
            status.textContent = '数据已加载。选择长度或面积控件后，在地图上单击开始量测。';
        }
        catch (error) {
            console.error(error);
            status.textContent = '处理文件出错';
        }
    };
    reader.readAsArrayBuffer(file);
});
window.addEventListener('resize', () => map.resize());
await autoLoadExampleFixtures('measurement');
</script>
  </body>
</html>
