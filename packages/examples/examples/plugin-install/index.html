<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 安装插件</title>
  <link rel="stylesheet" href="/src/cordis-runtime-demo.css" />
</head>
<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>安装插件</strong>
  </div>
  <div id="map" tabindex="0"></div>
  <details class="emap-example-workbench runtime-panel panel" open>
    <summary><h1>安装插件</h1></summary>
    <div class="emap-example-workbench-body">
      <p class="emap-example-lede">安装 MapLibre、Arrow 或 DuckDB，并卸载、重装地图交互插件。</p>
      <p id="runtime-proof" class="emap-example-status" aria-live="polite">正在启动 Cordis Context…</p>
      <div class="runtime-metrics">
        <div><strong id="metric-plugins">0</strong><span>Native Fibers</span></div>
        <div><strong id="metric-active">0</strong><span>ACTIVE</span></div>
        <div><strong id="metric-capabilities">0</strong><span>Capabilities</span></div>
        <div><strong id="metric-formats">0</strong><span>扩展格式组</span></div>
      </div>
      <section class="emap-example-section">
        <h2>安装 Provider</h2>
        <div class="emap-example-row">
          <button id="install-maplibre" type="button">安装 MapLibre</button>
          <button id="install-arrow" type="button">安装 Arrow</button>
          <button id="install-duckdb" type="button">安装 DuckDB 与工具</button>
          <button id="refresh" type="button">刷新</button>
        </div>
        <p id="service-state" class="emap-example-hint"></p>
      </section>
      <section class="emap-example-section runtime-grid">
        <div class="runtime-card">
          <h2>插件</h2>
          <label for="plugin-search">按名称搜索</label>
          <input id="plugin-search" type="search" placeholder="drag-pan / provider" />
          <div id="plugin-list" class="runtime-list"></div>
        </div>
        <div class="runtime-card">
          <h2>选中插件</h2>
          <code id="selected-id">—</code>
          <p id="selected-status">—</p>
          <label>inject → Provider</label><pre id="selected-requires"></pre>
          <label>已提供服务</label><pre id="selected-provides"></pre>
          <label>原生 effects</label><pre id="selected-effects"></pre>
          <div class="emap-example-row">
            <button id="dispose-plugin" type="button" disabled>Dispose</button>
            <button id="reinstall-plugin" type="button" disabled>重新安装</button>
            <button id="restart-plugin" type="button" disabled>Restart</button>
          </div>
        </div>
      </section>
      <p id="action-state" class="emap-example-status" aria-live="polite">等待地图就绪</p>
    </div>
  </details>
  <script type="module">
    import { mountCordisRuntimeDemo } from '/src/cordis-runtime-demo.ts';
    await mountCordisRuntimeDemo('install');
  </script>
</body>
</html>
