<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 属性表连接 (Join)</title>
  <style>
    #attrs {
      max-height: 160px;
      overflow: auto;
      margin: 16px 0 0;
      padding: 8px 10px;
      border: 1px solid var(--emap-example-border);
      background: var(--emap-example-muted);
      font-size: 11px;
      line-height: 1.5;
    }
  </style>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>属性表连接 (Join)</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>属性表连接 (Join)</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">1. 加载几何数据</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <div class="emap-example-field">
          <label for="target">2. 目标图层</label>
          <select id="target" disabled></select>
        </div>
        <div class="emap-example-field">
          <label for="csv">3. 在下方粘贴 CSV</label>
          <textarea id="csv" placeholder="fips,pop&#10;AL,4900000&#10;AK,730000"></textarea>
        </div>
        <div class="emap-example-field">
          <label for="target-key">4. 目标键(target_key)</label>
          <input id="target-key" type="text" placeholder="例如 fips" />
        </div>
        <div class="emap-example-field">
          <label for="source-key">5. 源键(source_key,即 CSV 列名)</label>
          <input id="source-key" type="text" placeholder="例如 fips" />
        </div>
        <div class="emap-example-field">
          <label for="fields">保留字段 (可选,逗号分隔)</label>
          <input id="fields" type="text" placeholder="例如 pop,gdp" />
        </div>
        <div class="emap-example-field">
          <label for="prefix">字段前缀 (可选)</label>
          <input id="prefix" type="text" placeholder="例如 p_" />
        </div>
        <div class="emap-example-field">
          <label class="emap-example-check"><input id="unjoined" type="checkbox" /> unjoined (保留未匹配的目标记录)</label>
        </div>
        <button id="btn" class="emap-example-primary-button" disabled>执行 Join</button>
        <p id="status" class="emap-example-status">先加载几何数据并选择目标图层</p>
        <p class="emap-example-hint">Ctrl+Z 撤销。</p>
        <div id="attrs">attrs preview</div>
      </section>
    </div>
  </details>

  <script type="module">
import { getExampleRenderer } from '/src/renderer-choice.ts';


import { installExampleMapUi } from '/src/example-runtime.ts';
import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
// Join supports `where=` / `calc=` expressions; opt in to evaluation.
// The library default is `'disabled'` for safety.
const map = await Emap.create({ renderer: getExampleRenderer(), container: 'map', expressionPolicy: 'trusted' });
await map.addControl(new NavigationControl(), 'top-left');
await installExampleMapUi(map, emap);
await map.addControl(new HistoryControl(), 'top-left');
map.bindHistoryShortcuts();
const SOURCE_ID = 'join-source';
const targetSel = document.getElementById('target');
const csvInput = document.getElementById('csv');
const targetKeyInput = document.getElementById('target-key');
const sourceKeyInput = document.getElementById('source-key');
const fieldsInput = document.getElementById('fields');
const prefixInput = document.getElementById('prefix');
const unjoinedInput = document.getElementById('unjoined');
const btn = document.getElementById('btn');
const status = document.getElementById('status');
const attrs = document.getElementById('attrs');
function refreshAttrs() {
    const src = map.getSource(SOURCE_ID);
    const ds = src?.getDataset();
    if (!ds) {
        attrs.textContent = '';
        return;
    }
    const layer = ds.layers.find((l) => l.name === targetSel.value) || ds.layers[0];
    const records = layer?.data?.getRecords?.() ?? [];
    const fields = layer?.data?.getFields?.() ?? Object.keys(records[0] ?? {});
    const head = records.slice(0, 6);
    attrs.textContent = head.length === 0
        ? '(no records)'
        : [fields.join('\t'), ...head.map((r) => fields.map((f) => r[f]).join('\t'))].join('\n');
}
function populate(source) {
    targetSel.innerHTML = '';
    source.getLayers().forEach((lyr, i) => {
        const name = lyr?.name || lyr?.id || `layer-${i}`;
        targetSel.appendChild(new Option(`${name} (${lyr?.geometry_type ?? '?'})`, name));
    });
    targetSel.disabled = source.getLayers().length === 0;
    btn.disabled = false;
    refreshAttrs();
}
targetSel.addEventListener('change', refreshAttrs);
document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file)
        return;
    status.textContent = `正在加载 ${file.name}...`;
    const reader = new FileReader();
    reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID))
            map.removeSource(SOURCE_ID);
        // Load initial data before registration: await setData, then addSource and setExtent.
        try {
            await source.setData({ filename: file.name, content });
            await map.addSource(SOURCE_ID, source);
            map.setExtent(source.getExtent());
            populate(source);
            status.textContent = `已加载 ${file.name}。粘贴 CSV、配置键,然后 Join。`;
        }
        catch (err) {
            console.error(err);
            status.textContent = "处理文件出错";
        }
    };
    reader.readAsArrayBuffer(file);
});
btn.addEventListener('click', async () => {
    const target = targetSel.value;
    const csv = csvInput.value;
    const tk = targetKeyInput.value.trim();
    const sk = sourceKeyInput.value.trim();
    if (!target || !csv || !tk || !sk) {
        status.textContent = '请填写目标图层、CSV、两个键。';
        return;
    }
    const opts = {
        source: SOURCE_ID, target,
        data: { csv },
        keys: [tk, sk],
    };
    const fl = fieldsInput.value.trim();
    if (fl)
        opts.fields = fl.split(',').map((s) => s.trim()).filter(Boolean);
    const pf = prefixInput.value.trim();
    if (pf)
        opts.prefix = pf;
    if (unjoinedInput.checked)
        opts.unjoined = true;
    status.textContent = '正在 Join...';
    btn.disabled = true;
    try {
        const result = await map.ops.joinTable(opts);
        status.textContent = result.ok ? `已 Join 到 "${target}"。Ctrl+Z 撤销。` : 'Join 失败。';
        const src = map.getSource(SOURCE_ID);
        if (src)
            populate(src);
    }
    catch (err) {
        status.textContent = `错误: ${err?.message ?? err}`;
        console.error(err);
    }
    finally {
        btn.disabled = false;
    }
});
map.on('error', (e) => {
    status.textContent = `错误: ${e?.error?.message ?? e}`;
});
await autoLoadExampleFixtures('join');
</script>
</body>

</html>
