<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 旋转 / 缩放选中要素</title>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>旋转 / 缩放选中要素</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>旋转 / 缩放选中要素</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <p id="status" class="emap-example-status">加载数据</p>
        <p class="emap-example-hint">
          单击要素选中,Shift+单击多选,空白处单击清除。然后在已选要素上按住鼠标左键拖动 → 松开落位整个选区。
          <kbd>R</kbd> 进入旋转 · <kbd>S</kbd> 进入缩放 · <kbd>T</kbd>(默认) 平移 · <kbd>Esc</kbd> 取消。
          旋转: 鼠标绕枢轴旋转的角度即为变换。 缩放: 鼠标到枢轴的距离比即为缩放因子。
          平移仍可用 <kbd>←</kbd>/<kbd>→</kbd>/<kbd>↑</kbd>/<kbd>↓</kbd>(空闲时), <kbd>[</kbd>/<kbd>]</kbd>±5° 步进, <kbd>+</kbd>/<kbd>-</kbd> ×1.1/×0.9。
          <kbd>Ctrl+Z</kbd> 撤销。
        </p>
      </section>
    </div>
  </details>

  <script type="module">
    import { installExampleMapUi } from '/src/example-runtime.ts';
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    installExampleMapUi(map, emap);
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    const SOURCE_ID = 'rotscale-source';
    const status = document.getElementById('status');

    map.on('selectionchange', (e) => {
      if (e.selected.length === 0) map.clearHighlightedFeatures();
      else map.setHighlightedFeatures(e.selected, { color: '#1e88e5', width: 3 });
    });

    const fileInput = document.getElementById('file-input');
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        // Load initial data before registration: await setData, then addSource and setExtent.
        try {
          await source.setData({ filename: file.name, content });
          await map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          // Enable the transform handler only AFTER the map/data is ready
          // (mirrors how the vertexEdit/drawFeature examples enable theirs).
          map.clickSelect.enable();
          map.transformFeature.enable();
          setMode('t');
          status.textContent = `已加载 ${file.name}。单击选中,在已选要素上按住拖动变换,T/R/S 切换模式。`;
          document.getElementById('map').focus();
        } catch (err) {
          console.error(err);
          status.textContent = "处理文件出错";
        }
      };
      reader.readAsArrayBuffer(file);
    });

    // ── Migration note ────────────────────────────────────────────────
    // The old hand-wired recipe (pixelToMap + window capture-phase
    // mousedown/move/up + beginTranslateSession/beginAffineSession +
    // rotateMatrix/scaleMatrix delta math + manual selection /
    // Esc/right-click cancel) is now TWO modal-coexisting handlers
    // (spec §15.11 "Option A"):
    //
    //   map.clickSelect.enable();                              // selection
    //   map.transformFeature.setOptions({ mode: 'rotate' });   // or 'translate' | 'scale'
    //   map.transformFeature.enable();                         // drag
    //
    // clickSelect owns selection: click = replace, shift+click = add,
    // click on empty space = clear. transformFeature owns NO selection
    // logic — it press-drags an ALREADY-selected feature: pointerdown
    // over a selected feature opens the matching editSession; drag
    // streams the delta (translate dx/dy, or rotate/scale matrix vs the
    // session origin); pointerup commits one undo entry; Escape cancels.
    // So the flow is: click to select, then press-drag a selected
    // feature to transform the whole selection. The T/R/S switcher below
    // is just a call to setOptions — no session bookkeeping. The
    // headless map.editSession step-nudge API is unchanged.
    // ──────────────────────────────────────────────────────────────────

    let mode = 't';   // 't' = translate, 'r' = rotate, 's' = scale (for UI/status)

    function modeLabel() {
      return mode === 'r' ? '旋转' : mode === 's' ? '缩放' : '平移';
    }

    // Single switcher: maps the t/r/s UI state onto the handler's mode.
    function setMode(m) { // 't' | 'r' | 's'
      mode = m;
      map.transformFeature.setOptions({
        mode: m === 't' ? 'translate' : m === 'r' ? 'rotate' : 'scale',
      });
      status.textContent = `模式: ${modeLabel()}(在要素上按住拖动,Esc 取消)。`;
    }

    // T/R/S mode switcher (same keys/labels as before — only the handler
    // wiring changed: each key now just calls setMode()).
    window.addEventListener('keydown', (e) => {
      if (e.key === 't' || e.key === 'T') setMode('t');
      else if (e.key === 'r' || e.key === 'R') setMode('r');
      else if (e.key === 's' || e.key === 'S') setMode('s');
    });

    // Keyboard step nudge stays available (headless editSession API,
    // unchanged by the handler).
    document.getElementById('map').addEventListener('keydown', (e) => {
      const fine = e.shiftKey;
      const stride = fine ? 1 : 10;
      const angle = fine ? 1 : 5;
      const scaleStep = fine ? 1.02 : 1.1;

      let dx = 0, dy = 0;
      if (e.key === 'ArrowLeft') dx = -stride;
      else if (e.key === 'ArrowRight') dx = stride;
      else if (e.key === 'ArrowUp') dy = stride;
      else if (e.key === 'ArrowDown') dy = -stride;
      if (dx || dy) { e.preventDefault(); map.editSession.translateSelected(dx, dy); return; }

      if (e.key === '[') { e.preventDefault(); map.editSession.rotateSelected(-angle); return; }
      if (e.key === ']') { e.preventDefault(); map.editSession.rotateSelected(angle); return; }
      if (e.key === '+' || e.key === '=') { e.preventDefault(); map.editSession.scaleSelected(scaleStep); return; }
      if (e.key === '-' || e.key === '_') { e.preventDefault(); map.editSession.scaleSelected(1 / scaleStep); return; }
    });
    await autoLoadExampleFixtures('feature-rotate-scale');
  </script>
</body>

</html>
