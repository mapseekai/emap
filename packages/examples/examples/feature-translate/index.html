<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 平移选中要素</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: sans-serif;
    }

    #header {
      padding: 10px;
      background: #2c3e50;
      color: white;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 13px;
    }

    #map {
      flex: 1;
      background: #ffffff;
      position: relative;
      outline: none;
    }

    .hint {
      opacity: 0.85;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="Open the Emap examples catalog"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap</span></a>
    <label>
      文件:
      <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
    </label>
    <span class="hint">单击要素选中,Shift+单击多选,空白处单击清除。然后在已选要素上按住鼠标左键拖动 → 松开落位整个选区。共享边界自动复制,相邻未选要素保持原位。Esc 取消拖动。方向键步进(Shift+方向键 ×10 加速,不复制共享边)。Ctrl+Z 撤销。</span>
    <span id="status">加载数据</span>
  </div>
  <div id="map" tabindex="0"></div>

  <script type="module">
    import { installExampleMapUi } from '/src/example-runtime.ts';
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;

    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    installExampleMapUi(map, emap);
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    const SOURCE_ID = 'translate-source';
    const fileInput = document.getElementById('file-input');
    const status = document.getElementById('status');

    map.on('selectionchange', (e) => {
      if (e.selected.length === 0) {
        map.clearHighlightedFeatures();
      } else {
        map.setHighlightedFeatures(e.selected, { color: '#1e88e5', width: 3 });
      }
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        // Canonical 0.2.0 recipe: await setData (resolves once the dataset
        // is ready), then addSource (order-independent) + setExtent.
        try {
          await source.setData({ filename: file.name, content });
          await map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          // Enable the transform handler only AFTER the map/data is ready
          // (mirrors how the vertexEdit/drawFeature examples enable theirs).
          map.clickSelect.enable();
          map.transformFeature.setOptions({ mode: 'translate' });
          map.transformFeature.enable();
          status.textContent = `已加载 ${file.name}。单击选中,在已选要素上按住拖动平移,方向键步进。`;
          // 聚焦 map 容器,让方向键事件被它接收
          document.getElementById('map').focus();
        } catch (err) {
          console.error(err);
          status.textContent = "处理文件出错";
        }
      };
      reader.readAsArrayBuffer(file);
    });

    // ── Migration note ────────────────────────────────────────────────
    // The old hand-wired recipe (pixelToMap + window capture-phase
    // mousedown/move/up + beginTranslateSession + manual selection /
    // Esc/right-click cancel) is now TWO modal-coexisting handlers
    // (spec §15.11 "Option A"):
    //
    //   map.clickSelect.enable();                                // selection
    //   map.transformFeature.setOptions({ mode: 'translate' });  // drag
    //   map.transformFeature.enable();
    //
    // clickSelect owns selection: click = replace, shift+click = add,
    // click on empty space = clear. transformFeature owns NO selection
    // logic — it press-drags an ALREADY-selected feature: pointerdown
    // over a selected feature opens the translate session, drag streams
    // the delta, pointerup commits one undo entry, Escape cancels. So the
    // flow is: click to select, then press-drag a selected feature to
    // move the whole selection. No manual mousedown/move/up or
    // empty-space-clear listener — the handlers + pointer arbiter own
    // pan-suppression and the session lifecycle.
    // ──────────────────────────────────────────────────────────────────

    // Arrow-key step nudge still works (headless editSession API,
    // unchanged by the handler).
    document.getElementById('map').addEventListener('keydown', (e) => {
      const stride = e.shiftKey ? 10 : 1;
      let dx = 0, dy = 0;
      if (e.key === 'ArrowLeft') dx = -stride;
      else if (e.key === 'ArrowRight') dx = stride;
      else if (e.key === 'ArrowUp') dy = stride; // 源数据坐标系向上为 +y
      else if (e.key === 'ArrowDown') dy = -stride;
      else return;
      e.preventDefault();
      const ok = map.editSession.translateSelected(dx, dy);
      if (ok) {
        status.textContent = `已步进 (${dx}, ${dy}),Ctrl+Z 撤销。`;
      }
    });
    await autoLoadExampleFixtures('feature-translate');
  </script>
</body>

</html>
