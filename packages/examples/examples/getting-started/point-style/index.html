<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 点图层样式 (Point layer styling)</title>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>点图层样式 (Point layer styling)</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>点图层样式 (Point layer styling)</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <div class="emap-example-field">
          <label for="target">点图层</label>
          <select id="target"></select>
        </div>
        <div class="emap-example-field">
          <label for="circle-shape">形状</label>
          <select id="circle-shape">
            <option value="circle">圆形</option>
            <option value="square">正方形</option>
            <option value="triangle">三角形</option>
            <option value="triangle-down">倒三角形</option>
            <option value="diamond">菱形</option>
            <option value="pentagon">五边形</option>
            <option value="star">五角星</option>
            <option value="cross">十字形</option>
            <option value="x">X 形</option>
            <option value="hexagon">六边形</option>
            <option value="octagon">八边形</option>
          </select>
        </div>
        <div class="emap-example-field">
          <label for="circle-color">颜色</label>
          <input id="circle-color" type="color" value="#e4572e" />
        </div>
        <div class="emap-example-field">
          <label for="circle-radius">半径</label>
          <input id="circle-radius" type="range" min="2" max="20" step="1" value="8" />
          <span id="radius-output" class="emap-example-hint">8</span>
        </div>
        <div class="emap-example-field">
          <label class="emap-example-check"><input id="circle-fill" type="checkbox" checked /> 填充</label>
        </div>
        <p id="status" class="emap-example-status">加载一个含 point 图层的数据文件</p>
        <p class="emap-example-hint">
          使用 <code>circle</code> 图层渲染点数据，并通过 <code>setPaintProperty</code>
          实时修改 <code>circle-shape</code>、<code>circle-color</code>、<code>circle-radius</code> 和 <code>circle-fill</code>。
        </p>
      </section>
    </div>
  </details>

  <script type="module">

import { installExampleMapUi } from '/src/example-runtime.ts';
import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const { Emap, TopologySource, NavigationControl } = emap;
const map = await Emap.create({ container: 'map' });
await map.addControl(new NavigationControl(), 'top-left');
await installExampleMapUi(map, emap);
const SOURCE_ID = 'point-style-source';
const LAYER_ID = 'point-style-layer';
const targetSel = document.getElementById('target');
const circleShape = document.getElementById('circle-shape');
const circleColor = document.getElementById('circle-color');
const circleRadius = document.getElementById('circle-radius');
const circleFill = document.getElementById('circle-fill');
const radiusOutput = document.getElementById('radius-output');
const status = document.getElementById('status');
function currentPaint() {
    return {
        'circle-shape': circleShape.value,
        'circle-color': circleColor.value,
        'circle-radius': Number(circleRadius.value),
        'circle-fill': circleFill.checked,
    };
}
function addPointLayer() {
    const target = targetSel.value;
    if (!target) {
        status.textContent = '此文件没有 point 图层';
        return;
    }
    if (map.getLayer(LAYER_ID))
        map.removeLayer(LAYER_ID);
    map.addLayer({
        id: LAYER_ID,
        type: 'circle',
        source: SOURCE_ID,
        'source-layer': target,
        paint: currentPaint(),
    });
    status.textContent = `正在显示点图层 "${target}"`;
}
function populate(source) {
    targetSel.innerHTML = '';
    source.getLayers().forEach((layer, index) => {
        if (layer?.geometry_type !== 'point')
            return;
        const name = layer?.name || layer?.id || `layer-${index}`;
        targetSel.appendChild(new Option(name, name));
    });
    addPointLayer();
}
function updatePaint(name, value) {
    if (!map.getLayer(LAYER_ID))
        return;
    map.setPaintProperty(LAYER_ID, name, value);
    status.textContent = `已更新 ${name}`;
}
document.getElementById('file-input').addEventListener('change', (event) => {
    const file = event.target.files[0];
    if (!file)
        return;
    status.textContent = `正在加载 ${file.name}...`;
    const reader = new FileReader();
    reader.onload = async (loadEvent) => {
        const content = new Uint8Array(loadEvent.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getLayer(LAYER_ID))
            map.removeLayer(LAYER_ID);
        if (map.getSource(SOURCE_ID))
            map.removeSource(SOURCE_ID);
        try {
            await source.setData({ filename: file.name, content });
            await map.addSource(SOURCE_ID, source);
            map.setExtent(source.getExtent());
            populate(source);
        }
        catch (error) {
            console.error(error);
            status.textContent = `错误: ${error?.message ?? error}`;
        }
    };
    reader.readAsArrayBuffer(file);
});
targetSel.addEventListener('change', addPointLayer);
circleShape.addEventListener('change', () => updatePaint('circle-shape', circleShape.value));
circleColor.addEventListener('input', () => updatePaint('circle-color', circleColor.value));
circleRadius.addEventListener('input', () => {
    const radius = Number(circleRadius.value);
    radiusOutput.textContent = String(radius);
    updatePaint('circle-radius', radius);
});
circleFill.addEventListener('change', () => updatePaint('circle-fill', circleFill.checked));
await autoLoadExampleFixtures('getting-started/point-style');
</script>
</body>

</html>
