<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 提取点 (Points)</title>
  <style>
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
    #header { padding: 10px; background: #2c3e50; color: white; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
    #header select, #header input[type="text"] { padding: 4px 6px; font-size: 13px; border: 1px solid #4a5d70; border-radius: 3px; }
    #header input[type="text"] { width: 110px; }
    #header button { padding: 5px 12px; background: #16a085; color: white; border: 0; border-radius: 3px; cursor: pointer; font-size: 13px; }
    #header button:disabled { background: #7f8c8d; cursor: not-allowed; }
    #map { flex: 1; background: #ffffff; position: relative; outline: none; }
    .hint { opacity: 0.85; font-size: 12px; flex-basis: 100%; }
  </style>
</head>

<body>
  <div id="header">
    <label>文件: <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" /></label>
    <label>目标图层: <select id="target"></select></label>
    <label>模式:
      <select id="mode">
        <option value="centroid">centroid (面 → 几何中心)</option>
        <option value="inner">inner (面 → 内部最大环代表点)</option>
        <option value="vertices">vertices (面/线 → 顶点)</option>
        <option value="endpoints">endpoints (面/线 → 端点)</option>
        <option value="midpoints">midpoints (线 → 中点)</option>
        <option value="interpolated">interpolated (线 → 等距采样)</option>
      </select>
    </label>
    <label>采样间距 (interpolated 必填): <input id="interval" type="text" placeholder="单位: 源 CRS" /></label>
    <label>新图层名: <input id="name" type="text" placeholder="可选" /></label>
    <label><input id="no-replace" type="checkbox" /> 保留原图层</label>
    <button id="btn" disabled>提取点</button>
    <span id="status">加载一个含面或线的数据文件</span>
    <span class="hint">
      mapshaper <code>-points</code> 把面/线层换成点层。模式互斥;<code>interpolated</code> 必须配合
      <code>interval</code>。Ctrl+Z 可撤销。
    </span>
  </div>
  <div id="map" tabindex="0"></div>

  <link rel="stylesheet" href="../../src/ui/controls.css" />
  <script src="../../dist/mapshaper-vendor.js"></script>
  <script src="../../dist/emap-dev.js"></script>
  <script>
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    const SOURCE_ID = 'points-source';
    const targetSel = document.getElementById('target');
    const modeSel = document.getElementById('mode');
    const intervalInput = document.getElementById('interval');
    const nameInput = document.getElementById('name');
    const noReplace = document.getElementById('no-replace');
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');

    function populate(source) {
      targetSel.innerHTML = '';
      source.getLayers().forEach((lyr, i) => {
        const name = lyr?.name || lyr?.id || `layer-${i}`;
        targetSel.appendChild(new Option(`${name} (${lyr?.geometry_type ?? '?'})`, name));
      });
      btn.disabled = source.getLayers().length === 0;
    }

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        // Canonical 0.2.0 recipe: await setData (resolves once the dataset
        // is ready), then addSource (order-independent) + setExtent.
        try {
          await source.setData({ filename: file.name, content });
          map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          populate(source);
          status.textContent = `已加载 ${file.name}。`;
        } catch (err) {
          console.error(err);
          status.textContent = `错误: ${err?.message ?? err}`;
        }
      };
      reader.readAsArrayBuffer(file);
    });

    btn.addEventListener('click', async () => {
      const target = targetSel.value;
      const type = modeSel.value;
      if (!target) return;
      const opts = { source: SOURCE_ID, target, type };
      const intv = intervalInput.value.trim();
      if (intv && !isNaN(Number(intv))) opts.interval = Number(intv);
      const nm = nameInput.value.trim();
      if (nm) opts.name = nm;
      if (noReplace.checked) opts.noReplace = true;
      status.textContent = `正在按 "${type}" 模式从 "${target}" 提取点...`;
      btn.disabled = true;
      try {
        const ok = await map.ops.pointsLayer(opts);
        status.textContent = ok
          ? `已从 "${target}" 提取点 (${type}),Ctrl+Z 撤销。`
          : '提取失败 (检查图层几何类型与 interpolated 的 interval)。';
        const src = map.getSource(SOURCE_ID);
        if (src) populate(src);
      } catch (err) {
        status.textContent = `错误: ${err?.message ?? err}`;
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
