<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 几何转点 (Geometry to points)</title>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>几何转点 (Geometry to points)</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>几何转点 (Geometry to points)</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <div class="emap-example-field">
          <label for="target">目标图层</label>
          <select id="target"></select>
        </div>
        <div class="emap-example-field">
          <label for="mode">模式</label>
          <select id="mode">
            <option value="centroid">centroid (面 → 几何中心)</option>
            <option value="inner">inner (面 → 内部最大环代表点)</option>
            <option value="vertices">vertices (面/线 → 顶点)</option>
            <option value="endpoints">endpoints (面/线 → 端点)</option>
            <option value="midpoints">midpoints (线 → 中点)</option>
            <option value="interpolated">interpolated (线 → 等距采样)</option>
          </select>
        </div>
        <div class="emap-example-field">
          <label for="interval">采样间距 (interpolated 必填)</label>
          <input id="interval" type="text" placeholder="单位: 源 CRS" />
        </div>
        <div class="emap-example-field">
          <label for="name">新图层名</label>
          <input id="name" type="text" placeholder="可选" />
        </div>
        <div class="emap-example-field">
          <label class="emap-example-check"><input id="no-replace" type="checkbox" /> 保留原图层</label>
        </div>
        <button id="btn" class="emap-example-primary-button" disabled>提取点</button>
        <p id="status" class="emap-example-status">加载一个含面或线的数据文件</p>
        <p class="emap-example-hint">
          mapshaper <code>-points</code> 把面/线层换成点层。模式互斥;<code>interpolated</code> 必须配合
          <code>interval</code>。Ctrl+Z 可撤销。
        </p>
      </section>
    </div>
  </details>

  <script type="module">

import { installExampleMapUi } from '/src/example-runtime.ts';
import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
const map = await Emap.create({ container: 'map' });
await map.addControl(new NavigationControl(), 'top-left');
await installExampleMapUi(map, emap);
await map.addControl(new HistoryControl(), 'top-left');
map.bindHistoryShortcuts();
const SOURCE_ID = 'points-source';
const targetSel = document.getElementById('target');
const modeSel = document.getElementById('mode');
const intervalInput = document.getElementById('interval');
const nameInput = document.getElementById('name');
const noReplace = document.getElementById('no-replace');
const btn = document.getElementById('btn');
const status = document.getElementById('status');
function populate(source) {
    targetSel.innerHTML = '';
    source.getLayers().forEach((lyr, i) => {
        const name = lyr?.name || lyr?.id || `layer-${i}`;
        targetSel.appendChild(new Option(`${name} (${lyr?.geometry_type ?? '?'})`, name));
    });
    btn.disabled = source.getLayers().length === 0;
}
document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file)
        return;
    status.textContent = `正在加载 ${file.name}...`;
    const reader = new FileReader();
    reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID))
            map.removeSource(SOURCE_ID);
        // Load initial data before registration: await setData, then addSource and setExtent.
        try {
            await source.setData({ filename: file.name, content });
            await map.addSource(SOURCE_ID, source);
            map.setExtent(source.getExtent());
            populate(source);
            status.textContent = `已加载 ${file.name}。`;
        }
        catch (err) {
            console.error(err);
            status.textContent = `错误: ${err?.message ?? err}`;
        }
    };
    reader.readAsArrayBuffer(file);
});
btn.addEventListener('click', async () => {
    const target = targetSel.value;
    const type = modeSel.value;
    if (!target)
        return;
    const opts = { source: SOURCE_ID, target, type };
    const intv = intervalInput.value.trim();
    if (intv && !isNaN(Number(intv)))
        opts.interval = Number(intv);
    const nm = nameInput.value.trim();
    if (nm)
        opts.name = nm;
    if (noReplace.checked)
        opts.noReplace = true;
    status.textContent = `正在按 "${type}" 模式从 "${target}" 提取点...`;
    btn.disabled = true;
    try {
        const result = await map.ops.pointsLayer(opts);
        status.textContent = result.ok
            ? `已从 "${target}" 提取点 (${type}),Ctrl+Z 撤销。`
            : '提取失败 (检查图层几何类型与 interpolated 的 interval)。';
        const src = map.getSource(SOURCE_ID);
        if (src)
            populate(src);
    }
    catch (err) {
        status.textContent = `错误: ${err?.message ?? err}`;
        console.error(err);
    }
    finally {
        btn.disabled = false;
    }
});
await autoLoadExampleFixtures('getting-started/points');
</script>
</body>

</html>
