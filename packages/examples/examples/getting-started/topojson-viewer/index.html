<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emap 示例 — TopoJSON 查看器</title>
  </head>
  <body class="emap-example-with-floating-header">
    <div id="header">
      <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
      <strong>TopoJSON 查看器</strong>
    </div>
    <div id="map" tabindex="0"></div>

    <details class="emap-example-workbench panel" open>
      <summary><h1>TopoJSON 查看器</h1></summary>
      <div class="emap-example-workbench-body">
        <section class="emap-example-section">
          <div class="emap-example-field">
            <label for="file-input">文件</label>
            <input type="file" id="file-input" accept=".topojson,.json,application/topo+json,application/json" />
          </div>
          <p id="status" class="emap-example-status">上传 TopoJSON 文件开始</p>
        </section>
      </div>
    </details>

    <script type="module">
import { getExampleRenderer } from '/src/renderer-choice.ts';


import { autoLoadExampleFixtures, installExampleMapUi, loadExampleRuntime } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const { Emap, TopologySource } = emap;
const SOURCE_ID = 'topojson-source';
const map = await Emap.create({ renderer: getExampleRenderer(), container: 'map' });
await map.addControl(new emap.NavigationControl(), 'top-left');
await installExampleMapUi(map, emap);
const fileInput = document.getElementById('file-input');
const status = document.getElementById('status');
fileInput.addEventListener('change', async (event) => {
    const file = event.target.files[0];
    if (!file)
        return;
    status.textContent = `处理 ${file.name} 中...`;
    const content = new Uint8Array(await file.arrayBuffer());
    const source = new TopologySource(SOURCE_ID);
    try {
        if (map.getSource(SOURCE_ID))
            map.removeSource(SOURCE_ID);
        await source.setData({ filename: file.name, content });
        await map.addSource(SOURCE_ID, source);
        map.setExtent(source.getExtent());
        status.textContent = `当前: ${file.name}`;
    }
    catch (error) {
        console.error(error);
        status.textContent = `处理文件出错: ${error?.message ?? error}`;
    }
});
window.addEventListener('resize', () => map.resize());
await autoLoadExampleFixtures('getting-started/topojson-viewer');
</script>
  </body>
</html>
