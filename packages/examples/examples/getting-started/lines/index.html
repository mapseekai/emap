<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 线图层样式 (Line layer styling)</title>
  <style>
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
    #header { padding: 10px; background: #2c3e50; color: white; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
    #header select, #header input[type="color"], #header input[type="range"] { padding: 3px 6px; font-size: 13px; border: 1px solid #4a5d70; border-radius: 3px; background: #fff; }
    #header input[type="color"] { padding: 0; width: 38px; height: 26px; }
    #header label { display: inline-flex; align-items: center; gap: 4px; }
    #map { flex: 1; background: #ffffff; position: relative; outline: none; }
    .group { display: flex; gap: 8px; align-items: center; padding-left: 10px; border-left: 1px solid #4a5d70; }
    .hint { opacity: 0.85; font-size: 12px; flex-basis: 100%; }
  </style>
</head>

<body>
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="Open the Emap examples catalog"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap</span></a>
    <label>文件: <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" /></label>
    <label>线图层: <select id="target"></select></label>
    <span class="group">
      <label>颜色: <input id="line-color" type="color" value="#2563eb" /></label>
      <label>线宽: <input id="line-width" type="range" min="1" max="12" step="0.5" value="4" /> <span id="width-output">4</span></label>
      <label>线型:
        <select id="line-dash">
          <option value="">实线</option>
          <option value="8,4">虚线</option>
          <option value="2,4">点线</option>
          <option value="12,4,3,4">点划线</option>
          <option value="arrow-dot">箭头点划线</option>
        </select>
      </label>
      <label>箭头间距: <input id="arrow-spacing" type="range" min="12" max="80" step="2" value="32" /> <span id="spacing-output">32</span></label>
      <label>箭头大小: <input id="arrow-size" type="range" min="3" max="16" step="1" value="6" /> <span id="size-output">6</span></label>
    </span>
    <span id="status">加载一个含 polyline 图层的数据文件</span>
    <span class="hint">
      使用 <code>line</code> 图层渲染线数据，并通过 <code>setPaintProperty</code> 实时修改
      <code>line-color</code>、<code>line-width</code>、<code>line-dasharray</code> 和
      <code>line-dashstyle</code>。箭头点划线按坐标顺序显示方向；间距和大小均为 CSS 像素。
    </span>
  </div>
  <div id="map" tabindex="0"></div>

  <script type="module">
    import { installExampleMapUi } from '/src/example-runtime.ts';
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, NavigationControl } = emap;
    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    installExampleMapUi(map, emap);
    const SOURCE_ID = 'lines-source';
    const LAYER_ID = 'lines-layer';
    const targetSel = document.getElementById('target');
    const lineColor = document.getElementById('line-color');
    const lineWidth = document.getElementById('line-width');
    const lineDash = document.getElementById('line-dash');
    const arrowSpacing = document.getElementById('arrow-spacing');
    const arrowSize = document.getElementById('arrow-size');
    const widthOutput = document.getElementById('width-output');
    const spacingOutput = document.getElementById('spacing-output');
    const sizeOutput = document.getElementById('size-output');
    const status = document.getElementById('status');

    function currentDash() {
      if (lineDash.value === 'arrow-dot') return [];
      return lineDash.value.split(',').filter(Boolean).map(Number);
    }

    function currentDashStyle() {
      return lineDash.value === 'arrow-dot' ? 'arrow-dot' : undefined;
    }

    function addLineLayer() {
      const target = targetSel.value;
      if (!target) {
        status.textContent = '此文件没有 polyline 图层';
        return;
      }
      if (map.getLayer(LAYER_ID)) map.removeLayer(LAYER_ID);
      map.addLayer({
        id: LAYER_ID,
        type: 'line',
        source: SOURCE_ID,
        'source-layer': target,
        paint: {
          'line-color': lineColor.value,
          'line-width': Number(lineWidth.value),
          'line-dasharray': currentDash(),
          'line-dashstyle': currentDashStyle(),
          'line-arrow-spacing': Number(arrowSpacing.value),
          'line-arrow-size': Number(arrowSize.value),
        },
      });
      status.textContent = `正在显示线图层 "${target}"`;
    }

    function populate(source) {
      targetSel.innerHTML = '';
      source.getLayers().forEach((lyr, index) => {
        if (lyr?.geometry_type !== 'polyline') return;
        const name = lyr?.name || lyr?.id || `layer-${index}`;
        targetSel.appendChild(new Option(name, name));
      });
      addLineLayer();
    }

    function updatePaint(name, value) {
      if (!map.getLayer(LAYER_ID)) return;
      map.setPaintProperty(LAYER_ID, name, value);
      status.textContent = `已更新 ${name}`;
    }

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getLayer(LAYER_ID)) map.removeLayer(LAYER_ID);
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        // Canonical 0.2.0 recipe: await setData (resolves once the dataset
        // is ready), then addSource (order-independent) + setExtent.
        try {
          await source.setData({ filename: file.name, content });
          await map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          populate(source);
        } catch (err) {
          console.error(err);
          status.textContent = `错误: ${err?.message ?? err}`;
        }
      };
      reader.readAsArrayBuffer(file);
    });

    targetSel.addEventListener('change', addLineLayer);
    lineColor.addEventListener('input', () => updatePaint('line-color', lineColor.value));
    lineWidth.addEventListener('input', () => {
      const width = Number(lineWidth.value);
      widthOutput.textContent = String(width);
      updatePaint('line-width', width);
    });
    lineDash.addEventListener('change', () => {
      updatePaint('line-dasharray', currentDash());
      updatePaint('line-dashstyle', currentDashStyle());
    });
    arrowSpacing.addEventListener('input', () => {
      spacingOutput.textContent = arrowSpacing.value;
      updatePaint('line-arrow-spacing', Number(arrowSpacing.value));
    });
    arrowSize.addEventListener('input', () => {
      sizeOutput.textContent = arrowSize.value;
      updatePaint('line-arrow-size', Number(arrowSize.value));
    });
    await autoLoadExampleFixtures('getting-started/lines');
  </script>
</body>

</html>
