<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - GeoJSON 查看器</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: sans-serif;
    }

    #header {
      padding: 10px;
      background: #34495e;
      color: white;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    #map {
      flex: 1;
      background: #ffffff;
      position: relative;
    }

    .info {
      margin-left: auto;
      font-size: 0.85em;
    }
  </style>
</head>

<body>
  <div id="header">
    <strong>Emap 示例</strong>
    <input type="file" id="file-input" accept=".json,.geojson,.zip" />
    <div class="info" id="status">上传 GeoJSON 文件开始</div>
  </div>
  <div id="map"></div>

  <script type="module">
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource } = emap;

    const map = new Emap({
      container: "map",
    });

    map.addControl(new emap.NavigationControl(), "top-left");
    map.addControl(new emap.BasemapControl(), "top-right");
    map.addControl(
      new emap.StatusControl({
        alignment: "right",
        showEPSG: true,
      }),
      "bottom-right",
    );

    const fileInput = document.getElementById("file-input");
    const status = document.getElementById("status");

    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      status.textContent = `处理 ${file.name} 中...`;

      try {
        const reader = new FileReader();
        reader.onload = async (event) => {
          const content = new Uint8Array(event.target.result);
          const source = new TopologySource("test-source");

          if (map.getSource("test-source")) {
            map.removeSource("test-source");
          }

          // Canonical 0.2.0 recipe: await setData (resolves once the dataset
          // is ready), then addSource (order-independent) + setExtent.
          try {
            await source.setData({ filename: file.name, content });
            map.addSource("test-source", source);
            map.setExtent(source.getExtent());
            status.textContent = `当前: ${file.name}`;
          } catch (err) {
            console.error(err);
            status.textContent = "处理文件出错";
          }
        };
        reader.readAsArrayBuffer(file);
      } catch (err) {
        console.error(err);
        status.textContent = "处理文件出错";
      }
    });

    window.addEventListener("resize", () => {
      map.resize();
    });
    await autoLoadExampleFixtures('getting-started/geojson-viewer');
  </script>
</body>

</html>
