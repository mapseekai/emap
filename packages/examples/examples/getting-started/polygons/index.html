<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 折线 → 面 (Polygons)</title>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>折线 → 面 (Polygons)</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>折线 → 面 (Polygons)</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <div class="emap-example-field">
          <label for="target">目标折线图层</label>
          <select id="target"></select>
        </div>
        <div class="emap-example-field">
          <label for="gap">缝隙容差 (gap-tolerance)</label>
          <input id="gap" type="text" placeholder="可选,源 CRS 单位" />
        </div>
        <div class="emap-example-field">
          <label class="emap-example-check"><input id="from-rings" type="checkbox" /> from-rings (输入已闭合)</label>
        </div>
        <button id="btn" class="emap-example-primary-button" disabled>形成多边形</button>
        <p id="status" class="emap-example-status">加载一个含折线图层的数据文件</p>
        <p class="emap-example-hint">
          mapshaper <code>-polygons</code> 把折线层闭合为面层。默认会吸附小缝隙;
          <code>from-rings</code> 跳过吸附,用于已闭合的环路输入。Ctrl+Z 可撤销。
        </p>
      </section>
    </div>
  </details>

  <script type="module">

import { installExampleMapUi } from '/src/example-runtime.ts';
import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
const map = await Emap.create({ container: 'map' });
await map.addControl(new NavigationControl(), 'top-left');
await installExampleMapUi(map, emap);
await map.addControl(new HistoryControl(), 'top-left');
map.bindHistoryShortcuts();
const SOURCE_ID = 'polygons-source';
const targetSel = document.getElementById('target');
const gapInput = document.getElementById('gap');
const fromRingsInput = document.getElementById('from-rings');
const btn = document.getElementById('btn');
const status = document.getElementById('status');
function populate(source) {
    targetSel.innerHTML = '';
    source.getLayers().forEach((lyr, i) => {
        if (lyr?.geometry_type !== 'polyline')
            return;
        const name = lyr?.name || lyr?.id || `layer-${i}`;
        targetSel.appendChild(new Option(name, name));
    });
    btn.disabled = targetSel.options.length === 0;
}
document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file)
        return;
    status.textContent = `正在加载 ${file.name}...`;
    const reader = new FileReader();
    reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID))
            map.removeSource(SOURCE_ID);
        // Load initial data before registration: await setData, then addSource and setExtent.
        try {
            await source.setData({ filename: file.name, content });
            await map.addSource(SOURCE_ID, source);
            map.setExtent(source.getExtent());
            populate(source);
            status.textContent = targetSel.options.length === 0
                ? `${file.name} 中没有折线图层。`
                : `已加载 ${file.name}。`;
        }
        catch (err) {
            console.error(err);
            status.textContent = `错误: ${err?.message ?? err}`;
        }
    };
    reader.readAsArrayBuffer(file);
});
btn.addEventListener('click', async () => {
    const target = targetSel.value;
    if (!target)
        return;
    const opts = { source: SOURCE_ID, target };
    const g = gapInput.value.trim();
    if (g && !isNaN(Number(g)))
        opts.gapTolerance = Number(g);
    if (fromRingsInput.checked)
        opts.fromRings = true;
    status.textContent = `正在把 "${target}" 转换为面...`;
    btn.disabled = true;
    try {
        const result = await map.ops.polygonsLayer(opts);
        status.textContent = result.ok ? `"${target}" 已转换为面,Ctrl+Z 撤销。` : '转换失败。';
        const src = map.getSource(SOURCE_ID);
        if (src)
            populate(src);
    }
    catch (err) {
        status.textContent = `错误: ${err?.message ?? err}`;
        console.error(err);
    }
    finally {
        btn.disabled = false;
    }
});
await autoLoadExampleFixtures('getting-started/polygons');
</script>
</body>

</html>
