<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 折线 → 面 (Polygons)</title>
  <style>
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
    #header { padding: 10px; background: #2c3e50; color: white; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
    #header select, #header input[type="text"] { padding: 4px 6px; font-size: 13px; border: 1px solid #4a5d70; border-radius: 3px; }
    #header input[type="text"] { width: 130px; }
    #header button { padding: 5px 12px; background: #16a085; color: white; border: 0; border-radius: 3px; cursor: pointer; font-size: 13px; }
    #header button:disabled { background: #7f8c8d; cursor: not-allowed; }
    #map { flex: 1; background: #ffffff; position: relative; outline: none; }
    .hint { opacity: 0.85; font-size: 12px; flex-basis: 100%; }
  </style>
</head>

<body>
  <div id="header">
    <label>文件: <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" /></label>
    <label>目标折线图层: <select id="target"></select></label>
    <label>缝隙容差 (gap-tolerance): <input id="gap" type="text" placeholder="可选,源 CRS 单位" /></label>
    <label><input id="from-rings" type="checkbox" /> from-rings (输入已闭合)</label>
    <button id="btn" disabled>形成多边形</button>
    <span id="status">加载一个含折线图层的数据文件</span>
    <span class="hint">
      mapshaper <code>-polygons</code> 把折线层闭合为面层。默认会吸附小缝隙;
      <code>from-rings</code> 跳过吸附,用于已闭合的环路输入。Ctrl+Z 可撤销。
    </span>
  </div>
  <div id="map" tabindex="0"></div>

  <script type="module">
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    const SOURCE_ID = 'polygons-source';
    const targetSel = document.getElementById('target');
    const gapInput = document.getElementById('gap');
    const fromRingsInput = document.getElementById('from-rings');
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');

    function populate(source) {
      targetSel.innerHTML = '';
      source.getLayers().forEach((lyr, i) => {
        if (lyr?.geometry_type !== 'polyline') return;
        const name = lyr?.name || lyr?.id || `layer-${i}`;
        targetSel.appendChild(new Option(name, name));
      });
      btn.disabled = targetSel.options.length === 0;
    }

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        // Canonical 0.2.0 recipe: await setData (resolves once the dataset
        // is ready), then addSource (order-independent) + setExtent.
        try {
          await source.setData({ filename: file.name, content });
          map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          populate(source);
          status.textContent = targetSel.options.length === 0
            ? `${file.name} 中没有折线图层。`
            : `已加载 ${file.name}。`;
        } catch (err) {
          console.error(err);
          status.textContent = `错误: ${err?.message ?? err}`;
        }
      };
      reader.readAsArrayBuffer(file);
    });

    btn.addEventListener('click', async () => {
      const target = targetSel.value;
      if (!target) return;
      const opts = { source: SOURCE_ID, target };
      const g = gapInput.value.trim();
      if (g && !isNaN(Number(g))) opts.gapTolerance = Number(g);
      if (fromRingsInput.checked) opts.fromRings = true;
      status.textContent = `正在把 "${target}" 转换为面...`;
      btn.disabled = true;
      try {
        const ok = await map.ops.polygonsLayer(opts);
        status.textContent = ok ? `"${target}" 已转换为面,Ctrl+Z 撤销。` : '转换失败。';
        const src = map.getSource(SOURCE_ID);
        if (src) populate(src);
      } catch (err) {
        status.textContent = `错误: ${err?.message ?? err}`;
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    });
    await autoLoadExampleFixtures('getting-started/polygons');
  </script>
</body>

</html>
