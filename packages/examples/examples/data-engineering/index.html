<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 数据工程批次 (drop / sort / uniq / filter-fields / rename-fields)</title>
  <style>
    .emap-example-workbench button.danger {
      border-color: var(--emap-example-error);
      color: var(--emap-example-error);
    }
  </style>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>数据工程批次 (drop / sort / uniq / filter-fields / rename-fields)</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>数据工程批次</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <div class="emap-example-field">
          <label for="target">目标图层</label>
          <select id="target"></select>
        </div>
      </section>
      <section class="emap-example-section">
        <h2>drop</h2>
        <div class="emap-example-row">
          <button id="drop-btn" class="danger" disabled>删除图层</button>
        </div>
      </section>
      <section class="emap-example-section">
        <h2>sort</h2>
        <div class="emap-example-field">
          <label for="sort-expr">表达式</label>
          <input id="sort-expr" type="text" placeholder="例如 POP 或 -this.area" />
        </div>
        <div class="emap-example-field">
          <label class="emap-example-check"><input id="sort-desc" type="checkbox" /> descending</label>
        </div>
        <div class="emap-example-row">
          <button id="sort-btn" disabled>排序</button>
        </div>
      </section>
      <section class="emap-example-section">
        <h2>uniq</h2>
        <div class="emap-example-field">
          <label for="uniq-expr">id 表达式</label>
          <input id="uniq-expr" type="text" placeholder="例如 STATE_FIPS" />
        </div>
        <div class="emap-example-field">
          <label for="uniq-max">max-count</label>
          <input id="uniq-max" type="text" placeholder="可选,&gt; 0" />
        </div>
        <div class="emap-example-field">
          <label class="emap-example-check"><input id="uniq-invert" type="checkbox" /> invert</label>
        </div>
        <div class="emap-example-row">
          <button id="uniq-btn" disabled>去重</button>
        </div>
      </section>
      <section class="emap-example-section">
        <h2>filter-fields</h2>
        <div class="emap-example-field">
          <label for="ff-fields">保留字段</label>
          <input id="ff-fields" type="text" placeholder="逗号分隔,例如 fips,name" />
        </div>
        <div class="emap-example-field">
          <label class="emap-example-check"><input id="ff-invert" type="checkbox" /> invert (改为删除)</label>
        </div>
        <div class="emap-example-row">
          <button id="ff-btn" disabled>筛选字段</button>
        </div>
      </section>
      <section class="emap-example-section">
        <h2>rename-fields</h2>
        <div class="emap-example-field">
          <label for="rf-map">映射</label>
          <input id="rf-map" type="text" placeholder="逗号分隔 old=new,例如 fips=FIPS,st=STATE" />
        </div>
        <div class="emap-example-row">
          <button id="rf-btn" disabled>重命名字段</button>
        </div>
        <p id="status" class="emap-example-status">加载数据后选目标图层,然后操作。所有操作可 Ctrl+Z 撤销。</p>
      </section>
    </div>
  </details>

  <script type="module">
    import { installExampleMapUi } from '/src/example-runtime.ts';
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    installExampleMapUi(map, emap);
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    const SOURCE_ID = 'data-eng-source';
    const targetSel = document.getElementById('target');
    const status = document.getElementById('status');

    const dropBtn = document.getElementById('drop-btn');
    const sortBtn = document.getElementById('sort-btn');
    const uniqBtn = document.getElementById('uniq-btn');
    const ffBtn = document.getElementById('ff-btn');
    const rfBtn = document.getElementById('rf-btn');
    const allBtns = [dropBtn, sortBtn, uniqBtn, ffBtn, rfBtn];

    function populate(source) {
      targetSel.innerHTML = '';
      source.getLayers().forEach((lyr, i) => {
        const name = lyr?.name || lyr?.id || `layer-${i}`;
        targetSel.appendChild(new Option(`${name} (${lyr?.geometry_type ?? '?'})`, name));
      });
      const enabled = source.getLayers().length > 0;
      allBtns.forEach((b) => { b.disabled = !enabled; });
    }

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        // Canonical 0.2.0 recipe: await setData (resolves once the dataset
        // is ready), then addSource (order-independent) + setExtent.
        try {
          await source.setData({ filename: file.name, content });
          await map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          populate(source);
          status.textContent = `已加载 ${file.name}。`;
        } catch (err) {
          console.error(err);
        }
      };
      reader.readAsArrayBuffer(file);
    });

    function refreshAfterOp() {
      const src = map.getSource(SOURCE_ID);
      if (src) populate(src);
    }

    function wrap(btn, runner) {
      btn.addEventListener('click', async () => {
        const target = targetSel.value;
        if (!target) return;
        status.textContent = '执行中...';
        allBtns.forEach((b) => { b.disabled = true; });
        try {
          const ok = await runner(target);
          status.textContent = ok ? '完成。Ctrl+Z 撤销。' : '失败 (检查参数)。';
        } catch (err) {
          status.textContent = `错误: ${err?.message ?? err}`;
          console.error(err);
        } finally {
          refreshAfterOp();
        }
      });
    }

    wrap(dropBtn, (target) => map.ops.dropLayer({ source: SOURCE_ID, target }));

    wrap(sortBtn, (target) => {
      const expression = document.getElementById('sort-expr').value.trim();
      if (!expression) return false;
      const descending = document.getElementById('sort-desc').checked;
      return map.ops.sortFeatures({ source: SOURCE_ID, target, expression, descending });
    });

    wrap(uniqBtn, (target) => {
      const expression = document.getElementById('uniq-expr').value.trim();
      if (!expression) return false;
      const opts = { source: SOURCE_ID, target, expression };
      const maxRaw = document.getElementById('uniq-max').value.trim();
      if (maxRaw) {
        const n = Number(maxRaw);
        if (!Number.isNaN(n) && n > 0) opts.maxCount = n;
      }
      if (document.getElementById('uniq-invert').checked) opts.invert = true;
      return map.ops.uniqueFeatures(opts);
    });

    wrap(ffBtn, (target) => {
      const raw = document.getElementById('ff-fields').value.trim();
      if (!raw) return false;
      const fields = raw.split(',').map((s) => s.trim()).filter(Boolean);
      const invert = document.getElementById('ff-invert').checked;
      return map.ops.filterFields({ source: SOURCE_ID, target, fields, invert });
    });

    wrap(rfBtn, (target) => {
      const raw = document.getElementById('rf-map').value.trim();
      if (!raw) return false;
      const mapping = {};
      for (const pair of raw.split(',').map((s) => s.trim()).filter(Boolean)) {
        const [k, v] = pair.split('=').map((s) => s.trim());
        if (k && v) mapping[k] = v;
      }
      return map.ops.renameFields({ source: SOURCE_ID, target, mapping });
    });
    await autoLoadExampleFixtures('data-engineering');
  </script>
</body>

</html>
