<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 多图层并集 (Union)</title>
  <style>
    .layer-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .layer-list label {
      padding: 3px 8px;
      border: 1px solid var(--emap-example-border-strong);
      background: var(--emap-example-muted);
      cursor: pointer;
      user-select: none;
      font-size: 11px;
    }
    .layer-list label.active {
      border-color: var(--emap-example-primary);
      background: var(--emap-example-selection);
    }
    .layer-list input { display: none; }
  </style>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>多图层并集 (Union)</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>多图层并集 (Union)</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件 (可一次选多个或多次添加)</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" multiple />
        </div>
        <div class="emap-example-row">
          <button id="clear-files-btn" type="button">清空</button>
        </div>
        <div class="emap-example-field">
          <span class="emap-example-label">勾选 ≥ 2 个面图层做并集:</span>
          <div class="layer-list" id="layer-list"></div>
        </div>
        <button id="union-btn" class="emap-example-primary-button" disabled>计算并集</button>
        <p id="status" class="emap-example-status">上传两个或多个面数据文件</p>
        <p class="emap-example-hint">
          mapshaper <code>-union</code> 把两个及以上面图层叠加,每个相交区拆为独立面,属性来自源图层并集。
          可分多次上传单图层文件,Emap 会合并到同一数据源。
        </p>
      </section>
    </div>
  </details>

  <script type="module">

import { installExampleMapUi } from '/src/example-runtime.ts';
import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
const map = await Emap.create({ container: 'map' });
await map.addControl(new NavigationControl(), 'top-left');
await installExampleMapUi(map, emap);
await map.addControl(new HistoryControl(), 'top-left');
map.bindHistoryShortcuts();
const SOURCE_ID = 'union-source';
const fileInput = document.getElementById('file-input');
const clearBtn = document.getElementById('clear-files-btn');
const layerList = document.getElementById('layer-list');
const unionBtn = document.getElementById('union-btn');
const status = document.getElementById('status');
/** filename -> Uint8Array (累计上传) */
const uploaded = new Map();
function readFile(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => resolve(new Uint8Array(ev.target.result));
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
    });
}
function refreshLayerList(source) {
    layerList.innerHTML = '';
    const layers = source.getLayers();
    layers.forEach((lyr, i) => {
        if (lyr?.geometry_type !== 'polygon')
            return;
        const name = lyr?.name || lyr?.id || `layer-${i}`;
        const id = `layer-${i}`;
        const label = document.createElement('label');
        label.htmlFor = id;
        label.textContent = name;
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.id = id;
        input.dataset.layerName = name;
        input.addEventListener('change', () => {
            label.classList.toggle('active', input.checked);
            updateButton();
        });
        label.appendChild(input);
        layerList.appendChild(label);
    });
    updateButton();
}
function selectedTargets() {
    return Array.from(layerList.querySelectorAll('input:checked'))
        .map((el) => el.dataset.layerName);
}
function updateButton() {
    unionBtn.disabled = selectedTargets().length < 2;
}
async function reimportAll() {
    if (uploaded.size === 0) {
        if (map.getSource(SOURCE_ID))
            map.removeSource(SOURCE_ID);
        layerList.innerHTML = '';
        unionBtn.disabled = true;
        status.textContent = '已清空,等待上传文件';
        return;
    }
    status.textContent = `加载 ${uploaded.size} 个文件中...`;
    const entries = Array.from(uploaded, ([filename, content]) => ({ filename, content }));
    const source = new TopologySource(SOURCE_ID);
    if (map.getSource(SOURCE_ID))
        map.removeSource(SOURCE_ID);
    // Load initial data before registration: await setData, then addSource and setExtent.
    try {
        await source.setData(entries);
        await map.addSource(SOURCE_ID, source);
        map.setExtent(source.getExtent());
        refreshLayerList(source);
        status.textContent = `已加载 ${uploaded.size} 个文件。勾选 ≥ 2 个面图层后点击 "计算并集"。`;
    }
    catch (e) {
        console.error(e);
        status.textContent = `加载失败: ${e.error?.message ?? e}`;
    }
}
fileInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length === 0)
        return;
    for (const f of files) {
        try {
            uploaded.set(f.name, await readFile(f));
        }
        catch (err) {
            console.error(`读取 ${f.name} 失败`, err);
        }
    }
    fileInput.value = '';
    await reimportAll();
});
clearBtn.addEventListener('click', async () => {
    uploaded.clear();
    await reimportAll();
});
unionBtn.addEventListener('click', async () => {
    const targets = selectedTargets();
    if (targets.length < 2)
        return;
    status.textContent = `正在对 ${targets.length} 个图层做并集...`;
    unionBtn.disabled = true;
    try {
        const result = await map.ops.unionLayers({ source: SOURCE_ID, targets });
        status.textContent = result.ok ? `已对 ${targets.join(' / ')} 完成并集,Ctrl+Z 撤销。` : '并集失败。';
        const src = map.getSource(SOURCE_ID);
        if (src)
            refreshLayerList(src);
    }
    catch (err) {
        status.textContent = `错误: ${err?.message ?? err}`;
        console.error(err);
    }
    finally {
        updateButton();
    }
});
await autoLoadExampleFixtures('union');
</script>
</body>

</html>
