<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 导出往返</title>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>导出往返</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>导出往返</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <div class="emap-example-field">
          <label for="format">导出格式</label>
          <select id="format">
            <option value="geojson">GeoJSON</option>
            <option value="topojson">TopoJSON</option>
            <option value="shapefile">Shapefile (.zip)</option>
          </select>
        </div>
        <button id="export-btn" class="emap-example-primary-button" disabled>导出并下载</button>
        <p id="status" class="emap-example-status">加载文件以开始</p>
      </section>
    </div>
  </details>

  <script type="module">
    import { installExampleMapUi } from '/src/example-runtime.ts';
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, NavigationControl, EditToolbar, DrawFeatureControl } = emap;

    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    installExampleMapUi(map, emap);

    const fileInput = document.getElementById('file-input');
    const formatSelect = document.getElementById('format');
    const exportBtn = document.getElementById('export-btn');
    const status = document.getElementById('status');

    const SOURCE_ID = 'export-source';
    let activeSource = null;
    let drawToolbar = null;

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      status.textContent = `处理 ${file.name} 中...`;
      exportBtn.disabled = true;

      const reader = new FileReader();
      reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);

        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        activeSource = source;
        // Canonical 0.2.0 recipe: await setData (resolves once the dataset
        // is ready), then addSource (order-independent) + setExtent.
        try {
          await source.setData({ filename: file.name, content });
          await map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          status.textContent = `已加载 ${file.name}。可绘制要素后再导出。`;
          exportBtn.disabled = false;

          if (drawToolbar) map.removeControl(drawToolbar);
          // 提供绘制控件,演示 "编辑后导出" 的流程
          drawToolbar = new EditToolbar({
            controls: [
              new DrawFeatureControl({ source: SOURCE_ID, type: 'polyline' }),
              new DrawFeatureControl({ source: SOURCE_ID, type: 'polygon' }),
            ],
          });
          map.addControl(drawToolbar, 'top-left');
        } catch (err) {
          console.error(err);
          status.textContent = '处理文件出错';
        }
      };
      reader.readAsArrayBuffer(file);
    });

    exportBtn.addEventListener('click', async () => {
      if (!activeSource) return;
      const format = formatSelect.value;
      status.textContent = `正在导出为 ${format}...`;
      exportBtn.disabled = true;

      try {
        const blob = await activeSource.export({ format });

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download =
          format === 'shapefile' ? 'export.zip'
            : format === 'topojson' ? 'export.topojson'
              : 'export.geojson';
        document.body.appendChild(a);
        a.click();
        a.remove();
        // 下载触发后释放 blob URL
        setTimeout(() => URL.revokeObjectURL(url), 1000);

        status.textContent = `已导出 ${blob.size} 字节,文件名: ${a.download}`;
      } catch (err) {
        console.error(err);
        status.textContent = `导出失败: ${err.message || err}`;
      } finally {
        exportBtn.disabled = false;
      }
    });
    await autoLoadExampleFixtures('export-roundtrip');
  </script>
</body>

</html>
