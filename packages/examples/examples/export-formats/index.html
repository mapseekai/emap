<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emap 示例 — 格式导出</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="emap-example-with-floating-header">
    <div id="header">
      <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
      <strong>格式导出</strong>
    </div>
    <div id="map" tabindex="0"></div>

    <details class="emap-example-workbench panel" open>
      <summary><h1>格式导出</h1></summary>
      <div class="emap-example-workbench-body">
        <section class="emap-example-section">
          <div class="emap-example-field">
            <label for="file-input">输入文件</label>
            <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip,.fgb,.parquet,.geoparquet,.arrow,.arrows,.feather" disabled />
          </div>
          <div class="emap-example-field">
            <label for="format">导出格式</label>
            <select id="format">
              <option value="geojson">GeoJSON (.geojson)</option>
              <option value="shapefile">Shapefile (.zip)</option>
              <option value="topojson">TopoJSON (.topojson)</option>
              <option value="flatgeobuf">FlatGeobuf (.fgb)</option>
              <option value="geoparquet">GeoParquet (.parquet)</option>
              <option value="geoarrow">GeoArrow IPC (.arrow)</option>
            </select>
          </div>
          <button id="export-btn" class="emap-example-primary-button" disabled>导出并下载</button>
          <p id="status" class="emap-example-status">正在初始化格式支持...</p>
        </section>
      </div>
    </details>

    <script type="module">
      import {
        autoLoadExampleFixtures,
        installExampleMapUi,
        loadExampleArrow,
        loadExampleRuntime,
      } from '/src/example-runtime.ts';
      import { installFlatGeobufFormat } from '/src/flatgeobuf-format.ts';

      const emap = await loadExampleRuntime();
      const emapArrow = await loadExampleArrow();
      await emapArrow.initParquetWasm();

      const { Emap, TopologySource } = emap;
      const SOURCE_ID = 'export-source';
      const extensions = {
        geojson: '.geojson',
        shapefile: '.zip',
        topojson: '.topojson',
        flatgeobuf: '.fgb',
        geoparquet: '.parquet',
        geoarrow: '.arrow',
      };
      const map = new Emap({ container: 'map' });
      const releaseFormat = installFlatGeobufFormat(emap, map.formats);
    window.addEventListener('pagehide', releaseFormat, { once: true });
    map.use(emapArrow.arrowFormatsPlugin);
    map.addControl(new emap.NavigationControl(), 'top-left');
      installExampleMapUi(map, emap);

      const fileInput = document.getElementById('file-input');
      const formatSelect = document.getElementById('format');
      const exportButton = document.getElementById('export-btn');
      const status = document.getElementById('status');
      let activeSource = null;

      fileInput.disabled = false;
      status.textContent = '上传数据后选择导出格式';

      fileInput.addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        exportButton.disabled = true;
        status.textContent = `处理 ${file.name} 中...`;
        const source = new TopologySource(SOURCE_ID, { formats: map.formats });

        try {
          if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
          await source.setData({ filename: file.name, content: new Uint8Array(await file.arrayBuffer()) });
          await map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          activeSource = source;
          exportButton.disabled = false;
          status.textContent = `当前: ${file.name}`;
        } catch (error) {
          console.error(error);
          status.textContent = `处理文件出错: ${error?.message ?? error}`;
        }
      });

      exportButton.addEventListener('click', async () => {
        if (!activeSource) return;

        const format = formatSelect.value;
        exportButton.disabled = true;
        status.textContent = `正在导出为 ${format}...`;

        try {
          const blob = await activeSource.export({ format });
          const filename = `export${extensions[format]}`;
          const url = URL.createObjectURL(blob);
          const download = document.createElement('a');
          download.href = url;
          download.download = filename;
          document.body.appendChild(download);
          download.click();
          download.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          status.textContent = `已导出 ${blob.size} 字节 → ${filename}`;
        } catch (error) {
          console.error(error);
          status.textContent = `导出失败: ${error?.message ?? error}`;
        } finally {
          exportButton.disabled = false;
        }
      });

      window.addEventListener('resize', () => map.resize());
      await autoLoadExampleFixtures('export-formats');
    </script>
  </body>
</html>
