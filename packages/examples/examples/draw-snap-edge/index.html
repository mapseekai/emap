<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 绘制时吸附顶点 + 边</title>
  <style>
    .snap-swatch { color: #ff4444; }
  </style>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>绘制时吸附顶点 + 边</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>绘制时吸附顶点 + 边</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <div class="emap-example-field">
          <label for="snap-threshold">吸附阈值 (px)</label>
          <input id="snap-threshold" type="number" value="12" />
        </div>
        <div class="emap-example-field">
          <label class="emap-example-check"><input id="snap-vertex" type="checkbox" checked /> 吸附顶点</label>
          <label class="emap-example-check"><input id="snap-edge" type="checkbox" checked /> 吸附边</label>
        </div>
        <button id="apply-snap" class="emap-example-primary-button">应用吸附设置</button>
        <p id="status" class="emap-example-status">加载数据后,工具栏选择"编辑节点 / 绘制折线 / 多边形",拖动鼠标观察吸附</p>
        <p class="emap-example-hint">
          <span class="snap-swatch">红色圆环</span> = 顶点吸附 ·
          <span class="snap-swatch">红色方框</span> = 边吸附(线段上的最近点)。
          绘制时控制光标吸附;编辑节点时控制拖动节点到其它要素的吸附。
        </p>
      </section>
    </div>
  </details>

  <script type="module">
    import { installExampleMapUi } from '/src/example-runtime.ts';
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, NavigationControl, HistoryControl, EditToolbar, DrawFeatureControl } = emap;

    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    installExampleMapUi(map, emap);
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    const SOURCE_ID = 'draw-snap-source';

    // Toolbar with both polyline and polygon draw — both consume the same
    // snap settings via re-creation when "应用吸附设置" is clicked.
    let toolbar = null;
    function buildDrawTools() {
      const threshold = Number(document.getElementById('snap-threshold').value) || 12;
      const snapToVertex = document.getElementById('snap-vertex').checked;
      const snapToEdge = document.getElementById('snap-edge').checked;
      map.vertexEdit.setOptions({ snapThreshold: threshold, snapToVertex, snapToEdge });

      // Tear down the previous toolbar (and via EditToolbar, its child
      // DrawFeatureControl instances). Skipping this leaves stale mouse
      // listeners alive that ignore the latest snap settings.
      if (toolbar) {
        try { map.removeControl(toolbar); } catch (_) {}
        toolbar = null;
      }

      const drawPoly = new DrawFeatureControl({
        source: SOURCE_ID, type: 'polygon',
        snapThreshold: threshold, snapToVertex, snapToEdge,
      });
      const drawLine = new DrawFeatureControl({
        source: SOURCE_ID, type: 'polyline',
        snapThreshold: threshold, snapToVertex, snapToEdge,
      });
      toolbar = new EditToolbar({ controls: [drawPoly, drawLine] });
      map.addControl(toolbar, 'top-right');
    }
    buildDrawTools();

    document.getElementById('apply-snap').addEventListener('click', buildDrawTools);

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const status = document.getElementById('status');
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        // Load initial data before registration: await setData, then addSource and setExtent.
        try {
          await source.setData({ filename: file.name, content });
          await map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          status.textContent = `已加载 ${file.name}。选工具开始绘制,光标靠近已有顶点 / 边时会吸附。`;

          const lyrs = source.getLayers?.() ?? [];
        lyrs.forEach((lyr, i) => {
          const id = `${lyr?.name || `layer-${i}`}-default`;
          if (map.getLayer(id)) return;
          if (lyr?.geometry_type === 'polygon' || lyr?.geometry_type === 'polyline') {
            map.addLayer({ id, type: 'line', source: SOURCE_ID, 'source-layer': lyr.name, paint: { 'line-color': '#888', 'line-width': 1 } });
          } else if (lyr?.geometry_type === 'point') {
            map.addLayer({ id, type: 'circle', source: SOURCE_ID, 'source-layer': lyr.name, paint: { 'circle-color': '#888', 'circle-radius': 3 } });
          }
          });
        } catch (err) {
          console.error(err);
          status.textContent = "处理文件出错";
        }
      };
      reader.readAsArrayBuffer(file);
    });
    await autoLoadExampleFixtures('draw-snap-edge');
  </script>
</body>

</html>
