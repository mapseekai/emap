<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 融合 (Dissolve)</title>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>融合 (Dissolve)</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>融合 (Dissolve)</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <div class="emap-example-field">
          <label for="target">目标图层</label>
          <select id="target"></select>
        </div>
        <div class="emap-example-field">
          <label for="field">字段 (可选)</label>
          <select id="field"><option value="">— 整层合并 —</option></select>
        </div>
        <button id="dissolve-btn" class="emap-example-primary-button" disabled>融合</button>
        <p id="status" class="emap-example-status">加载多边形数据</p>
      </section>
    </div>
  </details>

  <script type="module">
import { getExampleRenderer } from '/src/renderer-choice.ts';


import { installExampleMapUi } from '/src/example-runtime.ts';
import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
const map = await Emap.create({ renderer: getExampleRenderer(), container: 'map' });
await map.addControl(new NavigationControl(), 'top-left');
await installExampleMapUi(map, emap);
await map.addControl(new HistoryControl(), 'top-left');
map.bindHistoryShortcuts();
const SOURCE_ID = 'dissolve-source';
const fileInput = document.getElementById('file-input');
const targetSel = document.getElementById('target');
const fieldSel = document.getElementById('field');
const dissolveBtn = document.getElementById('dissolve-btn');
const status = document.getElementById('status');
function populate(source) {
    targetSel.innerHTML = '';
    const layers = source.getLayers();
    layers.forEach((lyr, i) => {
        const name = lyr?.name || lyr?.id || `layer-${i}`;
        const opt = new Option(`${name} (${lyr?.geometry_type ?? '?'})`, name);
        targetSel.appendChild(opt);
    });
    refreshFieldOptions(source);
    dissolveBtn.disabled = layers.length === 0;
}
function refreshFieldOptions(source) {
    fieldSel.innerHTML = '<option value="">— 整层合并 —</option>';
    const target = targetSel.value;
    if (!target)
        return;
    const layers = source.getLayers();
    const layer = layers.find((l, i) => (l?.name || l?.id || `layer-${i}`) === target);
    const records = layer?.data?.getRecords?.();
    if (!records?.length)
        return;
    const sample = records[0];
    Object.keys(sample || {}).forEach((field) => {
        fieldSel.appendChild(new Option(field, field));
    });
}
targetSel.addEventListener('change', () => {
    const src = map.getSource(SOURCE_ID);
    if (src)
        refreshFieldOptions(src);
});
fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file)
        return;
    status.textContent = `正在加载 ${file.name}...`;
    const reader = new FileReader();
    reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID))
            map.removeSource(SOURCE_ID);
        // Load initial data before registration: await setData, then addSource and setExtent.
        try {
            await source.setData({ filename: file.name, content });
            await map.addSource(SOURCE_ID, source);
            map.setExtent(source.getExtent());
            populate(source);
            status.textContent = `已加载 ${file.name}。选择目标图层与字段后点击 "融合"。`;
        }
        catch (err) {
            console.error(err);
        }
    };
    reader.readAsArrayBuffer(file);
});
dissolveBtn.addEventListener('click', async () => {
    const target = targetSel.value;
    if (!target)
        return;
    const field = fieldSel.value || undefined;
    status.textContent = field ? `正在按 ${field} 融合 ${target}...` : `正在整层融合 ${target}...`;
    dissolveBtn.disabled = true;
    try {
        const result = await map.ops.dissolveLayer({ source: SOURCE_ID, target, field });
        status.textContent = result.ok
            ? `已完成 ${target}${field ? ` 按 ${field}` : ''} 的融合,Ctrl+Z 撤销。`
            : '融合失败 (请检查图层名称)。';
        const src = map.getSource(SOURCE_ID);
        if (src)
            populate(src);
    }
    catch (err) {
        status.textContent = `错误: ${err?.message ?? err}`;
        console.error(err);
    }
    finally {
        dissolveBtn.disabled = false;
    }
});
await autoLoadExampleFixtures('dissolve');
</script>
</body>

</html>
