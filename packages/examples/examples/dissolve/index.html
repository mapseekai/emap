<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 融合 (Dissolve)</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: sans-serif;
    }

    #header {
      padding: 10px;
      background: #2c3e50;
      color: white;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 13px;
    }

    #header select,
    #header input[type=file] {
      padding: 3px 6px;
      font-size: 13px;
    }

    #header button {
      padding: 5px 12px;
      background: #16a085;
      color: white;
      border: 0;
      border-radius: 3px;
      cursor: pointer;
      font-size: 13px;
    }

    #header button:disabled {
      background: #7f8c8d;
      cursor: not-allowed;
    }

    #map {
      flex: 1;
      background: #ffffff;
      position: relative;
      outline: none;
    }
  </style>
</head>

<body>
  <div id="header">
    <label>
      文件:
      <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
    </label>
    <label>目标图层: <select id="target"></select></label>
    <label>字段 (可选): <select id="field"><option value="">— 整层合并 —</option></select></label>
    <button id="dissolve-btn" disabled>融合</button>
    <span id="status">加载多边形数据</span>
  </div>
  <div id="map" tabindex="0"></div>

  <script type="module">
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;

    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    const SOURCE_ID = 'dissolve-source';

    const fileInput = document.getElementById('file-input');
    const targetSel = document.getElementById('target');
    const fieldSel = document.getElementById('field');
    const dissolveBtn = document.getElementById('dissolve-btn');
    const status = document.getElementById('status');

    function populate(source) {
      targetSel.innerHTML = '';
      const layers = source.getLayers();
      layers.forEach((lyr, i) => {
        const name = lyr?.name || lyr?.id || `layer-${i}`;
        const opt = new Option(`${name} (${lyr?.geometry_type ?? '?'})`, name);
        targetSel.appendChild(opt);
      });
      refreshFieldOptions(source);
      dissolveBtn.disabled = layers.length === 0;
    }

    function refreshFieldOptions(source) {
      fieldSel.innerHTML = '<option value="">— 整层合并 —</option>';
      const target = targetSel.value;
      if (!target) return;
      const layers = source.getLayers();
      const layer = layers.find((l, i) => (l?.name || l?.id || `layer-${i}`) === target);
      const records = layer?.data?.getRecords?.();
      if (!records?.length) return;
      const sample = records[0];
      Object.keys(sample || {}).forEach((field) => {
        fieldSel.appendChild(new Option(field, field));
      });
    }

    targetSel.addEventListener('change', () => {
      const src = map.getSource(SOURCE_ID);
      if (src) refreshFieldOptions(src);
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        // Canonical 0.2.0 recipe: await setData (resolves once the dataset
        // is ready), then addSource (order-independent) + setExtent.
        try {
          await source.setData({ filename: file.name, content });
          map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          populate(source);
          status.textContent = `已加载 ${file.name}。选择目标图层与字段后点击 "融合"。`;
        } catch (err) {
          console.error(err);
        }
      };
      reader.readAsArrayBuffer(file);
    });

    dissolveBtn.addEventListener('click', async () => {
      const target = targetSel.value;
      if (!target) return;
      const field = fieldSel.value || undefined;
      status.textContent = field ? `正在按 ${field} 融合 ${target}...` : `正在整层融合 ${target}...`;
      dissolveBtn.disabled = true;
      try {
        const ok = await map.ops.dissolveLayer({ source: SOURCE_ID, target, field });
        status.textContent = ok
          ? `已完成 ${target}${field ? ` 按 ${field}` : ''} 的融合,Ctrl+Z 撤销。`
          : '融合失败 (请检查图层名称)。';
        const src = map.getSource(SOURCE_ID);
        if (src) populate(src);
      } catch (err) {
        status.textContent = `错误: ${err?.message ?? err}`;
        console.error(err);
      } finally {
        dissolveBtn.disabled = false;
      }
    });
    await autoLoadExampleFixtures('dissolve');
  </script>
</body>

</html>
