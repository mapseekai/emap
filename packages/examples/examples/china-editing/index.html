<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 中国行政区划编辑</title>
  <style>
    #event-log {
      position: absolute;
      bottom: 50px;
      right: 10px;
      width: 360px;
      max-height: 200px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.75);
      padding: 8px 10px;
      font-size: 12px;
      color: #7cfc00;
      /* 高于 emap 控件容器的 z-index (10) */
      z-index: 100;
      pointer-events: auto;
    }

    #event-log .log-entry {
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
    }

    #event-log .log-title {
      color: #aaa;
      margin-bottom: 6px;
    }

    #loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      z-index: 200;
      transition: opacity 0.3s;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--emap-example-border-strong);
      border-top-color: var(--emap-example-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>中国行政区划编辑</strong>
  </div>
  <div id="map" tabindex="0">
    <div id="loading-overlay" class="hidden">
      <div class="spinner"></div>
      <span id="loading-text">加载中...</span>
    </div>
    <div id="event-log">
      <div class="log-title">vertex_moved 事件日志:</div>
    </div>
  </div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>中国行政区划编辑</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <p id="status" class="emap-example-status">正在加载本地示例数据...</p>
      </section>
    </div>
  </details>

  <script type="module">
    import { installExampleMapUi } from '/src/example-runtime.ts';
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, EditToolbar } = emap;

    const map = new Emap({ container: "map" });

    map.addControl(new emap.NavigationControl(), "top-left");
    installExampleMapUi(map, emap);
    map.addControl(new EditToolbar(), "top-left");

    // vertex_moved 事件日志
    const logEl = document.getElementById("event-log");
    map.on("vertex_moved", (e) => {
      const entry = document.createElement("div");
      entry.className = "log-entry";
      const coords = e.coords
        ? `[${e.coords[0].toFixed(6)}, ${e.coords[1].toFixed(6)}]`
        : "?";
      const moved = Array.isArray(e.vertexIds) ? e.vertexIds.join(",") : "?";
      entry.textContent = `id=${e.id} vtx=[${moved}] → ${coords}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    });

    const status = document.getElementById("status");
    const overlay = document.getElementById("loading-overlay");
    const loadingText = document.getElementById("loading-text");
    const fileInput = document.getElementById("file-input");
    let currentSourceId = null;

    function showLoading(msg) {
      loadingText.textContent = msg;
      overlay.classList.remove("hidden");
    }
    function hideLoading() {
      overlay.classList.add("hidden");
    }
    async function loadExampleData(file) {
      const sourceId = "china-editing-source";
      fileInput.disabled = true;
      showLoading(`正在加载 ${file.name}...`);

      try {
        if (currentSourceId) {
          try { map.removeSource(currentSourceId); } catch (_) { }
        }

        const source = new TopologySource(sourceId);
        const content = new Uint8Array(await file.arrayBuffer());
        await source.setData({ filename: file.name, content });
        await map.addSource(sourceId, source);
        map.setExtent(source.getExtent());
        currentSourceId = sourceId;
        status.textContent = `${file.name} 已加载 — 点击 ✏ 编辑顶点`;
      } catch (err) {
        console.error(err);
        status.textContent = `错误: ${err.message}`;
      } finally {
        hideLoading();
        fileInput.disabled = false;
      }
    }

    fileInput.addEventListener("change", () => {
      const file = fileInput.files?.[0];
      if (file) void loadExampleData(file);
    });

    window.addEventListener("resize", () => map.resize());
    await autoLoadExampleFixtures('china-editing');
  </script>
</body>

</html>
