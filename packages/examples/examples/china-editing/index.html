<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 中国行政区划编辑</title>
  <style>
    * {
      margin: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: -apple-system, "Microsoft YaHei", sans-serif;
      background: #1a1a2e;
      color: #eee;
    }

    #header {
      padding: 10px 16px;
      background: #16213e;
      display: flex;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #0f3460;
      flex-wrap: wrap;
    }

    #header strong {
      color: #e94560;
    }

    #map {
      flex: 1;
      background: #ffffff;
      position: relative;
    }

    .source-list {
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .source-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .source-item .url {
      color: #6db3f2;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
    }

    .load-btn {
      padding: 3px 10px;
      border: 1px solid #0f3460;
      border-radius: 4px;
      background: #16213e;
      color: #eee;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .load-btn:hover {
      background: #0f3460;
    }

    .load-btn.active {
      background: #e94560;
      border-color: #e94560;
    }

    .load-btn:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    #event-log {
      position: absolute;
      bottom: 50px;
      right: 10px;
      width: 360px;
      max-height: 200px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      font-family: monospace;
      color: #7cfc00;
      /* 高于 emap 控件容器的 z-index (10) */
      z-index: 100;
      pointer-events: auto;
    }

    #event-log .log-entry {
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
    }

    .info {
      margin-left: auto;
      font-size: 0.85em;
      color: #aaa;
    }

    #loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(26, 26, 46, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      z-index: 200;
      transition: opacity 0.3s;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #0f3460;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="Open the Emap examples catalog"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap</span></a>
    <label>文件: <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" /></label>
    <div class="info" id="status">正在加载本地示例数据...</div>
  </div>
  <div id="map">
    <div id="loading-overlay" class="hidden">
      <div class="spinner"></div>
      <span id="loading-text">加载中...</span>
    </div>
    <div id="event-log">
      <div style="color:#aaa; margin-bottom:6px;">vertex_moved 事件日志:</div>
    </div>
  </div>

  <script type="module">
    import { installExampleMapUi } from '/src/example-runtime.ts';
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, EditToolbar } = emap;

    const map = new Emap({ container: "map" });

    map.addControl(new emap.NavigationControl(), "top-left");
    installExampleMapUi(map, emap);
    map.addControl(new EditToolbar(), "top-left");

    // vertex_moved 事件日志
    const logEl = document.getElementById("event-log");
    map.on("vertex_moved", (e) => {
      const entry = document.createElement("div");
      entry.className = "log-entry";
      const coords = e.coords
        ? `[${e.coords[0].toFixed(6)}, ${e.coords[1].toFixed(6)}]`
        : "?";
      const moved = Array.isArray(e.vertexIds) ? e.vertexIds.join(",") : "?";
      entry.textContent = `id=${e.id} vtx=[${moved}] → ${coords}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    });

    const status = document.getElementById("status");
    const overlay = document.getElementById("loading-overlay");
    const loadingText = document.getElementById("loading-text");
    const fileInput = document.getElementById("file-input");
    let currentSourceId = null;

    function showLoading(msg) {
      loadingText.textContent = msg;
      overlay.classList.remove("hidden");
    }
    function hideLoading() {
      overlay.classList.add("hidden");
    }
    async function loadExampleData(file) {
      const sourceId = "china-editing-source";
      fileInput.disabled = true;
      showLoading(`正在加载 ${file.name}...`);

      try {
        if (currentSourceId) {
          try { map.removeSource(currentSourceId); } catch (_) { }
        }

        const source = new TopologySource(sourceId);
        const content = new Uint8Array(await file.arrayBuffer());
        await source.setData({ filename: file.name, content });
        map.addSource(sourceId, source);
        map.setExtent(source.getExtent());
        currentSourceId = sourceId;
        status.textContent = `${file.name} 已加载 — 点击 ✏ 编辑顶点`;
      } catch (err) {
        console.error(err);
        status.textContent = `错误: ${err.message}`;
      } finally {
        hideLoading();
        fileInput.disabled = false;
      }
    }

    fileInput.addEventListener("change", () => {
      const file = fileInput.files?.[0];
      if (file) void loadExampleData(file);
    });

    window.addEventListener("resize", () => map.resize());
    await autoLoadExampleFixtures('china-editing');
  </script>
</body>

</html>
