<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 中国行政区划编辑</title>
  <style>
    #event-log {
      position: absolute;
      bottom: 50px;
      right: 10px;
      width: 360px;
      max-height: 200px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.75);
      padding: 8px 10px;
      font-size: 12px;
      color: #7cfc00;
      /* 高于 emap 控件容器的 z-index (10) */
      z-index: 100;
      pointer-events: auto;
    }

    #event-log .log-entry {
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
    }

    #event-log .log-title {
      color: #aaa;
      margin-bottom: 6px;
    }

    #loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      z-index: 200;
      transition: opacity 0.3s;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--emap-example-border-strong);
      border-top-color: var(--emap-example-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>中国行政区划编辑</strong>
  </div>
  <div id="map" tabindex="0">
    <div id="loading-overlay" class="hidden">
      <div class="spinner"></div>
      <span id="loading-text">加载中...</span>
    </div>
    <div id="event-log">
      <div class="log-title">vertex_moved 事件日志:</div>
    </div>
  </div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>中国行政区划编辑</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="online-source">在线数据</label>
          <select id="online-source">
            <option value="topojson">TopoJSON（默认）</option>
            <option value="geojson">GeoJSON</option>
          </select>
        </div>
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <p id="status" class="emap-example-status">正在加载在线 TopoJSON...</p>
      </section>
    </div>
  </details>

  <script type="module">
    import { installExampleMapUi, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, EditToolbar } = emap;

    const map = new Emap({ container: "map" });

    map.addControl(new emap.NavigationControl(), "top-left");
    installExampleMapUi(map, emap);
    map.addControl(new EditToolbar(), "top-left");

    // vertex_moved 事件日志
    const logEl = document.getElementById("event-log");
    map.on("vertex_moved", (e) => {
      const entry = document.createElement("div");
      entry.className = "log-entry";
      const coords = e.coords
        ? `[${e.coords[0].toFixed(6)}, ${e.coords[1].toFixed(6)}]`
        : "?";
      const moved = Array.isArray(e.vertexIds) ? e.vertexIds.join(",") : "?";
      entry.textContent = `id=${e.id} vtx=[${moved}] → ${coords}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    });

    const ONLINE_DATASETS = {
      topojson: {
        label: "TopoJSON",
        url: "https://geojson.cn/api/china/1.6.3/china.topo.json",
        filename: "china.topo.json",
      },
      geojson: {
        label: "GeoJSON",
        url: "https://geojson.cn/api/china/1.6.3/china.json",
        filename: "china.json",
      },
    };
    const SOURCE_ID = "china-editing-source";
    const status = document.getElementById("status");
    const overlay = document.getElementById("loading-overlay");
    const loadingText = document.getElementById("loading-text");
    const onlineSource = document.getElementById("online-source");
    const fileInput = document.getElementById("file-input");
    let currentSourceId = null;
    let currentOnlineKind = null;

    async function loadExampleData({ label, filename, read, onlineKind = null }) {
      onlineSource.disabled = true;
      fileInput.disabled = true;
      loadingText.textContent = `正在加载 ${label}...`;
      overlay.classList.remove("hidden");

      try {
        const content = await read();
        const source = new TopologySource(SOURCE_ID);
        await source.setData({ filename, content });

        if (currentSourceId) map.removeSource(currentSourceId);
        await map.addSource(SOURCE_ID, source);
        map.setExtent(source.getExtent());
        currentSourceId = SOURCE_ID;
        currentOnlineKind = onlineKind;

        const size = `${(content.byteLength / 1024).toFixed(1)} KB`;
        status.textContent = `${label}（${size}）已加载 — 点击 ✏ 编辑顶点`;
      } catch (error) {
        console.error(error);
        if (currentOnlineKind) onlineSource.value = currentOnlineKind;
        status.textContent = `错误: ${error instanceof Error ? error.message : String(error)}`;
      } finally {
        overlay.classList.add("hidden");
        onlineSource.disabled = false;
        fileInput.disabled = false;
      }
    }

    async function loadOnlineData(kind) {
      const dataset = ONLINE_DATASETS[kind];
      if (!dataset) throw new Error(`未知在线数据格式: ${kind}`);

      await loadExampleData({
        label: `在线 ${dataset.label}`,
        filename: dataset.filename,
        onlineKind: kind,
        read: async () => {
          const response = await fetch(dataset.url);
          if (!response.ok) {
            throw new Error(`${dataset.label} 请求失败: ${response.status}`);
          }
          return new Uint8Array(await response.arrayBuffer());
        },
      });
    }

    onlineSource.addEventListener("change", () => {
      void loadOnlineData(onlineSource.value);
    });
    fileInput.addEventListener("change", () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      void loadExampleData({
        label: file.name,
        filename: file.name,
        read: async () => new Uint8Array(await file.arrayBuffer()),
      });
    });

    window.addEventListener("resize", () => map.resize());
    await loadOnlineData(onlineSource.value);
  </script>
</body>

</html>
