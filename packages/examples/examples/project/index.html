<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 投影变换 (Project)</title>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>投影变换 (Project)</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>投影变换 (Project)</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <div class="emap-example-field">
          <label for="scope">导出图层</label>
          <select id="scope">
          </select>
        </div>
        <div class="emap-example-field">
          <label for="crs-preset">目标 CRS</label>
          <select id="crs-preset">
            <option value="">— 选预设或在右侧输入 —</option>
            <option value="EPSG:3857">EPSG:3857 (Web Mercator)</option>
            <option value="EPSG:4326">EPSG:4326 (WGS84 经纬度)</option>
            <option value="webmercator">webmercator</option>
            <option value="wgs84">wgs84</option>
            <option value="robinson">robinson</option>
            <option value="natearth">natearth (Natural Earth)</option>
            <option value="wintri">wintri (Winkel Tripel)</option>
            <option value="albersusa">albersusa</option>
          </select>
        </div>
        <div class="emap-example-field">
          <label for="crs-text">自定义 CRS</label>
          <input id="crs-text" type="text" placeholder="自定义,例如 EPSG:32633 或 +proj=utm +zone=33" />
        </div>
        <div class="emap-example-field">
          <label for="init">源 CRS (init=,可选)</label>
          <input id="init" type="text" placeholder="例如 EPSG:4326" />
        </div>
        <div class="emap-example-field">
          <label class="emap-example-check"><input id="densify" type="checkbox" /> densify</label>
        </div>
        <div class="emap-example-field">
          <label for="filename">输出文件</label>
          <input id="filename" type="text" placeholder="默认: 图层名.geojson" />
        </div>
        <button id="btn" class="emap-example-primary-button" disabled>投影并下载</button>
        <p id="status" class="emap-example-status">加载一个数据文件；选择图层和目标 CRS 后导出</p>
        <p class="emap-example-hint">
          <code>projectLayer</code> 在隔离副本上运行 mapshaper <code>-proj</code> 并下载 GeoJSON；
          当前地图、数据源、CRS 和视图不会改变。整图坐标系切换请使用 <code>map.reproject()</code>。
        </p>
      </section>
    </div>
  </details>

  <script type="module">
import { getExampleRenderer } from '/src/renderer-choice.ts';


import { installExampleMapUi } from '/src/example-runtime.ts';
import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
const map = await Emap.create({ renderer: getExampleRenderer(), container: 'map' });
await map.addControl(new NavigationControl(), 'top-left');
await installExampleMapUi(map, emap);
await map.addControl(new HistoryControl(), 'top-left');
map.bindHistoryShortcuts();
const SOURCE_ID = 'project-source';
const scopeSel = document.getElementById('scope');
const crsPreset = document.getElementById('crs-preset');
const crsText = document.getElementById('crs-text');
const initInput = document.getElementById('init');
const densifyInput = document.getElementById('densify');
const filenameInput = document.getElementById('filename');
const btn = document.getElementById('btn');
const status = document.getElementById('status');
function populate(source) {
    scopeSel.innerHTML = '';
    source.getLayers().forEach((lyr, i) => {
        const name = lyr?.name || lyr?.id || `layer-${i}`;
        scopeSel.appendChild(new Option(`${name} (${lyr?.geometry_type ?? '?'})`, name));
    });
    btn.disabled = source.getLayers().length === 0;
}
crsPreset.addEventListener('change', () => {
    if (crsPreset.value)
        crsText.value = crsPreset.value;
});
document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file)
        return;
    status.textContent = `正在加载 ${file.name}...`;
    const reader = new FileReader();
    reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID))
            map.removeSource(SOURCE_ID);
        // Load initial data before registration: await setData, then addSource and setExtent.
        try {
            await source.setData({ filename: file.name, content });
            await map.addSource(SOURCE_ID, source);
            map.setExtent(source.getExtent());
            populate(source);
            status.textContent = `已加载 ${file.name}。`;
        }
        catch (err) {
            console.error(err);
            status.textContent = `错误: ${err?.message ?? err}`;
        }
    };
    reader.readAsArrayBuffer(file);
});
btn.addEventListener('click', async () => {
    const crs = (crsText.value || crsPreset.value).trim();
    if (!crs) {
        status.textContent = '请选择或输入目标 CRS。';
        return;
    }
    const opts = {
        source: SOURCE_ID,
        target: scopeSel.value,
        crs,
        output: { format: 'geojson' },
    };
    const init = initInput.value.trim();
    if (init)
        opts.init = init;
    if (densifyInput.checked)
        opts.densify = true;
    const filename = filenameInput.value.trim();
    if (filename)
        opts.output.filename = filename;
    const label = scopeSel.value;
    status.textContent = `正在投影并导出 ${label} → ${crs}...`;
    btn.disabled = true;
    try {
        const result = await map.ops.projectLayer(opts);
        if (result.ok) {
            const url = URL.createObjectURL(result.value.blob);
            const download = document.createElement('a');
            download.href = url;
            download.download = result.value.filename;
            download.hidden = true;
            document.body.append(download);
            download.click();
            download.remove();
            setTimeout(() => URL.revokeObjectURL(url), 0);
            status.textContent = `已导出 ${result.value.filename}；当前地图未改变。`;
        }
        else {
            status.textContent = `投影失败: ${result.error?.reason ?? result.error?.message ?? '未知错误'}`;
        }
    }
    catch (err) {
        status.textContent = `错误: ${err?.message ?? err}`;
        console.error(err);
    }
    finally {
        btn.disabled = false;
    }
});
await autoLoadExampleFixtures('project');
</script>
</body>

</html>
