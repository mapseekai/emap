<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 几何检查 (Check Geometry)</title>
  <style>
    #report {
      margin: 12px 0 0;
      padding: 8px 10px;
      border: 1px solid var(--emap-example-border);
      background: var(--emap-example-muted);
      font-size: 11px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .ok { color: var(--emap-example-primary); }
    .bad { color: var(--emap-example-error); }
  </style>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>几何检查 (Check Geometry)</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>几何检查 (Check Geometry)</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <div class="emap-example-field">
          <label for="tolerance">tolerance (可选)</label>
          <input id="tolerance" type="text" placeholder="自动" />
        </div>
        <button id="check-btn" class="emap-example-primary-button" disabled>检查几何</button>
        <div class="emap-example-row">
          <button id="rebuild-btn" class="alt" disabled>重建拓扑</button>
        </div>
        <p id="report">尚未检查</p>
        <p id="status" class="emap-example-status">加载数据后点击检查;有交点时可一键重建拓扑</p>
        <p class="emap-example-hint">
          <code>checkGeometry</code> 是只读的 —— 不修改数据,不入历史。检测到自交后通常下一步是 <code>rebuildTopology</code> 或 <code>cleanLayer</code>。
        </p>
      </section>
    </div>
  </details>

  <script type="module">
    import { installExampleMapUi } from '/src/example-runtime.ts';
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    installExampleMapUi(map, emap);
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    const SOURCE_ID = 'check-geom-source';
    const tolInput = document.getElementById('tolerance');
    const checkBtn = document.getElementById('check-btn');
    const rebuildBtn = document.getElementById('rebuild-btn');
    const report = document.getElementById('report');
    const status = document.getElementById('status');

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        // Canonical 0.2.0 recipe: await setData (resolves once the dataset
        // is ready), then addSource (order-independent) + setExtent.
        try {
          await source.setData({ filename: file.name, content });
          await map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          checkBtn.disabled = false;
          rebuildBtn.disabled = false;
          status.textContent = `已加载 ${file.name}。点击检查几何。`;
        } catch (err) {
          console.error(err);
        }
      };
      reader.readAsArrayBuffer(file);
    });

    checkBtn.addEventListener('click', async () => {
      const opts = { source: SOURCE_ID };
      const tol = tolInput.value.trim();
      if (tol && !Number.isNaN(Number(tol))) opts.tolerance = Number(tol);
      status.textContent = '检查中...';
      checkBtn.disabled = true;
      try {
        const r = await map.ops.checkGeometry(opts);
        if (!r) {
          report.innerHTML = '<span class="bad">无法检查 (检查源/图层)</span>';
          status.textContent = '检查失败。';
        } else if (r.ok) {
          report.innerHTML = '<span class="ok">✓ 拓扑干净 — 0 个相交</span>';
          status.textContent = '检查完成,数据无问题。';
        } else {
          const sample = r.intersections.slice(0, 5)
            .map((p) => `(${p.x.toFixed(3)}, ${p.y.toFixed(3)})`).join(', ');
          report.innerHTML = `<span class="bad">✗ 发现 ${r.intersectionCount} 个相交</span> — 前 5 个: ${sample}${r.intersectionCount > 5 ? '...' : ''}`;
          status.textContent = '检查到自相交 —— 点击 "重建拓扑" 修复。';
        }
      } catch (err) {
        status.textContent = `错误: ${err?.message ?? err}`;
        console.error(err);
      } finally {
        checkBtn.disabled = false;
      }
    });

    rebuildBtn.addEventListener('click', async () => {
      status.textContent = '正在重建拓扑...';
      rebuildBtn.disabled = true;
      try {
        const ok = await map.ops.rebuildTopology({ source: SOURCE_ID });
        status.textContent = ok ? '已重建。再次检查几何确认结果。' : '重建失败。';
      } catch (err) {
        status.textContent = `错误: ${err?.message ?? err}`;
        console.error(err);
      } finally {
        rebuildBtn.disabled = false;
      }
    });
    await autoLoadExampleFixtures('check-geometry');
  </script>
</body>

</html>
