<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 缓冲区</title>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>缓冲区</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>缓冲区</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <div class="emap-example-field">
          <label for="target">目标图层</label>
          <select id="target"></select>
        </div>
        <div class="emap-example-field">
          <label for="radius">半径</label>
          <input id="radius" type="text" value="1000" placeholder="数字或表达式"/>
        </div>
        <div class="emap-example-field">
          <label for="cap">端点样式</label>
          <select id="cap">
            <option value="">圆形 (默认)</option>
            <option value="round">圆形</option>
            <option value="flat">平直</option>
          </select>
        </div>
        <div class="emap-example-field">
          <label for="vertices">vertices</label>
          <input id="vertices" type="number" min="3" step="1" placeholder="72"/>
        </div>
        <div class="emap-example-field">
          <label for="arc-quality">arc-quality</label>
          <input id="arc-quality" type="number" min="1" step="1" placeholder=""/>
        </div>
        <div class="emap-example-field">
          <label for="type">type</label>
          <select id="type">
            <option value="">全 (默认)</option>
            <option value="left">left</option>
            <option value="right">right</option>
            <option value="outer">outer</option>
            <option value="inner">inner</option>
          </select>
        </div>
        <div class="emap-example-field">
          <label class="emap-example-check"><input id="planar" type="checkbox"/> planar</label>
          <label class="emap-example-check"><input id="v2" type="checkbox"/> v2</label>
        </div>
        <button id="buffer-btn" class="emap-example-primary-button" disabled>生成缓冲区</button>
        <p id="status" class="emap-example-status">加载数据</p>
        <p class="emap-example-hint">
          单位: 点 buffer 半径 = <strong>米</strong>（勾选 planar 则改为源 CRS 单位）；线/面 buffer 半径 = 源 CRS 单位（lat/lng 数据为<strong>度</strong>）。
          参考: 国境尺度点 buffer 建议 <code>50000</code>（50 km）起；lat/lng 线/面建议 <code>0.05</code>~<code>1</code>；投影到米后线/面再用米值。
        </p>
      </section>
    </div>
  </details>

  <script type="module">
    import { installExampleMapUi } from '/src/example-runtime.ts';
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;

    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    installExampleMapUi(map, emap);
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    const SOURCE_ID = 'buf-source';
    const fileInput = document.getElementById('file-input');
    const targetSel = document.getElementById('target');
    const radiusInput = document.getElementById('radius');
    const capSel = document.getElementById('cap');
    const bufBtn = document.getElementById('buffer-btn');
    const status = document.getElementById('status');

    function populate(source) {
      targetSel.innerHTML = '';
      source.getLayers().forEach((lyr, i) => {
        const name = lyr?.name || lyr?.id || `layer-${i}`;
        targetSel.appendChild(new Option(`${name} (${lyr?.geometry_type ?? '?'})`, name));
      });
      bufBtn.disabled = source.getLayers().length === 0;
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        // Load initial data before registration: await setData, then addSource and setExtent.
        try {
          await source.setData({ filename: file.name, content });
          await map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          populate(source);
          status.textContent = `已加载 ${file.name}。选择目标图层与半径,再点击 "生成缓冲区"。`;
        } catch (err) {
          console.error(err);
        }
      };
      reader.readAsArrayBuffer(file);
    });

    function readNumber(id) {
      const raw = document.getElementById(id).value.trim();
      if (!raw) return undefined;
      const n = Number(raw);
      return Number.isFinite(n) ? n : undefined;
    }

    bufBtn.addEventListener('click', async () => {
      const target = targetSel.value;
      if (!target) return;
      const raw = radiusInput.value.trim();
      if (!raw) return;
      const radius = /^-?\d+(\.\d+)?$/.test(raw) ? Number(raw) : raw;
      const opts = { source: SOURCE_ID, target, radius };
      if (capSel.value) opts.capStyle = capSel.value;
      const vertices = readNumber('vertices');
      if (vertices !== undefined) opts.vertices = vertices;
      const arcQuality = readNumber('arc-quality');
      if (arcQuality !== undefined) opts.arcQuality = arcQuality;
      const typeVal = document.getElementById('type').value;
      if (typeVal) opts.type = typeVal;
      if (document.getElementById('planar').checked) opts.planar = true;
      if (document.getElementById('v2').checked) opts.v2 = true;
      status.textContent = `正在对 ${target} 生成半径 ${raw} 的缓冲区...`;
      bufBtn.disabled = true;
      try {
        const result = await map.ops.bufferLayer(opts);
        console.log('bufferLayer result:', result);
        if (result.ok) {
          status.textContent = `已生成 ${target} 的缓冲区,Ctrl+Z 撤销。`;
        } else {
          const e = result.error;
          status.textContent = `生成失败: ${e.kind}${e.field ? ' field=' + e.field : ''}${e.reason ? ' (' + e.reason + ')' : ''}${e.cause ? ' cause=' + (e.cause.message || e.cause) : ''}`;
          console.error('bufferLayer error:', e);
        }
        const src = map.getSource(SOURCE_ID);
        if (src) populate(src);
      } catch (err) {
        status.textContent = `错误: ${err?.message ?? err}`;
        console.error(err);
      } finally {
        bufBtn.disabled = false;
      }
    });
    await autoLoadExampleFixtures('buffer');
  </script>
</body>

</html>
