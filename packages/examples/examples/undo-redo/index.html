<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 撤销 / 重做</title>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>撤销 / 重做</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>撤销 / 重做</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <p id="status" class="emap-example-status">加载文件以开始</p>
        <p id="last-action" class="emap-example-hint"></p>
        <p class="emap-example-hint">左侧叠放顶点编辑 / 绘制工具。Ctrl/Cmd+Z 撤销,Ctrl+Shift+Z (或 Ctrl+Y) 重做。</p>
      </section>
    </div>
  </details>

  <script type="module">
import { getExampleRenderer } from '/src/renderer-choice.ts';


import { installExampleMapUi } from '/src/example-runtime.ts';
import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const { Emap, TopologySource, NavigationControl, HistoryControl, EditToolbar, VertexEditControl, DrawFeatureControl, } = emap;
const map = await Emap.create({ renderer: getExampleRenderer(), container: 'map' });
await map.addControl(new NavigationControl(), 'top-left');
await installExampleMapUi(map, emap);
await map.addControl(new HistoryControl(), 'top-left');
// 在地图容器上绑定快捷键,无需先点击按钮就能 Ctrl+Z
map.bindHistoryShortcuts();
document.getElementById('map').focus();
map.on('historychange', (e) => {
    document.getElementById('last-action').textContent =
        e.label ? `最近操作: ${e.label}` : '';
});
const fileInput = document.getElementById('file-input');
const status = document.getElementById('status');
const SOURCE_ID = 'undo-source';
let editToolbar = null;
fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file)
        return;
    status.textContent = `正在加载 ${file.name}...`;
    const reader = new FileReader();
    reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID))
            map.removeSource(SOURCE_ID);
        // Load initial data before registration: await setData, then addSource and setExtent.
        try {
            await source.setData({ filename: file.name, content });
            await map.addSource(SOURCE_ID, source);
            map.setExtent(source.getExtent());
            status.textContent = '试试: 平移 / 绘制 / 拖动顶点 / 右键顶点删除,然后 Ctrl+Z 撤销。';
            map.clearHistory();
            if (editToolbar)
                await map.removeControl(editToolbar);
            editToolbar = new EditToolbar({
                controls: [
                    new VertexEditControl(),
                    new DrawFeatureControl({ source: SOURCE_ID, type: 'polyline' }),
                    new DrawFeatureControl({ source: SOURCE_ID, type: 'polygon' }),
                    new DrawFeatureControl({ source: SOURCE_ID, type: 'point' }),
                ],
            });
            await map.addControl(editToolbar, 'top-left');
        }
        catch (err) {
            console.error(err);
            status.textContent = "处理文件出错";
        }
    };
    reader.readAsArrayBuffer(file);
});
await autoLoadExampleFixtures('undo-redo');
</script>
</body>

</html>
