<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 撤销 / 重做</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: sans-serif;
    }

    #header {
      padding: 10px;
      background: #2c3e50;
      color: white;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 13px;
    }

    #map {
      flex: 1;
      background: #ffffff;
      position: relative;
      outline: none;
    }

    .hint {
      opacity: 0.85;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="Open the Emap examples catalog"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap</span></a>
    <label>
      文件:
      <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
    </label>
    <span class="hint">左侧叠放顶点编辑 / 绘制工具。Ctrl/Cmd+Z 撤销,Ctrl+Shift+Z (或 Ctrl+Y) 重做。</span>
    <span id="status">加载文件以开始</span>
    <span id="last-action" style="margin-left:auto;opacity:0.85"></span>
  </div>
  <div id="map" tabindex="0"></div>

  <script type="module">
    import { installExampleMapUi } from '/src/example-runtime.ts';
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const {
      Emap,
      TopologySource,
      NavigationControl,
      HistoryControl,
      EditToolbar,
      VertexEditControl,
      DrawFeatureControl,
    } = emap;

    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    installExampleMapUi(map, emap);
    map.addControl(new HistoryControl(), 'top-left');

    // 在地图容器上绑定快捷键,无需先点击按钮就能 Ctrl+Z
    map.bindHistoryShortcuts();
    document.getElementById('map').focus();

    map.on('historychange', (e) => {
      document.getElementById('last-action').textContent =
        e.label ? `最近操作: ${e.label}` : '';
    });

    const fileInput = document.getElementById('file-input');
    const status = document.getElementById('status');
    const SOURCE_ID = 'undo-source';
    let editToolbar = null;

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        // Canonical 0.2.0 recipe: await setData (resolves once the dataset
        // is ready), then addSource (order-independent) + setExtent.
        try {
          await source.setData({ filename: file.name, content });
          map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          status.textContent = '试试: 平移 / 绘制 / 拖动顶点 / 右键顶点删除,然后 Ctrl+Z 撤销。';
          map.clearHistory();
          if (editToolbar) map.removeControl(editToolbar);
          editToolbar = new EditToolbar({
            controls: [
              new VertexEditControl(),
              new DrawFeatureControl({ source: SOURCE_ID, type: 'polyline' }),
              new DrawFeatureControl({ source: SOURCE_ID, type: 'polygon' }),
              new DrawFeatureControl({ source: SOURCE_ID, type: 'point' }),
            ],
          });
          map.addControl(editToolbar, 'top-left');
        } catch (err) {
          console.error(err);
          status.textContent = "处理文件出错";
        }
      };
      reader.readAsArrayBuffer(file);
    });
    await autoLoadExampleFixtures('undo-redo');
  </script>
</body>

</html>
