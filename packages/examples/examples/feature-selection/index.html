<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 要素选择</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: sans-serif;
    }

    #header {
      padding: 10px;
      background: #2c3e50;
      color: white;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 13px;
    }

    #header button {
      padding: 4px 10px;
      background: #c0392b;
      color: white;
      border: 0;
      border-radius: 3px;
      cursor: pointer;
      font-size: 13px;
    }

    #header button:disabled {
      background: #7f8c8d;
      cursor: not-allowed;
    }

    #map {
      flex: 1;
      background: #ffffff;
      position: relative;
    }

    #panel {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 280px;
      max-height: 60vh;
      overflow: auto;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 10px;
      font-size: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      /* 高于 emap 控件容器的 z-index (10),否则会被画布覆盖无法操作 */
      z-index: 20;
    }

    #panel h3 {
      margin: 0 0 6px 0;
      font-size: 13px;
    }

    #panel pre {
      margin: 0;
      max-height: 200px;
      overflow: auto;
    }

    .hint {
      opacity: 0.85;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div id="header">
    <label>
      文件:
      <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
    </label>
    <span class="hint">单击 = 替换 · Shift+单击 = 加入 · Ctrl/Cmd+单击 = 切换</span>
    <button id="clear-btn" disabled>清空选择</button>
    <button id="delete-btn" disabled>删除选中</button>
    <span id="status">加载文件以开始</span>
  </div>
  <div id="map">
    <div id="panel">
      <h3>当前选中</h3>
      <pre id="info">(无)</pre>
    </div>
  </div>

  <script type="module">
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;

    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    // 通过 Ctrl+Z 恢复被删除的要素
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    const fileInput = document.getElementById('file-input');
    const clearBtn = document.getElementById('clear-btn');
    const deleteBtn = document.getElementById('delete-btn');
    const status = document.getElementById('status');
    const info = document.getElementById('info');
    const mapContainer = map.getCanvasContainer();

    let activeSource = null;
    const SOURCE_ID = 'select-source';

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        activeSource = source;
        // Canonical 0.2.0 recipe: await setData (resolves once the dataset
        // is ready), then addSource (order-independent) + setExtent.
        try {
          await source.setData({ filename: file.name, content });
          map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          status.textContent = `已加载 ${file.name}`;
        } catch (err) {
          console.error(err);
          status.textContent = "处理文件出错";
        }
      };
      reader.readAsArrayBuffer(file);
    });

    // 选择变化时同步面板和高亮图层
    map.on('selectionchange', (ev) => {
      const refs = ev.selected;
      info.textContent = refs.length
        ? `${refs.length} 个要素\n` + JSON.stringify(refs, null, 2)
        : '(无)';

      if (refs.length === 0) {
        map.clearHighlightedFeatures();
      } else {
        map.setHighlightedFeatures(refs, { color: '#1e88e5', width: 3 });
      }

      clearBtn.disabled = refs.length === 0;
      deleteBtn.disabled = refs.length === 0;

      // 控制台显示 added / removed 增量
      console.log('selectionchange', { added: ev.added, removed: ev.removed });
    });

    mapContainer.addEventListener('click', (e) => {
      if (!activeSource) return;
      const rect = mapContainer.getBoundingClientRect();
      const point = [e.clientX - rect.left, e.clientY - rect.top];
      const features = map.queryFeatures(point);
      if (!features.length) {
        if (!e.shiftKey && !e.ctrlKey && !e.metaKey) map.clearSelection();
        return;
      }
      const mode = e.shiftKey ? 'add' : (e.ctrlKey || e.metaKey) ? 'toggle' : 'replace';
      map.select(features, { mode });
    });

    clearBtn.addEventListener('click', () => map.clearSelection());

    deleteBtn.addEventListener('click', () => {
      const count = map.getSelection().length;
      const ok = map.deleteSelected();
      if (ok) {
        status.textContent = `已删除 ${count} 个要素,Ctrl+Z 撤销。`;
      }
    });
    await autoLoadExampleFixtures('feature-selection');
  </script>
</body>

</html>
