<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 合并选中要素</title>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>合并选中要素</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>合并选中要素</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <p class="emap-example-hint">单击 + Shift+单击 选中多个多边形,然后合并。</p>
        <div class="emap-example-field">
          <label for="attribute-source">属性来源</label>
          <select id="attribute-source" disabled>
            <option value="">请选择至少两个同图层要素</option>
          </select>
        </div>
        <button id="merge-btn" class="emap-example-primary-button" disabled>合并选中</button>
        <div class="emap-example-row">
          <button id="clear-btn" disabled>清空选择</button>
        </div>
        <p id="status" class="emap-example-status">加载多边形数据</p>
      </section>
    </div>
  </details>

  <script type="module">

import { installExampleMapUi } from '/src/example-runtime.ts';
import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
const map = await Emap.create({ container: 'map' });
await map.addControl(new NavigationControl(), 'top-left');
await installExampleMapUi(map, emap);
await map.addControl(new HistoryControl(), 'top-left');
map.bindHistoryShortcuts();
const SOURCE_ID = 'merge-source';
const fileInput = document.getElementById('file-input');
const mergeBtn = document.getElementById('merge-btn');
const clearBtn = document.getElementById('clear-btn');
const attributeSourceSelect = document.getElementById('attribute-source');
const status = document.getElementById('status');
const mapContainer = map.getCanvasContainer();
const selectedByKey = new Map();
function selectionIsMergeable(selected) {
    if (selected.length < 2)
        return false;
    const { source, layer } = selected[0];
    return selected.every((ref) => ref.source === source && ref.layer === layer);
}
function syncSelection(selected) {
    const previousAttributeSource = attributeSourceSelect.value;
    const mergeable = selectionIsMergeable(selected);
    selectedByKey.clear();
    attributeSourceSelect.replaceChildren();
    for (const ref of selected) {
        const key = JSON.stringify([ref.source, ref.layer, ref.id]);
        selectedByKey.set(key, ref);
        const properties = map.features.get(ref)?.properties ?? {};
        const readableName = [properties.name, properties.fullname].find((value) => typeof value === 'string' && value.trim());
        const label = readableName ? `要素 ${ref.id} — ${readableName}` : `要素 ${ref.id}`;
        attributeSourceSelect.add(new Option(label, key));
    }
    if (selected.length === 0) {
        attributeSourceSelect.add(new Option('请选择至少两个同图层要素', ''));
    }
    else if (!mergeable) {
        attributeSourceSelect.add(new Option('所选要素必须属于同一图层', ''));
        status.textContent =
            selected.length < 2 ? '请至少选择两个要素。' : '只能合并同一数据源、同一图层的要素。';
    }
    if (mergeable) {
        attributeSourceSelect.value = selectedByKey.has(previousAttributeSource)
            ? previousAttributeSource
            : attributeSourceSelect.options[0].value;
    }
    mergeBtn.disabled = !mergeable;
    attributeSourceSelect.disabled = !mergeable;
    clearBtn.disabled = selected.length === 0;
    if (selected.length === 0)
        map.clearHighlightedFeatures();
    else
        map.setHighlightedFeatures(selected, { color: '#1e88e5', width: 3 });
}
map.on('selectionchange', (event) => syncSelection(event.selected));
fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file)
        return;
    status.textContent = `正在加载 ${file.name}...`;
    const reader = new FileReader();
    reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID))
            map.removeSource(SOURCE_ID);
        // Load initial data before registration: await setData, then addSource and setExtent.
        try {
            await source.setData({ filename: file.name, content });
            await map.addSource(SOURCE_ID, source);
            map.setExtent(source.getExtent());
            status.textContent = `已加载 ${file.name}。单击选中要素,Shift+单击 加入。`;
        }
        catch (err) {
            console.error(err);
            status.textContent = "处理文件出错";
        }
    };
    reader.readAsArrayBuffer(file);
});
mapContainer.addEventListener('click', (e) => {
    const rect = mapContainer.getBoundingClientRect();
    const point = [e.clientX - rect.left, e.clientY - rect.top];
    const features = map.queryFeatures(point);
    if (!features.length) {
        if (!e.shiftKey && !e.ctrlKey && !e.metaKey)
            map.clearSelection();
        return;
    }
    const mode = e.shiftKey ? 'add' : (e.ctrlKey || e.metaKey) ? 'toggle' : 'replace';
    map.select(features, { mode });
});
mergeBtn.addEventListener('click', async () => {
    const selected = map.getSelection();
    const attributeSource = selectedByKey.get(attributeSourceSelect.value);
    const attributeSourceLabel = attributeSourceSelect.selectedOptions[0]?.textContent;
    if (!selectionIsMergeable(selected) || !attributeSource) {
        status.textContent = '请选择同一图层中的至少两个要素，并指定属性来源。';
        return;
    }
    status.textContent = `正在合并 ${selected.length} 个要素...`;
    mergeBtn.disabled = true;
    attributeSourceSelect.disabled = true;
    try {
        const result = await map.ops.mergeSelected({ attributeSource });
        status.textContent = result.ok
            ? `已合并 ${selected.length} 个要素，属性来自 ${attributeSourceLabel}，Ctrl+Z 撤销。`
            : `合并失败: ${result.error.kind}`;
    }
    catch (error) {
        status.textContent = `错误: ${error instanceof Error ? error.message : String(error)}`;
        console.error(error);
    }
    finally {
        syncSelection(map.getSelection());
    }
});
clearBtn.addEventListener('click', () => map.clearSelection());
await autoLoadExampleFixtures('merge-selected');
</script>
</body>

</html>
