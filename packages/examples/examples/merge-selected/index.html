<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 合并选中要素</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: sans-serif;
    }

    #header {
      padding: 10px;
      background: #2c3e50;
      color: white;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 13px;
    }

    #header button {
      padding: 5px 12px;
      background: #16a085;
      color: white;
      border: 0;
      border-radius: 3px;
      cursor: pointer;
      font-size: 13px;
    }

    #header button:disabled {
      background: #7f8c8d;
      cursor: not-allowed;
    }

    #map {
      flex: 1;
      background: #ffffff;
      position: relative;
      outline: none;
    }

    .hint {
      opacity: 0.85;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div id="header">
    <a class="emap-example-banner-brand" href="/emap/examples/" aria-label="Open the emap examples catalog"><img src="/emap/examples/emap.svg" alt="" /><span>emap</span></a>
    <label>
      文件:
      <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
    </label>
    <span class="hint">单击 + Shift+单击 选中多个多边形,然后合并。</span>
    <button id="merge-btn" disabled>合并选中</button>
    <button id="clear-btn" disabled>清空选择</button>
    <span id="status">加载多边形数据</span>
  </div>
  <div id="map" tabindex="0"></div>

  <script type="module">
    import { installExampleMapUi } from '/src/example-runtime.ts';
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;

    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    installExampleMapUi(map, emap);
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    const SOURCE_ID = 'merge-source';
    const fileInput = document.getElementById('file-input');
    const mergeBtn = document.getElementById('merge-btn');
    const clearBtn = document.getElementById('clear-btn');
    const status = document.getElementById('status');
    const mapContainer = map.getCanvasContainer();

    map.on('selectionchange', (e) => {
      const n = e.selected.length;
      mergeBtn.disabled = n < 2; // 合并单个要素无意义
      clearBtn.disabled = n === 0;
      // 同步高亮
      if (n === 0) map.clearHighlightedFeatures();
      else map.setHighlightedFeatures(e.selected, { color: '#1e88e5', width: 3 });
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        // Canonical 0.2.0 recipe: await setData (resolves once the dataset
        // is ready), then addSource (order-independent) + setExtent.
        try {
          await source.setData({ filename: file.name, content });
          map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          status.textContent = `已加载 ${file.name}。单击选中要素,Shift+单击 加入。`;
        } catch (err) {
          console.error(err);
          status.textContent = "处理文件出错";
        }
      };
      reader.readAsArrayBuffer(file);
    });

    mapContainer.addEventListener('click', (e) => {
      const rect = mapContainer.getBoundingClientRect();
      const point = [e.clientX - rect.left, e.clientY - rect.top];
      const features = map.queryFeatures(point);
      if (!features.length) {
        if (!e.shiftKey && !e.ctrlKey && !e.metaKey) map.clearSelection();
        return;
      }
      const mode = e.shiftKey ? 'add' : (e.ctrlKey || e.metaKey) ? 'toggle' : 'replace';
      map.select(features, { mode });
    });

    mergeBtn.addEventListener('click', async () => {
      const n = map.getSelection().length;
      status.textContent = `正在合并 ${n} 个要素...`;
      mergeBtn.disabled = true;
      try {
        const ok = await map.ops.mergeSelected();
        status.textContent = ok
          ? `已合并 ${n} 个要素,Ctrl+Z 撤销。`
          : '合并失败 (跨图层或跨数据源?)。';
      } catch (err) {
        status.textContent = `错误: ${err?.message ?? err}`;
        console.error(err);
      } finally {
        mergeBtn.disabled = false;
      }
    });

    clearBtn.addEventListener('click', () => map.clearSelection());
    await autoLoadExampleFixtures('merge-selected');
  </script>
</body>

</html>
