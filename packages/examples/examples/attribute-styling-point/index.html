<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 点属性驱动样式</title>
</head>
<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>点属性驱动样式</strong>
  </div>
  <div id="map" tabindex="0"></div>
  <details class="emap-example-workbench panel" open>
    <summary><h1>点属性驱动样式</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field"><label for="file-input">文件</label><input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" /></div>
        <div class="emap-example-field"><label for="field">字段</label><select id="field"></select></div>
        <div class="emap-example-field">
          <label class="emap-example-check"><input type="radio" name="mode" value="baked" checked /> 分级烘焙</label>
          <label class="emap-example-check"><input type="radio" name="mode" value="expression" /> 颜色表达式</label>
          <label class="emap-example-check"><input type="radio" name="mode" value="shape" /> 点型表达式</label>
        </div>
        <button id="apply" class="emap-example-primary-button" disabled>应用样式</button>
      </section>
      <section class="emap-example-section">
        <p id="status" class="emap-example-status">加载一个 point 图层</p>
        <p class="emap-example-hint">
          分级烘焙沿用面的 <code>fill</code> 字段：<code>classifyFeatures({ saveAs: 'fill' })</code> 后由 circle 图层的 <code>styleSource: 'mapshaper'</code> 读取；颜色表达式直接把表达式写入 <code>circle-color</code>；点型表达式在颜色表达式之上把 <code>step</code> 表达式写入 <code>circle-shape</code>，按数值字段把点分成 circle / star / square 三档。
        </p>
      </section>
    </div>
  </details>
  <script type="module">
import { getExampleRenderer } from '/src/renderer-choice.ts';


import { autoLoadExampleFixtures, installExampleMapUi, loadExampleRuntime } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
const map = await Emap.create({ renderer: getExampleRenderer(), container: 'map' });
await map.addControl(new NavigationControl(), 'top-left');
await map.addControl(new HistoryControl(), 'top-left');
await installExampleMapUi(map, emap);
map.bindHistoryShortcuts();
const SOURCE_ID = 'point-style-source';
const LAYER_ID = 'point-style';
const COLORS = ['#fee5d9', '#fcae91', '#fb6a4a', '#de2d26', '#a50f15'];
const NULL_COLOR = '#eeeeee';
const fileInput = document.getElementById('file-input');
const fieldSelect = document.getElementById('field');
const applyButton = document.getElementById('apply');
const status = document.getElementById('status');
let target = '';
function currentLayer() {
    const source = map.getSource(SOURCE_ID);
    return source?.getLayers().find((layer, i) => (layer?.name || layer?.id || `layer-${i}`) === target) ?? null;
}
function addStyledLayer(expression = null, shape = null) {
    if (map.getLayer(LAYER_ID))
        map.removeLayer(LAYER_ID);
    const layer = { id: LAYER_ID, type: 'circle', source: SOURCE_ID, 'source-layer': target };
    if (expression) {
        layer.paint = { 'circle-color': expression, 'circle-radius': 9 };
        if (shape)
            layer.paint['circle-shape'] = shape;
    }
    else {
        layer.styleSource = 'mapshaper';
        layer.paint = { 'circle-radius': 9 };
    }
    map.addLayer(layer);
}
function buildShapeExpression(field) {
    const values = (currentLayer()?.data?.getRecords?.() ?? []).map((record) => Number(record?.[field])).filter(Number.isFinite);
    const min = Math.min(...values);
    const max = Math.max(...values);
    if (!Number.isFinite(min) || !Number.isFinite(max) || min === max)
        return ['match', ['get', 'group'], 'a', 'circle', 'b', 'star', 'square'];
    return ['step', ['get', field], 'circle', min + (max - min) / 3, 'star', min + ((max - min) * 2) / 3, 'square'];
}
function buildExpression(field) {
    const values = (currentLayer()?.data?.getRecords?.() ?? []).map((record) => Number(record?.[field])).filter(Number.isFinite);
    const min = Math.min(...values);
    const max = Math.max(...values);
    if (!Number.isFinite(min) || !Number.isFinite(max) || min === max)
        return ['match', ['get', 'group'], 'a', '#e41a1c', 'b', '#377eb8', '#4daf4a'];
    return ['interpolate', 'linear', ['get', field], min, COLORS[0], max, COLORS[COLORS.length - 1]];
}
async function applyStyle() {
    const field = fieldSelect.value;
    if (!target || !field)
        return;
    const mode = document.querySelector('input[name="mode"]:checked').value;
    if (mode === 'expression' || mode === 'shape') {
        const shape = mode === 'shape' ? buildShapeExpression(field) : null;
        addStyledLayer(buildExpression(field), shape);
        status.textContent = `已应用 circle-color 属性表达式：${field}${shape ? `，circle-shape 分档：${field}` : ''}`;
        return;
    }
    const result = await map.ops.classifyFeatures({
        source: SOURCE_ID,
        target,
        field,
        method: 'quantile',
        classes: COLORS.length,
        colors: COLORS,
        nullValue: NULL_COLOR,
        saveAs: 'fill',
    });
    if (!result.ok) {
        status.textContent = `分级失败：${result.error?.message ?? '未知错误'}`;
        return;
    }
    addStyledLayer();
    status.textContent = `已按 ${field} 烘焙 fill，共 ${result.value.featureCount} 个点。Ctrl+Z 可撤销。`;
}
async function populate(source) {
    const pointLayers = source.getLayers().filter((layer) => layer?.geometry_type === 'point');
    const layer = pointLayers[0];
    if (!layer) {
        status.textContent = '此文件没有 point 图层';
        applyButton.disabled = true;
        return;
    }
    target = layer.name || layer.id || 'layer-0';
    const records = layer.data?.getRecords?.() ?? [];
    fieldSelect.innerHTML = '';
    Object.keys(records[0] || {}).forEach((field) => fieldSelect.appendChild(new Option(field, field)));
    fieldSelect.value = Object.hasOwn(records[0] || {}, 'value') ? 'value' : fieldSelect.value;
    applyButton.disabled = false;
    await applyStyle();
}
fileInput.addEventListener('change', (event) => {
    const file = event.target.files?.[0];
    if (!file)
        return;
    const reader = new FileReader();
    reader.onload = async (loadEvent) => {
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID))
            map.removeSource(SOURCE_ID);
        try {
            await source.setData({ filename: file.name, content: new Uint8Array(loadEvent.target.result) });
            await map.addSource(SOURCE_ID, source);
            map.setExtent(source.getExtent());
            await populate(source);
        }
        catch (error) {
            status.textContent = `错误：${error?.message ?? error}`;
        }
    };
    reader.readAsArrayBuffer(file);
});
applyButton.addEventListener('click', applyStyle);
document.querySelectorAll('input[name="mode"]').forEach((radio) => radio.addEventListener('change', applyStyle));
fieldSelect.addEventListener('change', applyStyle);
await autoLoadExampleFixtures('attribute-styling-point');
</script>
</body>
</html>
