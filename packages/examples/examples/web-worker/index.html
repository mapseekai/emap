<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - Web Worker 卸载重命令</title>
  <style>
    /* Main-thread heartbeat. Pauses when blocked. */
    #freeze-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--emap-example-error);
      animation: pulse 1s infinite linear;
    }
    @keyframes pulse {
      0%   { transform: scale(0.6); opacity: 0.4; }
      50%  { transform: scale(1.0); opacity: 1.0; }
      100% { transform: scale(0.6); opacity: 0.4; }
    }
    #stats {
      margin: 0;
      padding: 4px 10px;
      border: 1px solid var(--emap-example-border);
      background: var(--emap-example-muted);
      font-size: 11px;
    }
    #event-log {
      max-height: 140px;
      margin: 0;
      overflow: auto;
      padding: 6px 10px;
      border: 1px solid var(--emap-example-border);
      background: var(--emap-example-muted);
      font-size: 11px;
      line-height: 1.4;
    }
    #event-log .ok    { color: #27ae60; }
    #event-log .err   { color: #c0392b; }
    #event-log .start { color: #2980b9; }
  </style>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>Web Worker 卸载重命令</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>Web Worker 卸载重命令</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <span class="emap-example-label emap-example-check"><span id="freeze-dot" title="Main-thread heartbeat — pauses when blocked"></span> 主线程心跳</span>
        </div>
        <div class="emap-example-field">
          <label for="mode">Worker 模式</label>
          <select id="mode">
            <option value="off">off (主线程)</option>
            <option value="on">on (始终用 worker)</option>
            <option value="auto" selected>auto (按阈值)</option>
          </select>
        </div>
        <div class="emap-example-field" id="threshold-label">
          <label for="threshold">阈值(顶点数)</label>
          <input id="threshold" type="number" value="50000" />
        </div>
        <div class="emap-example-row">
          <button id="rebuild-btn">应用模式</button>
        </div>
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <div class="emap-example-row">
          <button id="dissolve-btn" disabled>Dissolve 全部</button>
          <button id="simplify-btn" disabled>Simplify 5%</button>
          <button id="union-btn" disabled>Union 全部多边形层</button>
          <button id="clean-btn" disabled>Clean</button>
        </div>
        <div class="emap-example-row">
          <button id="cancel-btn">取消 (cancelWorkerJobs)</button>
          <button id="clear-log-btn">清空日志</button>
        </div>
        <p id="stats">layers: -, arcs: -, vertices: -</p>
        <div id="event-log">事件日志(workerjobstart / workerjobend)将在此显示...</div>
        <p class="emap-example-hint">
          模式 = <code>auto</code>:小数据集走主线程,大数据集走 worker。心跳点连续闪 → 主线程响应中。
          取消按钮硬终止 worker(mapshaper 不可中途取消,但能整体放弃),pool 仍可用,下一次操作会新起一个 worker。
        </p>
      </section>
    </div>
  </details>

  <script type="module">
    import { installExampleMapUi } from '/src/example-runtime.ts';
    import {
      autoLoadExampleFixtures,
      exampleWorkerUrl,
      loadExampleRuntime,
    } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;

    const SOURCE_ID = 'worker-demo-source';
    let map = null;
    let lastFile = null;
    let lastFileBytes = null;

    const modeSel = document.getElementById('mode');
    const thresholdLabel = document.getElementById('threshold-label');
    const thresholdInput = document.getElementById('threshold');
    const rebuildBtn = document.getElementById('rebuild-btn');
    const dissolveBtn = document.getElementById('dissolve-btn');
    const simplifyBtn = document.getElementById('simplify-btn');
    const unionBtn = document.getElementById('union-btn');
    const cleanBtn = document.getElementById('clean-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const clearLogBtn = document.getElementById('clear-log-btn');
    const stats = document.getElementById('stats');
    const eventLog = document.getElementById('event-log');
    const allOpsBtns = [dissolveBtn, simplifyBtn, unionBtn, cleanBtn];

    // Track in-flight start times so we can show "+xxx ms" on each end event.
    const inFlightStart = new Map();

    function logEvent(html, klass) {
      const line = document.createElement('div');
      line.className = klass || '';
      line.innerHTML = `<span style="opacity:0.6">${new Date().toLocaleTimeString()}</span> ${html}`;
      eventLog.appendChild(line);
      eventLog.scrollTop = eventLog.scrollHeight;
    }

    function updateThresholdVisibility() {
      thresholdLabel.style.display = modeSel.value === 'auto' ? '' : 'none';
    }
    modeSel.addEventListener('change', updateThresholdVisibility);
    updateThresholdVisibility();

    function buildMap() {
      if (map) {
        try { map.remove(); } catch (_) {}
      }
      const mode = modeSel.value;
      const useWorker = mode === 'on' ? true : mode === 'auto' ? 'auto' : false;
      const workerThreshold = Number(thresholdInput.value) || 50000;
      map = new Emap({
        container: 'map',
        useWorker,
        workerThreshold,
        workerUrl: exampleWorkerUrl(),
      });
      map.addControl(new NavigationControl(), 'top-left');
      installExampleMapUi(map, emap);
      map.addControl(new HistoryControl(), 'top-left');
      map.bindHistoryShortcuts();
      map.on('error', (e) => {
        console.error('emap error:', e);
        logEvent(`<span class="err">[error]</span> ${e?.error?.message ?? e}`);
      });
      map.on('workerjobstart', (e) => {
        inFlightStart.set(e.id, performance.now());
        logEvent(`<span class="start">[start#${e.id}]</span> ${e.label} (${e.datasetVertexCount.toLocaleString()} verts)`);
      });
      map.on('workerjobend', (e) => {
        inFlightStart.delete(e.id);
        if (e.ok) {
          logEvent(`<span class="ok">[end#${e.id}]</span> ✓ ${e.durationMs.toFixed(0)}ms`);
        } else {
          logEvent(`<span class="err">[end#${e.id}]</span> ✗ ${e.errorMessage} (${e.durationMs.toFixed(0)}ms)`);
        }
      });
      logEvent(`Emap rebuilt: useWorker=${useWorker}${useWorker === 'auto' ? ` threshold=${workerThreshold}` : ''}`);
    }

    function refreshStats() {
      const src = map?.getSource(SOURCE_ID);
      const ds = src?.getDataset();
      if (!ds) {
        stats.textContent = 'layers: -, arcs: -, vertices: -';
        return;
      }
      const arcCount = ds.arcs?.size?.() ?? 0;
      const vertCount = ds.arcs?.getPointCount?.() ?? 0;
      stats.textContent = `layers: ${ds.layers.length}, arcs: ${arcCount}, vertices: ${vertCount.toLocaleString()}`;
    }

    async function reloadCurrentFile() {
      if (!lastFile || !lastFileBytes) {
        for (const b of allOpsBtns) b.disabled = true;
        refreshStats();
        return;
      }
      const source = new TopologySource(SOURCE_ID);
      if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
      // Canonical 0.2.0 recipe: await setData (resolves once the dataset
      // is ready), then addSource (order-independent) + setExtent.
      try {
        await source.setData({ filename: lastFile.name, content: lastFileBytes });
        await map.addSource(SOURCE_ID, source);
        map.setExtent(source.getExtent());
        for (const b of allOpsBtns) b.disabled = false;
        refreshStats();
      } catch (err) {
        console.error(err);
        logEvent(`<span class="err">[error]</span> ${err?.message ?? err}`);
      }
    }

    buildMap();
    rebuildBtn.addEventListener('click', () => {
      buildMap();
      reloadCurrentFile();
    });

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        lastFile = file;
        lastFileBytes = new Uint8Array(ev.target.result);
        reloadCurrentFile();
      };
      reader.readAsArrayBuffer(file);
    });

    function pickPolygonLayer() {
      const ds = map.getSource(SOURCE_ID)?.getDataset();
      return ds?.layers?.find((l) => l.geometry_type === 'polygon')?.name;
    }
    function pickAllPolygonLayers() {
      const ds = map.getSource(SOURCE_ID)?.getDataset();
      return ds?.layers?.filter((l) => l.geometry_type === 'polygon').map((l) => l.name) ?? [];
    }

    dissolveBtn.addEventListener('click', async () => {
      const t = pickPolygonLayer();
      if (!t) { alert('未找到多边形图层'); return; }
      const t0 = performance.now();
      const ok = await map.ops.dissolveLayer({ source: SOURCE_ID, target: t });
      logEvent(`Dissolve(${t}) → ${ok ? 'ok' : 'failed'}, total ${(performance.now() - t0).toFixed(0)}ms`);
      refreshStats();
    });
    simplifyBtn.addEventListener('click', async () => {
      const t = pickPolygonLayer();
      const t0 = performance.now();
      const ok = await map.ops.simplifyLayer({ source: SOURCE_ID, target: t, percentage: 5 });
      logEvent(`Simplify(${t}, 5%) → ${ok ? 'ok' : 'failed'}, total ${(performance.now() - t0).toFixed(0)}ms`);
      refreshStats();
    });
    unionBtn.addEventListener('click', async () => {
      const ts = pickAllPolygonLayers();
      if (ts.length < 2) { alert('需要至少 2 个多边形图层'); return; }
      const t0 = performance.now();
      const ok = await map.ops.unionLayers({ source: SOURCE_ID, targets: ts });
      logEvent(`Union(${ts.length} layers) → ${ok ? 'ok' : 'failed'}, total ${(performance.now() - t0).toFixed(0)}ms`);
      refreshStats();
    });
    cleanBtn.addEventListener('click', async () => {
      const t = pickPolygonLayer();
      const t0 = performance.now();
      const ok = await map.ops.cleanLayer({ source: SOURCE_ID, target: t });
      logEvent(`Clean(${t}) → ${ok ? 'ok' : 'failed'}, total ${(performance.now() - t0).toFixed(0)}ms`);
      refreshStats();
    });

    cancelBtn.addEventListener('click', () => {
      const inFlightCount = inFlightStart.size;
      map.cancelWorkerJobs();
      logEvent(`<span class="err">cancelWorkerJobs() — abandoned ${inFlightCount} job(s)</span>`);
    });

    clearLogBtn.addEventListener('click', () => {
      eventLog.textContent = '';
    });
    await autoLoadExampleFixtures('web-worker');
  </script>
</body>

</html>
