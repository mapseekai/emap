<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 重建拓扑 (Rebuild Topology)</title>
  <style>
    #stats {
      margin: 12px 0 0;
      padding: 8px 10px;
      border: 1px solid var(--emap-example-border);
      background: var(--emap-example-muted);
      font-size: 11px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>重建拓扑 (Rebuild Topology)</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>重建拓扑 (Rebuild Topology)</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <div class="emap-example-field">
          <label for="dx">平移 dx</label>
          <input id="dx" type="text" value="0.5" />
        </div>
        <div class="emap-example-field">
          <label for="dy">平移 dy</label>
          <input id="dy" type="text" value="0.5" />
        </div>
        <div class="emap-example-row">
          <button id="translate-btn" class="alt" disabled>平移所选</button>
        </div>
      </section>
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="snap">snap-interval (可选)</label>
          <input id="snap" type="text" placeholder="自动" />
        </div>
        <div class="emap-example-field">
          <label class="emap-example-check"><input id="no-snap" type="checkbox" /> no-snap</label>
          <label class="emap-example-check"><input id="rebuild-flag" type="checkbox" /> rebuild_topology</label>
        </div>
        <button id="rebuild-btn" class="emap-example-primary-button" disabled>重建拓扑</button>
        <p id="stats">arcs: -, vertices: -</p>
        <p id="status" class="emap-example-status">加载一个含面/线的数据文件,点击要素选中,平移 → 拓扑可能错乱 → 重建拓扑修复</p>
        <p class="emap-example-hint">
          <code>Emap.rebuildTopology</code> 调用 mapshaper 内部 <code>addIntersectionCuts</code> —— 重新检测共享弧、
          在交点处插入顶点、清理退化形状。比 <code>cleanLayer</code> 轻量(后者还会消除毛刺/小面)。
          作为历史屏障(此前细粒度撤销会被清空,但重建本身可撤销一次)。
        </p>
      </section>
    </div>
  </details>

  <script type="module">
import { getExampleRenderer } from '/src/renderer-choice.ts';


import { installExampleMapUi } from '/src/example-runtime.ts';
import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
const map = await Emap.create({ renderer: getExampleRenderer(), container: 'map' });
await map.addControl(new NavigationControl(), 'top-left');
await installExampleMapUi(map, emap);
await map.addControl(new HistoryControl(), 'top-left');
map.bindHistoryShortcuts();
const SOURCE_ID = 'rebuild-source';
const dxInput = document.getElementById('dx');
const dyInput = document.getElementById('dy');
const translateBtn = document.getElementById('translate-btn');
const snapInput = document.getElementById('snap');
const noSnapInput = document.getElementById('no-snap');
const rebuildFlagInput = document.getElementById('rebuild-flag');
const rebuildBtn = document.getElementById('rebuild-btn');
const stats = document.getElementById('stats');
const status = document.getElementById('status');
function refreshStats() {
    const src = map.getSource(SOURCE_ID);
    const ds = src?.getDataset();
    if (!ds) {
        stats.textContent = 'arcs: -, vertices: -';
        return;
    }
    const arcCount = ds.arcs?.size?.() ?? 0;
    const vertexCount = ds.arcs?.getPointCount?.() ?? 0;
    const layerCount = ds.layers?.length ?? 0;
    stats.textContent = `layers: ${layerCount}, arcs: ${arcCount}, vertices: ${vertexCount}`;
}
function refreshButtons() {
    const ds = map.getSource(SOURCE_ID)?.getDataset();
    const hasArcs = !!ds?.arcs;
    rebuildBtn.disabled = !hasArcs;
}
document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file)
        return;
    status.textContent = `正在加载 ${file.name}...`;
    const reader = new FileReader();
    reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID))
            map.removeSource(SOURCE_ID);
        // Load initial data before registration: await setData, then addSource and setExtent.
        try {
            await source.setData({ filename: file.name, content });
            await map.addSource(SOURCE_ID, source);
            map.setExtent(source.getExtent());
            refreshStats();
            refreshButtons();
            translateBtn.disabled = false;
            status.textContent = `已加载 ${file.name}。点击要素选中,然后 "平移所选" 或直接 "重建拓扑"。`;
        }
        catch (err) {
            console.error(err);
            status.textContent = `错误: ${err?.message ?? err}`;
        }
    };
    reader.readAsArrayBuffer(file);
});
map.on('click', (e) => {
    // Tap to toggle selection at the click position
    const features = map.queryFeatures(e.point, { radius: 6 });
    if (!features?.length)
        return;
    const f = features[0];
    map.select([{ source: f.source, layer: f.layer, id: f.id }], 'toggle');
    status.textContent = `已选: ${map.getSelection().length} 个要素`;
});
// Highlight every selected feature whenever the selection changes.
map.on('selectionchange', (ev) => {
    if (ev.selected.length === 0) {
        map.clearHighlightedFeatures();
    }
    else {
        map.setHighlightedFeatures(ev.selected, { color: '#1e88e5', width: 3 });
    }
});
translateBtn.addEventListener('click', () => {
    const dx = Number(dxInput.value);
    const dy = Number(dyInput.value);
    if (Number.isNaN(dx) || Number.isNaN(dy)) {
        status.textContent = 'dx / dy 必须是数字。';
        return;
    }
    if (map.getSelection().length === 0) {
        status.textContent = '请先点击要素选中。';
        return;
    }
    const ok = map.editSession.translateSelected(dx, dy);
    refreshStats();
    status.textContent = ok
        ? `已平移所选 (Δ ${dx}, ${dy})。可能产生新的交叉,点击 "重建拓扑" 修复。`
        : '平移失败。';
});
rebuildBtn.addEventListener('click', async () => {
    const opts = { source: SOURCE_ID };
    const sn = snapInput.value.trim();
    if (sn && !Number.isNaN(Number(sn)))
        opts.snapInterval = Number(sn);
    if (noSnapInput.checked)
        opts.noSnap = true;
    if (rebuildFlagInput.checked)
        opts.rebuildTopology = true;
    const before = stats.textContent;
    status.textContent = '正在重建拓扑...';
    rebuildBtn.disabled = true;
    try {
        const result = await map.ops.rebuildTopology(opts);
        refreshStats();
        const after = stats.textContent;
        status.textContent = result.ok
            ? `已重建。${before} → ${after}。Ctrl+Z 撤销。`
            : '重建失败。';
    }
    catch (err) {
        status.textContent = `错误: ${err?.message ?? err}`;
        console.error(err);
    }
    finally {
        rebuildBtn.disabled = false;
        refreshButtons();
    }
});
refreshStats();
await autoLoadExampleFixtures('rebuild-topology');
</script>
</body>

</html>
