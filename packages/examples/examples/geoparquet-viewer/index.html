<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - GeoParquet / GeoArrow 查看器</title>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>GeoParquet / GeoArrow 查看器</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>GeoParquet / GeoArrow 查看器</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".parquet,.geoparquet,.arrow,.arrows,.feather" disabled />
        </div>
        <div class="emap-example-field">
          <label for="format">导出格式</label>
          <select id="format">
            <option value="geoparquet">GeoParquet (.parquet)</option>
            <option value="geoarrow">GeoArrow IPC (.arrow)</option>
            <option value="geojson">GeoJSON</option>
          </select>
        </div>
        <button id="export-btn" class="emap-example-primary-button" disabled>导出并下载</button>
        <p id="status" class="emap-example-status">正在初始化 GeoParquet 支持...</p>
      </section>
    </div>
  </details>

  <script type="module">

import { installExampleMapUi } from '/src/example-runtime.ts';
import { autoLoadExampleFixtures, loadExampleArrow, loadExampleRuntime, } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const emapArrow = await loadExampleArrow();
await emapArrow.initParquetWasm();
document.getElementById('status').textContent = '上传 .parquet / .arrow 文件开始';
document.getElementById('file-input').disabled = false;
const { Emap, TopologySource } = emap;
const map = await Emap.create({ container: 'map' });
await map.ctx.plugin(emapArrow.arrowFormatsPlugin);
await map.addControl(new emap.NavigationControl(), 'top-left');
await installExampleMapUi(map, emap);
const fileInput = document.getElementById('file-input');
const formatSelect = document.getElementById('format');
const exportBtn = document.getElementById('export-btn');
const status = document.getElementById('status');
const SOURCE_ID = 'parquet-source';
let activeSource = null;
fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file)
        return;
    status.textContent = `处理 ${file.name} 中...`;
    exportBtn.disabled = true;
    const reader = new FileReader();
    reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID, { formats: map.formats });
        if (map.getSource(SOURCE_ID))
            map.removeSource(SOURCE_ID);
        activeSource = source;
        try {
            // setData 识别 .parquet/.arrow 扩展名并调用 formats 模块注册的插件。
            // Arrow 格式已通过 map.ctx.plugin(arrowFormatsPlugin) 显式注册。
            await source.setData({ filename: file.name, content });
            await map.addSource(SOURCE_ID, source);
            map.setExtent(source.getExtent());
            const layer = source.getDataset()?.layers?.[0];
            const featureCount = layer?.shapes?.length ?? 0;
            const geomType = layer?.geometry_type ?? '未知';
            status.textContent = `${file.name} — ${featureCount} 个要素（${geomType}）`;
            exportBtn.disabled = false;
        }
        catch (err) {
            console.error(err);
            status.textContent = `处理失败: ${err.message || err}`;
        }
    };
    reader.readAsArrayBuffer(file);
});
exportBtn.addEventListener('click', async () => {
    if (!activeSource)
        return;
    const format = formatSelect.value;
    status.textContent = `正在导出为 ${format}...`;
    exportBtn.disabled = true;
    try {
        const blob = await activeSource.export({ format });
        const extMap = { geoparquet: '.parquet', geoarrow: '.arrow', geojson: '.geojson' };
        const filename = 'export' + (extMap[format] ?? '.' + format);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        await a.dispose();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        status.textContent = `已导出 ${blob.size} 字节 → ${filename}`;
    }
    catch (err) {
        console.error(err);
        status.textContent = `导出失败: ${err.message || err}`;
    }
    finally {
        exportBtn.disabled = false;
    }
});
window.addEventListener('resize', () => map.resize());
await autoLoadExampleFixtures('geoparquet-viewer');
</script>
</body>

</html>
