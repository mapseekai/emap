<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 绘制吸附清理</title>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>绘制吸附清理</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>绘制吸附清理</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <div class="emap-example-field">
          <label for="threshold">吸附阈值(px)</label>
          <input id="threshold" type="number" value="18" min="1" />
        </div>
        <button id="draw-line" class="emap-example-primary-button">应用并开启绘制折线</button>
        <div class="emap-example-row">
          <button id="cancel">取消绘制</button>
        </div>
        <p id="status" class="emap-example-status">正在加载本地示例数据...</p>
        <p class="emap-example-hint">
          红色圆环 = 顶点吸附,红色方框 = 边吸附。
          预期行为: 鼠标离开阈值后红色吸附标记应立即消失,不会滞留在上一次吸附的位置。
        </p>
      </section>
    </div>
  </details>

  <script type="module">
    import { installExampleMapUi } from '/src/example-runtime.ts';
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;

    const SOURCE_ID = 'snap-clear-source';
    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    installExampleMapUi(map, emap);
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    let sourceLayer = '';

    async function loadExampleData(file) {
      const source = new TopologySource(SOURCE_ID);
      const content = new Uint8Array(await file.arrayBuffer());
      if (map.getLayer('reference-line')) map.removeLayer('reference-line');
      if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
      await source.setData({ filename: file.name, content });
      await map.addSource(SOURCE_ID, source);
      map.setExtent(source.getExtent());

      const layer = source.getLayers()[0];
      sourceLayer = layer?.name || '';
      map.addLayer({
        id: 'reference-line',
        type: 'line',
        source: SOURCE_ID,
        'source-layer': sourceLayer,
        paint: { 'line-color': '#1e88e5', 'line-width': 3 },
      });
      document.getElementById('status').textContent =
        `已加载 ${file.name}。开启绘制后，把鼠标靠近/远离参考线观察吸附点清理。`;
    }

    function readThreshold() {
      const threshold = Number(document.getElementById('threshold').value) || 18;
      return Math.max(1, threshold);
    }

    function applyDrawOptions() {
      map.drawFeature.setOptions({
        source: SOURCE_ID,
        sourceLayer,
        type: 'polyline',
        snapThreshold: readThreshold(),
        snapToVertex: true,
        snapToEdge: true,
        drawColor: '#d81b60',
      });
    }

    function enableDraw() {
      applyDrawOptions();
      map.drawFeature.enable();
      document.getElementById('status').textContent =
        `绘制已开启,当前吸附阈值 ${readThreshold()}px。靠近蓝色线会显示吸附标记,移远后标记应立即消失。`;
      map.getCanvasContainer?.().focus?.();
    }

    document.getElementById('draw-line').addEventListener('click', enableDraw);
    document.getElementById('threshold').addEventListener('input', () => {
      applyDrawOptions();
      document.getElementById('status').textContent =
        `已应用吸附阈值 ${readThreshold()}px。继续移动鼠标即可观察新的吸附距离。`;
    });
    document.getElementById('cancel').addEventListener('click', () => {
      map.drawFeature.disable();
      document.getElementById('status').textContent = '绘制已取消。';
    });

    document.getElementById('file-input').addEventListener('change', async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        await loadExampleData(file);
        enableDraw();
      } catch (err) {
        console.error(err);
        document.getElementById('status').textContent = '示例数据加载失败';
      }
    });

    await autoLoadExampleFixtures('draw-snap-clear');
  </script>
</body>

</html>
