<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - FlatGeobuf 查看器</title>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>FlatGeobuf 查看器</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>FlatGeobuf 查看器</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input type="file" id="file-input" accept=".fgb" />
        </div>
        <p id="status" class="emap-example-status">上传 .fgb 文件开始</p>
        <p class="emap-example-hint">
          通过 <code>registerFormat</code> 注册的 FlatGeobuf 插件导入:头部 CRS 码写入数据集
          <code>crs_string</code>。当前为全量加载(字节已在内存),不含流式/范围读取。
        </p>
      </section>
    </div>
  </details>

  <script type="module">
    import { installExampleMapUi } from '/src/example-runtime.ts';
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';
    import { installFlatGeobufFormat } from '/src/flatgeobuf-format.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource } = emap;
    installFlatGeobufFormat(emap);

    const map = new Emap({
      container: "map",
    });

    map.addControl(new emap.NavigationControl(), "top-left");
    installExampleMapUi(map, emap);

    const fileInput = document.getElementById("file-input");
    const status = document.getElementById("status");

    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      status.textContent = `处理 ${file.name} 中...`;

      try {
        const reader = new FileReader();
        reader.onload = async (event) => {
          const content = new Uint8Array(event.target.result);
          const source = new TopologySource("fgb-source");

          if (map.getSource("fgb-source")) {
            map.removeSource("fgb-source");
          }

          try {
            await source.setData({ filename: file.name, content });
            await map.addSource("fgb-source", source);
            map.setExtent(source.getExtent());
            const ds = source.getDataset();
            const featureCount = ds?.layers?.reduce(
              (n, l) => n + (l.shapes?.length ?? l.data?.size?.() ?? 0),
              0,
            );
            status.textContent =
              `当前: ${file.name} (${featureCount ?? '?'} 要素, CRS ${source.getCRS()})`;
          } catch (err) {
            console.error(err);
            status.textContent = `处理文件出错: ${err?.message ?? err}`;
          }
        };
        reader.readAsArrayBuffer(file);
      } catch (err) {
        console.error(err);
        status.textContent = "处理文件出错";
      }
    });

    window.addEventListener("resize", () => {
      map.resize();
    });
    await autoLoadExampleFixtures('flatgeobuf-viewer');
  </script>
</body>

</html>
