<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 绘制与吸附</title>
  
</head>
<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>绘制与吸附</strong>
  </div>
  <div id="map" tabindex="0"></div>
  <details class="emap-example-workbench panel" open>
    <summary><h1>绘制与吸附</h1></summary>
    <div class="emap-example-workbench-body">
      
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <div class="emap-example-field">
          <label for="snap-threshold">吸附阈值 (px)</label>
          <input id="snap-threshold" type="number" value="12" min="1" />
        </div>
        <div class="emap-example-field">
          <label class="emap-example-check"><input id="snap-vertex" type="checkbox" checked /> 吸附顶点</label>
          <label class="emap-example-check"><input id="snap-edge" type="checkbox" checked /> 吸附边</label>
        </div>
        <button id="apply-snap" class="emap-example-primary-button">应用并绘制折线</button>
        <button id="cancel" type="button">取消绘制</button>
        <p id="status" class="emap-example-status">加载数据后绘制折线。靠近参考线会显示吸附标记，离开后标记消失。</p>
      </section>
    </div>
  </details>
  <script type="module">
import { getExampleRenderer } from '/src/renderer-choice.ts';
import { autoLoadExampleFixtures, installExampleMapUi, loadExampleRuntime } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
const map = await Emap.create({ renderer: getExampleRenderer(), container: 'map' });
await map.addControl(new NavigationControl(), 'top-left');
await installExampleMapUi(map, emap);
await map.addControl(new HistoryControl(), 'top-left');
map.bindHistoryShortcuts();
const SOURCE_ID = 'draw-snap-source';
let sourceLayer = '';
function readThreshold() {
  return Math.max(1, Number(document.getElementById('snap-threshold').value) || 12);
}
function applyDrawOptions() {
  map.drawFeature.setOptions({
    source: SOURCE_ID,
    sourceLayer,
    type: 'polyline',
    snapThreshold: readThreshold(),
    snapToVertex: document.getElementById('snap-vertex').checked,
    snapToEdge: document.getElementById('snap-edge').checked,
    drawColor: '#d81b60',
  });
}
async function loadExampleData(file) {
  const source = new TopologySource(SOURCE_ID);
  const content = new Uint8Array(await file.arrayBuffer());
  if (map.getLayer('reference-line')) map.removeLayer('reference-line');
  if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
  await source.setData({ filename: file.name, content });
  await map.addSource(SOURCE_ID, source);
  map.setExtent(source.getExtent());
  const layer = source.getLayers()[0];
  sourceLayer = layer?.name || '';
  map.addLayer({
    id: 'reference-line',
    type: 'line',
    source: SOURCE_ID,
    'source-layer': sourceLayer,
    paint: { 'line-color': '#1e88e5', 'line-width': 3 },
  });
  document.getElementById('status').textContent = `已加载 ${file.name}。绘制时靠近参考线观察顶点和边吸附。`;
}
document.getElementById('apply-snap').addEventListener('click', () => {
  applyDrawOptions();
  map.drawFeature.enable();
  document.getElementById('status').textContent = `绘制已开启，吸附阈值 ${readThreshold()}px。离开阈值后标记会消失。`;
});
document.getElementById('cancel').addEventListener('click', () => {
  map.drawFeature.disable();
  document.getElementById('status').textContent = '绘制已取消。';
});
document.getElementById('file-input').addEventListener('change', async (event) => {
  const file = event.target.files?.[0];
  if (!file) return;
  try {
    await loadExampleData(file);
  } catch (error) {
    console.error(error);
    document.getElementById('status').textContent = '示例数据加载失败';
  }
});
await autoLoadExampleFixtures('draw-snap');

</script>
</body>
</html>
