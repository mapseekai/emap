<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - DuckDB 空间关系</title>
  
</head>
<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>DuckDB 空间关系</strong>
  </div>
  <div id="map" tabindex="0"></div>
  <details class="emap-example-workbench panel" open>
    <summary><h1>DuckDB 空间关系</h1></summary>
    <div class="emap-example-workbench-body">
      
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="spatial-operation">操作</label>
          <select id="spatial-operation"><option value="intersects">相交</option><option value="contains">包含</option><option value="within">被包含</option><option value="touches">相接</option><option value="disjoint">相离</option><option value="overlaps">重叠</option><option value="equals">相等</option><option value="crosses">穿越</option><option value="covers">覆盖</option><option value="coveredBy">被覆盖</option><option value="containsProperly">严格包含</option><option value="distance">距离</option><option value="distanceWithin">距离范围</option></select>
        </div>
        <div class="emap-example-field">
          <label for="file">数据文件</label>
          <input id="file" type="file">
        </div>
        <div class="emap-example-field">
          <label for="target">目标图层</label>
          <select id="target"></select>
        </div>
        <div id="crs-recovery" class="emap-example-field" hidden>
          <label id="crs-recovery-label" for="crs-recovery-input">数据 CRS</label>
          <input id="crs-recovery-input" placeholder="例如 EPSG:3857">
          <button id="crs-recovery-apply" type="button">应用 CRS</button>
        </div>
        
        <div class="emap-example-field">
          <label for="mask-file">遮罩文件</label>
          <input id="mask-file" type="file">
        </div>
        <div class="emap-example-field">
          <label id="mask-layer-label" for="mask-layer">遮罩图层</label>
          <select id="mask-layer"></select>
        </div>
        <div class="emap-example-field">
          <label id="relation-mode-label" for="relation-mode">关系模式</label>
          <select id="relation-mode"><option value="filter">筛选</option><option value="attribute">写入属性</option></select>
        </div>
        <div class="emap-example-field">
          <label id="distance-label" for="distance">距离</label>
          <input id="distance" type="number" value="1000" min="0" step="any">
        </div>
      </section>
      <section class="emap-example-section">
        <button id="run" class="emap-example-primary-button">运行</button>
        <p id="status" class="emap-example-status"></p>
        <pre id="picked-attributes"></pre>
      </section>
    </div>
  </details>
  <script type="module">
import { mountDuckDbSpatialExample } from '/src/duckdb-spatial-example.ts';
await mountDuckDbSpatialExample({ id: 'duckdb/relation/spatial-relations', operation: 'intersects' });
</script>
</body>
</html>
