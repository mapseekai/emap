<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8" /><title>Emap 示例 - DuckDB 保拓扑简化</title></head><body class="emap-example-with-floating-header"><div id="header"><strong>DuckDB 保拓扑简化</strong></div><div id="map" tabindex="0"></div><details class="emap-example-workbench panel" open><summary><h1>DuckDB 保拓扑简化</h1></summary><section><label>数据文件 <input id="file" type="file" accept=".geojson,.json,.topojson,.zip,.kml,.msx" /></label><label>目标图层 <select id="target" disabled></select></label><label>数据 CRS <input id="crs" value="EPSG:4326" /></label><label id="tolerance-label">容差 <input id="tolerance" type="number" min="0" step="any" value="1" /></label><label><input id="allow-geographic" type="checkbox" />允许经纬度坐标直接简化</label><button id="run" disabled>保拓扑简化</button><p id="status">上传数据后保拓扑简化目标图层。</p><pre id="picked-attributes">(点击地图上的要素)</pre></section></details><script type="module">
