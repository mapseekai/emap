<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 几何简化 (Simplify)</title>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>几何简化 (Simplify)</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>几何简化 (Simplify)</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <div class="emap-example-field">
          <label for="scope">作用域</label>
          <select id="scope">
            <option value="">整个数据源 (推荐)</option>
          </select>
        </div>
        <div class="emap-example-field">
          <label for="threshold-mode">阈值方式</label>
          <select id="threshold-mode">
            <option value="percentage">percentage (百分比)</option>
            <option value="interval">interval (距离)</option>
            <option value="resolution">resolution (网格)</option>
          </select>
        </div>
        <div class="emap-example-field">
          <label for="threshold-value">值</label>
          <input id="threshold-value" type="text" value="10" />
        </div>
        <div class="emap-example-field">
          <label for="method">方法</label>
          <select id="method">
            <option value="">weighted (默认,加权 Visvalingam)</option>
            <option value="weighted">weighted (显式)</option>
            <option value="visvalingam">visvalingam</option>
            <option value="dp">dp (Douglas-Peucker)</option>
          </select>
        </div>
        <div class="emap-example-field">
          <label class="emap-example-check"><input id="planar" type="checkbox" /> planar</label>
          <label class="emap-example-check"><input id="keep-shapes" type="checkbox" checked /> keep-shapes</label>
          <label class="emap-example-check"><input id="lock-box" type="checkbox" /> lock-box</label>
          <label class="emap-example-check"><input id="no-repair" type="checkbox" /> no-repair</label>
        </div>
        <button id="btn" class="emap-example-primary-button" disabled>简化</button>
        <p id="status" class="emap-example-status">加载一个含面或线的数据文件</p>
        <p class="emap-example-hint">
          mapshaper <code>-simplify</code> 会在弧上设置每顶点阈值 (<code>zz</code>),后续渲染、命令、导出都会自动遵循。
          重新执行不同阈值会替换上一次的设置。Ctrl+Z 可撤销。
        </p>
      </section>
    </div>
  </details>

  <script type="module">
    import { installExampleMapUi } from '/src/example-runtime.ts';
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    installExampleMapUi(map, emap);
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    const SOURCE_ID = 'simplify-source';
    const scopeSel = document.getElementById('scope');
    const thresholdModeSel = document.getElementById('threshold-mode');
    const thresholdValue = document.getElementById('threshold-value');
    const methodSel = document.getElementById('method');
    const planarInput = document.getElementById('planar');
    const keepShapesInput = document.getElementById('keep-shapes');
    const lockBoxInput = document.getElementById('lock-box');
    const noRepairInput = document.getElementById('no-repair');
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');

    function populate(source) {
      // Reset to "all source" plus per-layer scopes
      scopeSel.innerHTML = '<option value="">整个数据源 (推荐)</option>';
      source.getLayers().forEach((lyr, i) => {
        const name = lyr?.name || lyr?.id || `layer-${i}`;
        const geom = lyr?.geometry_type ?? '?';
        if (geom === 'polygon' || geom === 'polyline') {
          scopeSel.appendChild(new Option(`${name} (${geom})`, name));
        }
      });
      btn.disabled = source.getLayers().length === 0;
    }

    function placeholderForMode() {
      const mode = thresholdModeSel.value;
      if (mode === 'percentage') return '0..100, 例如 10';
      if (mode === 'interval') return '> 0, 单位: 源 CRS';
      if (mode === 'resolution') return '例如 1000x500';
      return '';
    }

    thresholdModeSel.addEventListener('change', () => {
      thresholdValue.placeholder = placeholderForMode();
    });
    thresholdValue.placeholder = placeholderForMode();

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        // Canonical 0.2.0 recipe: await setData (resolves once the dataset
        // is ready), then addSource (order-independent) + setExtent.
        try {
          await source.setData({ filename: file.name, content });
          await map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          populate(source);
          status.textContent = `已加载 ${file.name}。`;
        } catch (err) {
          console.error(err);
          status.textContent = `错误: ${err?.message ?? err}`;
        }
      };
      reader.readAsArrayBuffer(file);
    });

    btn.addEventListener('click', async () => {
      const opts = { source: SOURCE_ID };
      const scope = scopeSel.value;
      if (scope) opts.target = scope;

      const mode = thresholdModeSel.value;
      const raw = thresholdValue.value.trim();
      if (mode === 'percentage') {
        const n = Number(raw);
        if (Number.isNaN(n)) { status.textContent = 'percentage 必须是数字。'; return; }
        opts.percentage = n;
      } else if (mode === 'interval') {
        const n = Number(raw);
        if (Number.isNaN(n)) { status.textContent = 'interval 必须是数字。'; return; }
        opts.interval = n;
      } else {
        opts.resolution = raw;
      }

      const method = methodSel.value;
      if (method) opts.method = method;
      if (planarInput.checked) opts.planar = true;
      if (keepShapesInput.checked) opts.keepShapes = true;
      if (lockBoxInput.checked) opts.lockBox = true;
      if (noRepairInput.checked) opts.noRepair = true;

      const label = scope || '整个数据源';
      status.textContent = `正在简化 ${label}...`;
      btn.disabled = true;
      try {
        const ok = await map.ops.simplifyLayer(opts);
        if (ok) {
          // Render-LOD verification: floor is what `-simplify` baked into
          // the arcs; filtered count is how many vertices survive at that
          // floor. Both are independent of the current zoom level.
          const arcs = map.getSource(SOURCE_ID)?.getArcs?.();
          const total = arcs?.getPointCount?.() ?? 0;
          const floor = arcs?.getRetainedInterval?.() ?? 0;
          const kept = arcs?.getFilteredPointCount?.() ?? total;
          const dropped = total - kept;
          const pct = total > 0 ? ((kept / total) * 100).toFixed(1) : '0';
          status.textContent =
            `已简化 ${label} (${mode}=${raw}): 保留 ${kept}/${total} 顶点 (${pct}%, 丢弃 ${dropped}), ` +
            `floor=${floor.toExponential(2)}。Ctrl+Z 撤销。`;
        } else {
          status.textContent = '简化失败 (检查阈值是否合法)。';
        }
        const src = map.getSource(SOURCE_ID);
        if (src) populate(src);
      } catch (err) {
        status.textContent = `错误: ${err?.message ?? err}`;
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    });
    await autoLoadExampleFixtures('simplify');
  </script>
</body>

</html>
