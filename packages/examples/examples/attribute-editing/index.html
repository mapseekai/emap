<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 属性编辑</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: sans-serif;
    }

    #header {
      padding: 10px;
      background: #2c3e50;
      color: white;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 13px;
    }

    #header button {
      padding: 4px 10px;
      background: #16a085;
      color: white;
      border: 0;
      border-radius: 3px;
      cursor: pointer;
      font-size: 13px;
    }

    #map {
      flex: 1;
      background: #ffffff;
      position: relative;
      outline: none;
    }

    #panel {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 320px;
      max-height: 75vh;
      overflow: auto;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      /* 高于 emap 控件容器的 z-index (10),否则会被画布覆盖无法操作 */
      z-index: 20;
    }

    #panel h3 {
      margin: 0 0 8px 0;
      font-size: 13px;
    }

    #panel .row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }

    #panel input {
      flex: 1;
      padding: 3px 6px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }

    #panel .key {
      width: 110px;
      color: #555;
      font-family: monospace;
    }

    .schema {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }

    .schema .row { gap: 4px; }
    .schema button {
      padding: 3px 8px;
      font-size: 12px;
      background: #34495e;
      color: white;
      border: 0;
      border-radius: 3px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="header">
    <a class="emap-example-banner-brand" href="/emap/examples/" aria-label="Open the emap examples catalog"><img src="/emap/examples/emap.svg" alt="" /><span>emap</span></a>
    <label>
      文件:
      <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
    </label>
    <span id="status">加载数据后，点击要素进行编辑</span>
  </div>
  <div id="map" tabindex="0">
    <div id="panel">
      <h3>属性</h3>
      <div id="props">(点击地图上的要素)</div>
      <div class="schema" id="schema-panel" hidden>
        <h3>字段</h3>
        <div class="row">
          <input id="add-field" placeholder="新字段名" />
          <button id="add-field-btn">新增</button>
        </div>
        <div class="row">
          <input id="rename-from" placeholder="原名" />
          <input id="rename-to" placeholder="新名" />
          <button id="rename-btn">重命名</button>
        </div>
        <div class="row">
          <input id="remove-field" placeholder="字段名" />
          <button id="remove-btn">删除</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { installExampleMapUi } from '/src/example-runtime.ts';
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;

    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    installExampleMapUi(map, emap);
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    const SOURCE_ID = 'attr-source';
    const fileInput = document.getElementById('file-input');
    const status = document.getElementById('status');
    const propsDiv = document.getElementById('props');
    const schemaPanel = document.getElementById('schema-panel');
    const mapContainer = map.getCanvasContainer();

    let activeRef = null;
    let activeTarget = null; // 当前选中要素所在的图层名

    function renderProps(feature) {
      activeRef = { source: feature.source, layer: feature.layer, id: feature.id };
      activeTarget = feature.layer;
      const props = feature.properties || {};
      propsDiv.innerHTML = '';
      Object.entries(props).forEach(([key, value]) => {
        const row = document.createElement('div');
        row.className = 'row';
        const k = document.createElement('span');
        k.className = 'key';
        k.textContent = key;
        const v = document.createElement('input');
        v.value = value == null ? '' : String(value);
        v.addEventListener('change', () => {
          // 数字字符串保持数字类型
          let next = v.value;
          if (/^-?\d+(\.\d+)?$/.test(next)) next = Number(next);
          map.attributes.setFeatureProperty(activeRef, key, next === '' ? undefined : next);
          status.textContent = `${key} → ${v.value}`;
        });
        row.appendChild(k);
        row.appendChild(v);
        propsDiv.appendChild(row);
      });
      schemaPanel.hidden = false;
    }

    function refreshActiveDisplay() {
      if (!activeRef) return;
      const hits = map.queryFeatures([0, 0], { layers: [activeRef.layer] });
      const fresh = hits.find((h) => h.id === activeRef.id);
      if (fresh) renderProps(fresh);
    }

    map.on('historychange', () => {
      // undo / redo 时面板按当前值重渲染
      refreshActiveDisplay();
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        // Canonical 0.2.0 recipe: await setData (resolves once the dataset
        // is ready), then addSource (order-independent) + setExtent.
        try {
          await source.setData({ filename: file.name, content });
          map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          status.textContent = `已加载 ${file.name}。点击要素查看 / 编辑属性。`;
        } catch (err) {
          console.error(err);
        }
      };
      reader.readAsArrayBuffer(file);
    });

    mapContainer.addEventListener('click', (e) => {
      const rect = mapContainer.getBoundingClientRect();
      const point = [e.clientX - rect.left, e.clientY - rect.top];
      const features = map.queryFeatures(point);
      if (!features.length) {
        propsDiv.textContent = '(未命中要素)';
        return;
      }
      renderProps(features[0]);
    });

    document.getElementById('add-field-btn').addEventListener('click', () => {
      const field = document.getElementById('add-field').value.trim();
      if (!field || !activeTarget) return;
      const ok = map.attributes.addField({ source: SOURCE_ID, target: activeTarget, field });
      status.textContent = ok ? `已新增字段 "${field}",Ctrl+Z 撤销。` : '新增失败。';
      refreshActiveDisplay();
    });

    document.getElementById('remove-btn').addEventListener('click', () => {
      const field = document.getElementById('remove-field').value.trim();
      if (!field || !activeTarget) return;
      const ok = map.attributes.removeField({ source: SOURCE_ID, target: activeTarget, field });
      status.textContent = ok ? `已删除字段 "${field}",Ctrl+Z 撤销。` : '删除失败。';
      refreshActiveDisplay();
    });

    document.getElementById('rename-btn').addEventListener('click', () => {
      const from = document.getElementById('rename-from').value.trim();
      const to = document.getElementById('rename-to').value.trim();
      if (!from || !to || !activeTarget) return;
      const ok = map.attributes.renameField({ source: SOURCE_ID, target: activeTarget, from, to });
      status.textContent = ok ? `已重命名 ${from} → ${to},Ctrl+Z 撤销。` : '重命名失败 (字段冲突)。';
      refreshActiveDisplay();
    });
    await autoLoadExampleFixtures('attribute-editing');
  </script>
</body>

</html>
