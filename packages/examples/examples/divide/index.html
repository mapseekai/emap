<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 折线被多边形切分 (Divide)</title>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>折线被多边形切分 (Divide)</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>折线被多边形切分 (Divide)</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件 (可一次选多个或多次添加)</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" multiple />
        </div>
        <div class="emap-example-row">
          <button id="clear-files-btn" type="button">清空</button>
        </div>
        <div class="emap-example-field">
          <label for="target">折线图层 (将被切分)</label>
          <select id="target"></select>
        </div>
        <div class="emap-example-field">
          <label for="divider">多边形图层 (作为切分器)</label>
          <select id="divider"></select>
        </div>
        <div class="emap-example-field">
          <label for="fields">保留字段</label>
          <input id="fields" type="text" placeholder="可选,例如 NAME,STATE" />
        </div>
        <div class="emap-example-field">
          <label class="emap-example-check"><input id="force" type="checkbox" /> 覆盖同名字段</label>
        </div>
        <button id="btn" class="emap-example-primary-button" disabled>按多边形切分折线</button>
        <p id="status" class="emap-example-status">同时上传一个折线图层和一个多边形图层</p>
        <p class="emap-example-hint">
          mapshaper <code>-divide</code> 在多边形边界处切断折线,并把所在多边形的属性拷贝到每段折线。
          可以分多次上传两个 GeoJSON 文件 —— Emap 会合并到同一数据源。
        </p>
      </section>
    </div>
  </details>

  <script type="module">
import { getExampleRenderer } from '/src/renderer-choice.ts';


import { installExampleMapUi } from '/src/example-runtime.ts';
import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
const map = await Emap.create({ renderer: getExampleRenderer(), container: 'map' });
await map.addControl(new NavigationControl(), 'top-left');
await installExampleMapUi(map, emap);
await map.addControl(new HistoryControl(), 'top-left');
map.bindHistoryShortcuts();
const SOURCE_ID = 'divide-source';
const fileInput = document.getElementById('file-input');
const clearBtn = document.getElementById('clear-files-btn');
const targetSel = document.getElementById('target');
const dividerSel = document.getElementById('divider');
const fieldsInput = document.getElementById('fields');
const forceInput = document.getElementById('force');
const btn = document.getElementById('btn');
const status = document.getElementById('status');
/** filename -> Uint8Array (累计上传) */
const uploaded = new Map();
function readFile(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => resolve(new Uint8Array(ev.target.result));
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
    });
}
function populateLayerOptions(source) {
    targetSel.innerHTML = '';
    dividerSel.innerHTML = '';
    const layers = source.getLayers();
    layers.forEach((lyr, i) => {
        const name = lyr?.name || lyr?.id || `layer-${i}`;
        if (lyr?.geometry_type === 'polyline') {
            targetSel.appendChild(new Option(name, name));
        }
        else if (lyr?.geometry_type === 'polygon') {
            dividerSel.appendChild(new Option(name, name));
        }
    });
    btn.disabled = !(targetSel.options.length > 0 && dividerSel.options.length > 0);
}
async function reimportAll() {
    if (uploaded.size === 0) {
        if (map.getSource(SOURCE_ID))
            map.removeSource(SOURCE_ID);
        targetSel.innerHTML = '';
        dividerSel.innerHTML = '';
        btn.disabled = true;
        status.textContent = '已清空,等待上传文件';
        return;
    }
    status.textContent = `加载 ${uploaded.size} 个文件中...`;
    const entries = Array.from(uploaded, ([filename, content]) => ({ filename, content }));
    const source = new TopologySource(SOURCE_ID);
    if (map.getSource(SOURCE_ID))
        map.removeSource(SOURCE_ID);
    // Load initial data before registration: await setData, then addSource and setExtent.
    try {
        await source.setData(entries);
        await map.addSource(SOURCE_ID, source);
        map.setExtent(source.getExtent());
        populateLayerOptions(source);
        status.textContent = `已加载 ${uploaded.size} 个文件。选择折线和多边形图层后点击 "按多边形切分折线"。`;
    }
    catch (e) {
        console.error(e);
        status.textContent = `加载失败: ${e.error?.message ?? e}`;
    }
}
fileInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length === 0)
        return;
    for (const f of files) {
        try {
            uploaded.set(f.name, await readFile(f));
        }
        catch (err) {
            console.error(`读取 ${f.name} 失败`, err);
        }
    }
    fileInput.value = '';
    await reimportAll();
});
clearBtn.addEventListener('click', async () => {
    uploaded.clear();
    await reimportAll();
});
btn.addEventListener('click', async () => {
    const target = targetSel.value;
    const divider = dividerSel.value;
    if (!target || !divider)
        return;
    const opts = { source: SOURCE_ID, target, divider };
    const f = fieldsInput.value.trim();
    if (f)
        opts.fields = f.split(',').map((s) => s.trim()).filter(Boolean);
    if (forceInput.checked)
        opts.force = true;
    status.textContent = `正在用 "${divider}" 切分 "${target}"...`;
    btn.disabled = true;
    try {
        const result = await map.ops.divideLayer(opts);
        status.textContent = result.ok ? `"${target}" 已按 "${divider}" 切分,Ctrl+Z 撤销。` : '切分失败 (检查图层类型与名称)。';
        const src = map.getSource(SOURCE_ID);
        if (src)
            populateLayerOptions(src);
    }
    catch (err) {
        status.textContent = `错误: ${err?.message ?? err}`;
        console.error(err);
    }
    finally {
        btn.disabled = false;
    }
});
await autoLoadExampleFixtures('divide');
</script>
</body>

</html>
