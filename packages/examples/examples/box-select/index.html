<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 拉框选择 (Box Select)</title>
  <style>
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
    #header { padding: 10px; background: #2c3e50; color: white; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
    #header button { padding: 5px 12px; background: #16a085; color: white; border: 0; border-radius: 3px; cursor: pointer; font-size: 13px; }
    #header button.danger { background: #c0392b; }
    #header button:disabled { background: #7f8c8d; cursor: not-allowed; }
    #map { flex: 1; background: #ffffff; position: relative; outline: none; }
    .hint { opacity: 0.85; font-size: 12px; flex-basis: 100%; }
    .group { display: flex; gap: 6px; align-items: center; }
    #selected-list { background: #34495e; padding: 4px 8px; border-radius: 3px; font-family: monospace; font-size: 12px; max-height: 60px; overflow-y: auto; min-width: 200px; }
  </style>
</head>

<body>
  <div id="header">
    <span class="group">
      <label>文件: <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" /></label>
    </span>
    <span class="group">
      <button id="clear-btn" class="danger" disabled>清空选择</button>
      <button id="delete-btn" class="danger" disabled>删除选中</button>
    </span>
    <span id="status">加载数据后,按住 Shift 拖拽空白处框选要素</span>
    <div id="selected-list">已选: 0</div>
    <span class="hint">
      Shift+拖拽 → replace; Shift+Ctrl(Cmd)+拖拽 → add; Shift+Alt+拖拽 → toggle。
      普通拖拽仍是平移地图。&lt;4 px 的拖拽视为不操作。
    </span>
  </div>
  <div id="map" tabindex="0"></div>

  <link rel="stylesheet" href="../../src/ui/controls.css" />
  <script src="../../dist/mapshaper-vendor.js"></script>
  <script src="../../dist/emap-dev.js"></script>
  <script>
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
    const map = new Emap({ container: 'map' });
    map.addControl(new NavigationControl(), 'top-left');
    map.addControl(new HistoryControl(), 'top-left');
    // Activate shift+drag box selection via the named handler (P2c).
    // Alternative: `map.addControl(new BoxSelectControl())` for a toolbar-button surface.
    map.boxSelect.enable();
    map.bindHistoryShortcuts();

    const SOURCE_ID = 'box-select-source';
    const clearBtn = document.getElementById('clear-btn');
    const deleteBtn = document.getElementById('delete-btn');
    const status = document.getElementById('status');
    const selectedList = document.getElementById('selected-list');

    function refreshSelected() {
      const sel = map.getSelection();
      selectedList.textContent = `已选: ${sel.length}` + (sel.length > 0
        ? ' — ' + sel.slice(0, 8).map((r) => `${r.layer}#${r.id}`).join(', ') + (sel.length > 8 ? ' …' : '')
        : '');
      clearBtn.disabled = sel.length === 0;
      deleteBtn.disabled = sel.length === 0;

      if (sel.length === 0) {
        map.clearHighlightedFeatures();
      } else {
        map.setHighlightedFeatures(sel, { color: '#1e88e5', width: 3 });
      }
    }

    map.on('selectionchange', refreshSelected);

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        // Canonical 0.2.0 recipe: await setData (resolves once the dataset
        // is ready), then addSource (order-independent) + setExtent.
        try {
          await source.setData({ filename: file.name, content });
          map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          status.textContent = `已加载 ${file.name}。Shift+拖拽框选。`;

          // Default styling: outline polygons so selection-highlight shows
          const lyrs = source.getLayers?.() ?? [];
          lyrs.forEach((lyr, i) => {
            const id = `${lyr?.name || `layer-${i}`}-fill`;
            if (map.getLayer(id)) return;
            if (lyr?.geometry_type === 'polygon') {
              map.addLayer({ id, type: 'line', source: SOURCE_ID, 'source-layer': lyr.name, paint: { 'line-color': '#888', 'line-width': 1 } });
            } else if (lyr?.geometry_type === 'polyline') {
              map.addLayer({ id, type: 'line', source: SOURCE_ID, 'source-layer': lyr.name, paint: { 'line-color': '#888', 'line-width': 1 } });
            } else if (lyr?.geometry_type === 'point') {
              map.addLayer({ id, type: 'circle', source: SOURCE_ID, 'source-layer': lyr.name, paint: { 'circle-color': '#888', 'circle-radius': 3 } });
            }
          });
        } catch (err) {
          console.error(err);
        }
      };
      reader.readAsArrayBuffer(file);
    });

    clearBtn.addEventListener('click', () => map.clearSelection());
    deleteBtn.addEventListener('click', () => {
      const ok = map.deleteSelected();
      status.textContent = ok ? '已删除选中要素 (Ctrl+Z 撤销)。' : '删除失败。';
    });

    refreshSelected();
  </script>
</body>

</html>
