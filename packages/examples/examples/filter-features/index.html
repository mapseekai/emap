<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 要素过滤 (Filter)</title>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>要素过滤 (Filter)</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>要素过滤 (Filter)</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" />
        </div>
        <div class="emap-example-field">
          <label for="target">目标图层</label>
          <select id="target"></select>
        </div>
        <div class="emap-example-field">
          <label for="expr">表达式</label>
          <input id="expr" type="text" value="this.pop > 100" />
        </div>
        <div class="emap-example-field">
          <label class="emap-example-check"><input id="invert" type="checkbox" /> 反向</label>
          <label class="emap-example-check"><input id="remove-empty" type="checkbox" /> 同时移除空几何</label>
        </div>
        <button id="btn" class="emap-example-primary-button" disabled>过滤</button>
        <p id="status" class="emap-example-status">加载数据</p>
        <p class="emap-example-hint">
          约定: 表达式判定为 FALSE 的要素将被删除,因此
          <code>this.pop &gt; 100</code> 会 <em>保留</em> 人口大于 100 的要素。
        </p>
      </section>
    </div>
  </details>

  <script type="module">

import { installExampleMapUi } from '/src/example-runtime.ts';
import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
// Filter expressions need `expressionPolicy: 'trusted'`; the library
// default is `'disabled'`.
const map = await Emap.create({ container: 'map', expressionPolicy: 'trusted' });
await map.addControl(new NavigationControl(), 'top-left');
await installExampleMapUi(map, emap);
await map.addControl(new HistoryControl(), 'top-left');
map.bindHistoryShortcuts();
const SOURCE_ID = 'filter-source';
const targetSel = document.getElementById('target');
const exprInput = document.getElementById('expr');
const invertChk = document.getElementById('invert');
const removeEmptyChk = document.getElementById('remove-empty');
const btn = document.getElementById('btn');
const status = document.getElementById('status');
function populate(source) {
    targetSel.innerHTML = '';
    source.getLayers().forEach((lyr, i) => {
        const name = lyr?.name || lyr?.id || `layer-${i}`;
        targetSel.appendChild(new Option(`${name} (${lyr?.geometry_type ?? '?'})`, name));
    });
    btn.disabled = source.getLayers().length === 0;
}
document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file)
        return;
    status.textContent = `正在加载 ${file.name}...`;
    const reader = new FileReader();
    reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID))
            map.removeSource(SOURCE_ID);
        // Load initial data before registration: await setData, then addSource and setExtent.
        try {
            await source.setData({ filename: file.name, content });
            await map.addSource(SOURCE_ID, source);
            map.setExtent(source.getExtent());
            populate(source);
            status.textContent = `已加载 ${file.name}。`;
        }
        catch (err) {
            console.error(err);
            status.textContent = "处理文件出错";
        }
    };
    reader.readAsArrayBuffer(file);
});
btn.addEventListener('click', async () => {
    const target = targetSel.value;
    const expr = exprInput.value.trim();
    const opts = { source: SOURCE_ID, target };
    if (expr)
        opts.expression = expr;
    if (invertChk.checked)
        opts.invert = true;
    if (removeEmptyChk.checked)
        opts.removeEmpty = true;
    status.textContent = `正在过滤 ${target}...`;
    btn.disabled = true;
    try {
        const result = await map.ops.filterFeatures(opts);
        status.textContent = result.ok ? `已过滤 ${target},Ctrl+Z 撤销。` : '过滤失败 (需要表达式或勾选 "同时移除空几何")。';
    }
    finally {
        btn.disabled = false;
    }
});
await autoLoadExampleFixtures('filter-features');
</script>
</body>

</html>
