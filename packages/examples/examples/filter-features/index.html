<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 要素过滤 (Filter)</title>
  <style>
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
    #header { padding: 10px; background: #2c3e50; color: white; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
    #header select, #header input[type="text"] {
      padding: 4px 6px; font-size: 13px; border: 1px solid #4a5d70; border-radius: 3px;
    }
    #header input[type="text"] { width: 240px; font-family: monospace; }
    #header button {
      padding: 5px 12px; background: #c0392b; color: white; border: 0;
      border-radius: 3px; cursor: pointer; font-size: 13px;
    }
    #header button:disabled { background: #7f8c8d; cursor: not-allowed; }
    #map { flex: 1; background: #ffffff; position: relative; outline: none; }
    .hint { opacity: 0.85; font-size: 12px; flex-basis: 100%; }
  </style>
</head>

<body>
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="Open the Emap examples catalog"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap</span></a>
    <label>文件: <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" /></label>
    <label>目标图层: <select id="target"></select></label>
    <label>表达式: <input id="expr" type="text" value="this.pop > 100" /></label>
    <label><input id="invert" type="checkbox" /> 反向</label>
    <label><input id="remove-empty" type="checkbox" /> 同时移除空几何</label>
    <button id="btn" disabled>过滤</button>
    <span id="status">加载数据</span>
    <span class="hint">
      约定: 表达式判定为 FALSE 的要素将被删除,因此
      <code>this.pop &gt; 100</code> 会 <em>保留</em> 人口大于 100 的要素。
    </span>
  </div>
  <div id="map" tabindex="0"></div>

  <script type="module">
    import { installExampleMapUi } from '/src/example-runtime.ts';
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
    // Filter expressions need `expressionPolicy: 'trusted'`; the library
    // default is `'disabled'`.
    const map = new Emap({ container: 'map', expressionPolicy: 'trusted' });
    map.addControl(new NavigationControl(), 'top-left');
    installExampleMapUi(map, emap);
    map.addControl(new HistoryControl(), 'top-left');
    map.bindHistoryShortcuts();

    const SOURCE_ID = 'filter-source';
    const targetSel = document.getElementById('target');
    const exprInput = document.getElementById('expr');
    const invertChk = document.getElementById('invert');
    const removeEmptyChk = document.getElementById('remove-empty');
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');

    function populate(source) {
      targetSel.innerHTML = '';
      source.getLayers().forEach((lyr, i) => {
        const name = lyr?.name || lyr?.id || `layer-${i}`;
        targetSel.appendChild(new Option(`${name} (${lyr?.geometry_type ?? '?'})`, name));
      });
      btn.disabled = source.getLayers().length === 0;
    }

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `正在加载 ${file.name}...`;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const content = new Uint8Array(ev.target.result);
        const source = new TopologySource(SOURCE_ID);
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
        // Canonical 0.2.0 recipe: await setData (resolves once the dataset
        // is ready), then addSource (order-independent) + setExtent.
        try {
          await source.setData({ filename: file.name, content });
          await map.addSource(SOURCE_ID, source);
          map.setExtent(source.getExtent());
          populate(source);
          status.textContent = `已加载 ${file.name}。`;
        } catch (err) {
          console.error(err);
          status.textContent = "处理文件出错";
        }
      };
      reader.readAsArrayBuffer(file);
    });

    btn.addEventListener('click', async () => {
      const target = targetSel.value;
      const expr = exprInput.value.trim();
      const opts = { source: SOURCE_ID, target };
      if (expr) opts.expression = expr;
      if (invertChk.checked) opts.invert = true;
      if (removeEmptyChk.checked) opts.removeEmpty = true;
      status.textContent = `正在过滤 ${target}...`;
      btn.disabled = true;
      try {
        const ok = await map.ops.filterFeatures(opts);
        status.textContent = ok ? `已过滤 ${target},Ctrl+Z 撤销。` : '过滤失败 (需要表达式或勾选 "同时移除空几何")。';
      } finally {
        btn.disabled = false;
      }
    });
    await autoLoadExampleFixtures('filter-features');
  </script>
</body>

</html>
