<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 多源快照 (.msx) 保存 / 恢复</title>
  <style>
    .emap-example-workbench button.danger { border-color: var(--emap-example-error); color: var(--emap-example-error); }
    .source-list { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; }
    .source-list span {
      padding: 3px 8px;
      border: 1px solid var(--emap-example-border);
      background: var(--emap-example-muted);
      font-size: 11px;
    }
    .source-list span.empty { color: var(--emap-example-muted-foreground); }
  </style>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>多源快照 (.msx) 保存 / 恢复</strong>
  </div>
  <div id="map" tabindex="0"></div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>多源快照 (.msx) 保存 / 恢复</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">添加数据源 (每个文件 = 一个新源)</label>
          <input id="file-input" type="file" accept=".geojson,.json,.topojson,.zip" multiple />
        </div>
        <div class="emap-example-field">
          <label for="snapshot-input">恢复快照 (.msx,可包含多源)</label>
          <input id="snapshot-input" type="file" accept=".msx" />
        </div>
        <div class="emap-example-field">
          <label for="filename">快照文件名</label>
          <input id="filename" type="text" value="workspace.msx" />
        </div>
        <button id="save-btn" class="emap-example-primary-button" disabled>保存全部源 (.msx)</button>
        <div class="emap-example-row">
          <button id="clear-btn" class="danger" disabled>清空</button>
        </div>
        <p id="status" class="emap-example-status">添加多个数据源,然后保存为单个 .msx 文件;之后可整体恢复。</p>
        <div class="source-list" id="source-list"><span class="empty">(尚无数据源)</span></div>
        <p class="emap-example-hint">
          <code>Emap.exportSnapshot()</code> 把所有 topology 源打成一个 .msx,带上源 ID。
          <code>Emap.loadSnapshot(blob)</code> 反向恢复,返回新源的 ID 列表。
          历史与选择会被清空(因为旧的 feature ID 已不再有效)。
        </p>
      </section>
    </div>
  </details>

  <script type="module">

import { installExampleMapUi } from '/src/example-runtime.ts';
import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';
const emap = await loadExampleRuntime();
const { Emap, TopologySource, NavigationControl, HistoryControl } = emap;
const map = await Emap.create({ container: 'map' });
await map.addControl(new NavigationControl(), 'top-left');
await installExampleMapUi(map, emap);
await map.addControl(new HistoryControl(), 'top-left');
map.bindHistoryShortcuts();
const fileInput = document.getElementById('file-input');
const snapshotInput = document.getElementById('snapshot-input');
const filenameInput = document.getElementById('filename');
const saveBtn = document.getElementById('save-btn');
const clearBtn = document.getElementById('clear-btn');
const status = document.getElementById('status');
const sourceList = document.getElementById('source-list');
/** Tracks every source ID we've registered so the UI can list them. */
const sourceIds = new Set();
function refreshSourceList() {
    sourceList.innerHTML = '';
    if (sourceIds.size === 0) {
        const e = document.createElement('span');
        e.className = 'empty';
        e.textContent = '(尚无数据源)';
        sourceList.appendChild(e);
    }
    else {
        for (const id of sourceIds) {
            const src = map.getSource(id);
            const layers = src?.getLayers?.() ?? [];
            const span = document.createElement('span');
            span.textContent = `${id} · ${layers.length} 图层`;
            sourceList.appendChild(span);
        }
    }
    saveBtn.disabled = sourceIds.size === 0;
    clearBtn.disabled = sourceIds.size === 0;
}
function uniqueSourceId(base) {
    let id = base;
    let n = 1;
    while (map.getSource(id)) {
        id = `${base}-${n++}`;
    }
    return id;
}
function fitFirstSource() {
    const first = sourceIds.values().next().value;
    if (!first)
        return;
    const src = map.getSource(first);
    if (src?.getExtent)
        map.setExtent(src.getExtent());
}
function readFile(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => resolve(new Uint8Array(ev.target.result));
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
    });
}
fileInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length === 0)
        return;
    for (const file of files) {
        try {
            const content = await readFile(file);
            const baseId = file.name.replace(/\.[^.]+$/, '') || 'source';
            const id = uniqueSourceId(baseId);
            status.textContent = `加载 ${file.name} 为源 "${id}"...`;
            const source = new TopologySource(id);
            // Load initial data before registration: await setData, then addSource.
            await source.setData({ filename: file.name, content });
            await map.addSource(id, source);
            sourceIds.add(id);
            refreshSourceList();
            fitFirstSource();
        }
        catch (err) {
            console.error(err);
            status.textContent = `加载 ${file.name} 失败: ${err?.message ?? err}`;
        }
    }
    fileInput.value = '';
    status.textContent = `当前 ${sourceIds.size} 个源,可保存为快照。`;
});
snapshotInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file)
        return;
    status.textContent = `正在恢复快照 ${file.name}...`;
    try {
        // Replace existing sources with snapshot contents
        for (const id of Array.from(sourceIds)) {
            map.removeSource(id);
            sourceIds.delete(id);
        }
        const bytes = await readFile(file);
        const restored = await map.loadSnapshot(bytes);
        restored.forEach((id) => sourceIds.add(id));
        refreshSourceList();
        fitFirstSource();
        status.textContent = `已恢复 ${restored.length} 个源: ${restored.join(', ')}`;
    }
    catch (err) {
        console.error(err);
        status.textContent = `恢复失败: ${err?.message ?? err}`;
    }
    snapshotInput.value = '';
});
saveBtn.addEventListener('click', async () => {
    if (sourceIds.size === 0)
        return;
    const name = (filenameInput.value.trim() || 'workspace.msx').replace(/\.+$/, '');
    const filename = name.endsWith('.msx') ? name : `${name}.msx`;
    status.textContent = `正在打包 ${sourceIds.size} 个源到 ${filename}...`;
    saveBtn.disabled = true;
    try {
        const blob = await map.exportSnapshot();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        status.textContent = `已下载 ${filename} (${(blob.size / 1024).toFixed(1)} KB,${sourceIds.size} 个源)。`;
    }
    catch (err) {
        status.textContent = `导出失败: ${err?.message ?? err}`;
        console.error(err);
    }
    finally {
        saveBtn.disabled = false;
    }
});
clearBtn.addEventListener('click', () => {
    for (const id of Array.from(sourceIds)) {
        map.removeSource(id);
    }
    sourceIds.clear();
    refreshSourceList();
    status.textContent = '已清空全部源。';
});
refreshSourceList();
await autoLoadExampleFixtures('snapshot');
</script>
</body>

</html>
