<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emap 示例 - 要素属性查询</title>
  <style>
    #panel {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 280px;
      max-height: 60vh;
      overflow: auto;
      background: var(--emap-banner-bg);
      border: 1px solid var(--emap-example-border);
      padding: 10px;
      font-size: 12px;
      /* 高于 emap 控件容器的 z-index (10),否则会被画布覆盖无法操作 */
      z-index: 20;
    }

    #panel h3 {
      margin: 0 0 8px 0;
      font-size: 13px;
    }

    #panel pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body class="emap-example-with-floating-header">
  <div id="header">
    <a class="emap-example-banner-brand" href="/mapseekai/emap/examples/" aria-label="返回 Emap 示例目录"><img src="/mapseekai/emap/examples/emap.svg" alt="" /><span>Emap / Examples</span></a>
    <strong>要素属性查询</strong>
  </div>
  <div id="map" tabindex="0">
    <div id="panel">
      <h3>要素属性</h3>
      <pre id="attributes">(点击地图上的要素)</pre>
    </div>
  </div>

  <details class="emap-example-workbench panel" open>
    <summary><h1>要素属性查询</h1></summary>
    <div class="emap-example-workbench-body">
      <section class="emap-example-section">
        <div class="emap-example-field">
          <label for="file-input">文件</label>
          <input type="file" id="file-input" accept=".json,.geojson,.zip" />
        </div>
        <div class="emap-example-field">
          <label for="layer-select">图层</label>
          <select id="layer-select">
            <option value="">全部</option>
          </select>
        </div>
        <div class="emap-example-field">
          <label for="hl-color">颜色</label>
          <input type="color" id="hl-color" value="#ff7a00" />
        </div>
        <div class="emap-example-field">
          <label for="hl-width">线宽</label>
          <input type="number" id="hl-width" min="0.5" step="0.1" value="2.5" />
        </div>
        <div class="emap-example-field">
          <label for="hl-radius">点半径</label>
          <input type="number" id="hl-radius" min="1" step="1" value="6" />
        </div>
        <div class="emap-example-field">
          <label class="emap-example-check"><input type="checkbox" id="hl-fill" checked /> 填充</label>
        </div>
        <p id="status" class="emap-example-status">上传 GeoJSON 文件开始</p>
      </section>
    </div>
  </details>

  <script type="module">
    import { installExampleMapUi } from '/src/example-runtime.ts';
    import { autoLoadExampleFixtures, loadExampleRuntime } from '/src/example-runtime.ts';

    const emap = await loadExampleRuntime();
    const { Emap, TopologySource } = emap;

    const map = new Emap({
      container: "map",
    });

    map.addControl(new emap.NavigationControl(), "top-left");
    installExampleMapUi(map, emap);

    const fileInput = document.getElementById("file-input");
    const status = document.getElementById("status");
    const layerSelect = document.getElementById("layer-select");
    const attributes = document.getElementById("attributes");
    const hlColor = document.getElementById("hl-color");
    const hlWidth = document.getElementById("hl-width");
    const hlRadius = document.getElementById("hl-radius");
    const hlFill = document.getElementById("hl-fill");
    const mapContainer = map.getCanvasContainer();

    let activeSource = null;

    function populateLayers(source) {
      layerSelect.innerHTML = '<option value="">全部</option>';
      const layers = source.getLayers();
      layers.forEach((layer, idx) => {
        const name = layer?.name || layer?.id || `layer-${idx}`;
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        layerSelect.appendChild(option);
      });
    }

    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      status.textContent = `处理 ${file.name} 中...`;
      attributes.textContent = "(点击地图上的要素)";
      map.clearHighlightedFeatures();

      try {
        const reader = new FileReader();
        reader.onload = async (event) => {
          const content = new Uint8Array(event.target.result);
          const source = new TopologySource("test-source");

          if (map.getSource("test-source")) {
            map.removeSource("test-source");
          }
          activeSource = source;

          // Canonical 0.2.0 recipe: await setData (resolves once the dataset
          // is ready), then addSource (order-independent) + setExtent.
          try {
            await source.setData({
              filename: file.name,
              content: content,
            });
            await map.addSource("test-source", source);
            map.setExtent(source.getExtent());
            populateLayers(source);
            status.textContent = `当前: ${file.name}`;
          } catch (e) {
            console.error(e);
            status.textContent = "处理文件出错";
          }
        };
        reader.readAsArrayBuffer(file);
      } catch (err) {
        console.error(err);
        status.textContent = "处理文件出错";
      }
    });

    mapContainer.addEventListener("click", (e) => {
      if (!activeSource) return;
      const rect = mapContainer.getBoundingClientRect();
      const point = [e.clientX - rect.left, e.clientY - rect.top];
      const layers = layerSelect.value ? [layerSelect.value] : undefined;
      const features = map.queryFeatures(point, { layers });

      if (!features.length) {
        attributes.textContent = "(未命中要素)";
        map.clearHighlightedFeatures();
        return;
      }

      map.setHighlightedFeatures(features, {
        color: hlColor.value,
        width: Number(hlWidth.value) || 2.5,
        radius: Number(hlRadius.value) || 6,
        fill: !!hlFill.checked,
      });
      attributes.textContent =
        `命中 ${features.length} 个要素\n\n` +
        JSON.stringify(features[0].properties, null, 2);
    });

    window.addEventListener("resize", () => {
      map.resize();
    });
    await autoLoadExampleFixtures('feature-attributes');
  </script>
</body>

</html>
